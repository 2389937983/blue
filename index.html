/* ── D3 · RENDER PIPELINE ───────────────────────────────────────────── */
var navTimers = [], replyTimers = [];
function later(fn, ms) {
  var id = setTimeout(function () {
    navTimers = navTimers.filter(function (x) { return x !== id; });
    fn();
  }, ms);
  navTimers.push(id);
  return id;
}
/* 朋友圈/信箱的「TA 隔一会儿才来」计时器。故意不去挂 navTimers —— 那个数组
   在每次换路由时会被清空,人一走开点赞和回信就永远不发生了。 */
var socialTimers = [];
function socialLater(fn, ms) {
  var id = setTimeout(function () {
    socialTimers = socialTimers.filter(function (x) { return x !== id; });
    try { fn(); } catch (e) { /* 一个延迟动作炸了,不该把别的动作带走 */ }
  }, ms);
  socialTimers.push(id);
  return id;
}
function dropSocialTimers() { socialTimers.forEach(clearTimeout); socialTimers = []; }

function dropNavTimers() {
  navTimers.forEach(clearTimeout);
  navTimers = [];
}

function paint() {
  if (state.route === 'home') { paintHome(); paintSheet(); return; }
  var root = $('#appRoot');
  if (!root) return;

  var prev = root.querySelector('.app-body');
  var keepScroll = prev ? prev.scrollTop : 0;
  var act = document.activeElement;
  var focusId = (act && act.id && root.contains(act)) ? act.id : null;
  var caret = null;
  if (focusId) { try { caret = act.selectionStart; } catch (e) { caret = null; } }

  root.innerHTML = SCREENS[state.route](state.param);

  var body = root.querySelector('.app-body');
  if (body) body.scrollTop = (state.route === 'chat-thread') ? body.scrollHeight : keepScroll;

  paintSheet();
  paintOverlay();

  /* the progress bar animates from zero on a fresh element, so the fill grows
     instead of snapping when an answer changes */
  var fill = root.querySelector('.progress-fill');
  if (fill && fill.style.width !== '0%') {
    var target = fill.style.width;
    fill.style.width = '0%';
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { fill.style.width = target; });
    });
  }

  if (focusId) {
    var again = document.getElementById(focusId);
    if (again) {
      again.focus();
      if (caret !== null && again.setSelectionRange) {
        try { again.setSelectionRange(caret, caret); } catch (e) { /* not a text field */ }
      }
    }
  }
  syncMusicTimer();
  syncCallTimer();
}

function paintHome() {
  var el = document.getElementById('homeScreen');
  if (el) el.innerHTML = renderHome();
}

/* ── D4 · LONG-LIVED TIMERS ─────────────────────────────────────────────
   One interval each, module scope, never inside a container that gets
   rewritten: leaving the route clears it, re-entering recreates exactly one. */
var callTimer = null;

/* 这里以前挂着「假进度」的 setInterval,每 20 行还有一份 TRACKS 在装播放。
   换成真 <audio> 之后进度由 timeupdate 驱动,这个函数只剩一件事:每次重绘
   之后把新画出来的读数对齐真实播放状态(重绘会新建 DOM,进度条宽度和播放键
   图标都会回到初值)。 */
function syncMusicTimer() {
  musSyncUi();
}

/* 通话的心跳只在这一个地方,而且**key 在「会话是否接通」上,不是在哪一屏** ——
   收起成小窗之后用户会去逛别的页面,通话不能跟着路由一起死。
   500ms 只是刷新读数;**是否中途挂断由 hgNextSec 做检查点门**(每 hgSec 秒
   才真掷一次),否则 500ms 一掷会把概率放大成必然(和陪伴离开同型的事故)。 */
function syncCallTimer() {
  var talking = (state.call.phase === 'talking');
  if (talking && !callTimer) {
    callTimer = setInterval(callTick, 500);
  } else if (!talking && callTimer) {
    clearInterval(callTimer); callTimer = null;
  }
}

function callTick() {
  if (state.call.phase !== 'talking') { syncCallTimer(); return; }
  /* 时长从 connectTs 现算,不靠「每次 +1」累加 —— 定时器被节流也不会走慢 */
  state.call.sec = Math.floor((Date.now() - state.call.connectTs) / 1000);
  var txt = callClock(state.call.sec);
  var el = document.getElementById('callTimer');
  if (el) el.textContent = txt;
  var mt = document.getElementById('callMiniTxt');
  if (mt) mt.textContent = '通话中 ' + txt;
  if (callShouldHangup()) callHangup('taHangup');
}

/* ── 第10单 · 通话状态机 ─────────────────────────────────────────────── */
/* 结局落地的定时器自己管,不挂 navTimers —— 那个数组每次换路由都会被清空,
   挂上去的话「正在呼叫…」还没落地就被用户一走神清掉了,这一通永远悬着。 */
var callFlowTimer = null;
function callClearFlow() {
  if (callFlowTimer) { clearTimeout(callFlowTimer); callFlowTimer = null; }
}
function callBusyNow() { return state.call.phase !== 'idle'; }

/* 掷一次呼出结局:先命中者生效,三概率之外的余量 = 无人接听 */
function callRoll() {
  var c = callSet(), r = Math.random() * 100;
  if (r < c.busyP) return 'busy';
  if (r < c.busyP + c.declineP) return 'rejected';
  if (r < c.busyP + c.declineP + c.answerP) return 'answered';
  return 'noanswer';
}

function callReset(cid, dir) {
  state.call = {
    phase: 'idle', with: cid || 'c1', dir: dir || 'out', roll: '', sec: 0, connectTs: 0,
    hgNextSec: 0, muted: false, speaker: false, keypad: false, added: false, mini: false
  };
}

/* 拨出去。**单一会话门**:正在通话时再拨号要被拦下来(验收7) */
function callDial(cid) {
  if (callBusyNow()) { toast('正在通话中，先结束这一通', 'close'); return false; }
  if (!cid || !person(cid)) { toast('找不到这个人', 'close'); return false; }
  callClearFlow();
  callReset(cid, 'out');
  state.call.phase = 'calling';
  /* 模拟通话关掉 → 必定接通,不掷结局(给「只想用通话界面」的人一个省心模式) */
  state.call.roll = callSet().sim ? callRoll() : 'answered';
  go('#call-out/' + cid);
  callScheduleOutcome();
  return true;
}

/* 呼出的结局按工单的时间落地:忙线 1.4s / 拒接 2.4s / 无人接听 7s 超时 / 接通前先响 2.2s */
function callScheduleOutcome() {
  var roll = state.call.roll || 'answered';
  callClearFlow();
  callFlowTimer = setTimeout(function () {
    callFlowTimer = null;
    if (state.call.phase !== 'calling') return;   /* 中途取消/换了会话就别再落 */
    if (roll === 'answered') callConnect();
    else callEndOut(roll);
  }, CALL_RING_MS[roll] || CALL_RING_MS.answered);
}

/* 接通(呼出命中 or 来电接听) */
function callConnect() {
  if (state.call.phase === 'idle') return false;
  state.call.phase = 'talking';
  state.call.connectTs = Date.now();
  state.call.sec = 0;
  state.call.hgNextSec = 0;        /* 挂断检查点从保护期之后起算 */
  state.call.mini = false;
  callClearFlow();
  syncCallTimer();
  var want = '#call-active/' + state.call.with;
  /* 从小窗点「展开」时路由本来就是这一屏,hashchange 不会触发,得自己重画 */
  if (location.hash === want) { renderCallMini(); paint(); }
  else go(want);
  return true;
}

/* 呼出没接通:记账 + 卡片 + 提示(忙线时 TA 会补一句话) */
function callEndOut(outcome) {
  var cid = state.call.with;
  callClearFlow();
  callRecord(cid, 'out', outcome, 0);
  callReset(cid, 'out');
  syncCallTimer();
  renderCallMini();
  pushCallCard(cid, 'out', outcome, 0);
  if (outcome === 'busy') pushSysLine(cid, pick(['在开会，等下打给你。', '手上有点事，晚点回你。', '在忙，待会儿说。']));
  toast(CALL_LABEL[outcome] || outcome, 'phoneEnd');
  go('#chat-thread/' + cid);
}

/* 呼叫中按取消 → 当作「已挂断」记一条(时长 0) */
function callCancelOut() {
  if (state.call.phase !== 'calling') return false;
  var cid = state.call.with;
  callClearFlow();
  callRecord(cid, 'out', 'meHangup', 0);
  callReset(cid, 'out');
  syncCallTimer();
  renderCallMini();
  pushCallCard(cid, 'out', 'meHangup', 0);
  toast('已取消呼叫', 'phoneEnd');
  go('#chat-thread/' + cid);
  return true;
}

/* 挂断:我按的挂断、TA 中途挂断都走这里(时长从 connectTs 现算) */
function callHangup(outcome) {
  if (state.call.phase !== 'talking') return false;
  var cid = state.call.with, dir = state.call.dir || 'out';
  var oc = outcome || 'meHangup';
  var sec = Math.max(1, Math.round((Date.now() - state.call.connectTs) / 1000));
  callClearFlow();
  callRecord(cid, dir, oc, sec);
  callReset(cid, dir);
  syncCallTimer();
  renderCallMini();
  pushCallCard(cid, dir, oc, sec);
  toast((oc === 'taHangup' ? person(cid).name + ' 那边先挂了' : '通话已结束') +
    ' · ' + callDurText(sec), 'phoneEnd');
  go('#chat-thread/' + cid);
  return true;
}

/* TA 中途挂断判定(验收2):hangupRate = **每个检查点**的概率(不是整场一次),
   保护期(10 秒)过后每 hgSec 秒掷一次,由 hgNextSec 把门。 */
function callShouldHangup() {
  if (state.call.phase !== 'talking') return false;
  var c = callSet();
  if (!c.hangupOn) return false;
  if (c.hangupP <= 0) return false;
  var el = Math.floor((Date.now() - state.call.connectTs) / 1000);
  if (el < CALL_PROTECT_SEC) return false;                 /* 前 10 秒保护期 */
  var hg = Math.max(1, Math.round(c.hgSec) || CALL_DEF.hgSec);
  if (!state.call.hgNextSec || state.call.hgNextSec < CALL_PROTECT_SEC) state.call.hgNextSec = CALL_PROTECT_SEC;
  if (el < state.call.hgNextSec) return false;             /* 没到检查点:不掷 */
  state.call.hgNextSec = el + hg;                          /* 排下一个检查点 */
  return Math.random() * 100 < c.hangupP;
}

/* ── TA 来电(挂调度中心)+ 漏接 ─────────────────────────────────────── */
function callRingIn(cid) {
  if (callBusyNow()) return false;
  if (!cid || !person(cid)) return false;
  callClearFlow();
  callReset(cid, 'in');
  state.call.phase = 'incoming';
  go('#call-incoming/' + cid);
  callFlowTimer = setTimeout(function () {
    callFlowTimer = null;
    if (state.call.phase !== 'incoming') return;
    callMissedIn();
  }, Math.max(5, Math.round(callSet().ringSec)) * 1000);
  return true;
}
function callAnswer() {
  if (state.call.phase !== 'incoming') return false;
  state.call.dir = 'in';
  toast('已接通', 'phone');
  return callConnect();
}
function callMissedIn() {
  var cid = state.call.with;
  callClearFlow();
  callRecord(cid, 'in', 'missed', 0);
  callReset(cid, 'in');
  syncCallTimer();
  renderCallMini();
  pushCallCard(cid, 'in', 'missed', 0);
  toast('漏接了' + person(cid).name + '的电话', 'phoneEnd');
  go('#chat-thread/' + cid);
}
function callDeclineIn() {
  var cid = state.call.with;
  callClearFlow();
  callRecord(cid, 'in', 'rejected', 0);
  callReset(cid, 'in');
  syncCallTimer();
  renderCallMini();
  pushCallCard(cid, 'in', 'rejected', 0);
  toast('已拒接来电', 'phoneEnd');
  go('#chat-thread/' + cid);
}

/* ── 记账 + 卡片 ─────────────────────────────────────────────────────── */
function callRecord(cid, dir, outcome, sec) {
  var now = new Date();
  var r = {
    id: uid('cl'), cid: cid || '', dir: dir === 'in' ? 'in' : 'out',
    outcome: CALL_LABEL[outcome] ? outcome : 'meHangup',
    sec: Math.max(0, Math.round(sec || 0)),
    ts: now.getTime(), day: dayKey(now), time: nowTime()
  };
  CALL_LOG.unshift(r);
  if (CALL_LOG.length > 200) CALL_LOG.length = 200;
  save();
  return r;
}
/* 通话卡片进聊天流(type:'call'),结局与时长都印在卡上(验收3) */
function pushCallCard(cid, dir, outcome, sec) {
  var c = chatOf(cid);
  if (!c) return null;
  var m = {
    me: dir === 'out', who: cid, type: 'call', text: '', time: nowTime(), seen: true,
    call: { dir: dir === 'in' ? 'in' : 'out', outcome: outcome, sec: Math.max(0, Math.round(sec || 0)) }
  };
  c.msgs.push(m);
  c.time = '刚刚';
  return m;
}
function pushSysLine(cid, text) {
  var c = chatOf(cid);
  if (!c) return null;
  var m = { me: false, who: cid, type: 'text', text: String(text || ''), time: nowTime(), seen: true };
  c.msgs.push(m);
  return m;
}

/* ── 通话小窗(悬浮球):可拖动 + 位置记忆(验收5) ───────────────────────
   小窗常驻在 #viewport 里的 #callMiniHost 上 —— 路由重绘只碰 #appRoot,
   碰不到它,所以收起之后逛任何页面通话都不断。
   拖动一律 absolute + 局部坐标换算:.viewport 的 getBoundingClientRect() 给的是
   **视觉**矩形(整机可能被 zoom 缩放),而 left/top 用的是**未缩放布局像素**;
   直接用 clientX 写 left 就会「跟手但始终差一段固定距离」——第10单踩坑记录里
   的同一个坑。所以:抓取偏移用视觉坐标记,移动时整体换算回局部。 */
function callMiniEl() { return document.getElementById('callMini'); }
function callMiniRect() {
  var vp = document.getElementById('viewport');
  if (vp && vp.getBoundingClientRect) {
    var r = vp.getBoundingClientRect();
    if (r && r.width) {
      return { s: r.width / CALL_BASE_W, left: r.left, top: r.top, w: CALL_BASE_W, h: CALL_BASE_H };
    }
  }
  return { s: 1, left: 0, top: 0, w: CALL_BASE_W, h: CALL_BASE_H };
}
function renderCallMini() {
  var host = document.getElementById('callMiniHost');
  if (!host) return;
  /* 通话中只要**不在**那张全屏通话屏上,小窗就该在 —— 不管是点「收起」收的,
     还是用户直接导航走人的。否则「正在通话」会彻底没有可见提示,
     用户既看不到通话还在、也没有入口回去(hole 是验收时才发现的)。 */
  var show = (state.call.phase === 'talking') &&
             (!!state.call.mini || state.route !== 'call-active');
  var bar = callMiniEl();
  if (!show) { if (bar) bar.hidden = true; return; }
  if (!bar) {
    host.innerHTML = '<div class="call-mini" id="callMini" data-od-id="call-mini">' +
      '<span class="cm-dot"></span>' +
      '<span class="cm-txt" id="callMiniTxt">通话中 00:00</span>' +
      '<button class="cm-btn" data-act="call-expand" data-od-id="call-mini-expand" aria-label="展开通话">展开</button>' +
      '<button class="cm-btn cm-end" data-act="call-mini-end" data-od-id="call-mini-end" aria-label="直接挂断">' +
        ic('close') + '</button></div>';
    bar = callMiniEl();
    bindCallMiniDrag(bar);
  }
  var p = normMiniPos(S.callMini);
  if (p.x != null && p.y != null) {
    bar.style.left = p.x + 'px'; bar.style.top = p.y + 'px';
    bar.style.right = 'auto'; bar.style.bottom = 'auto';
  }
  bar.hidden = false;
  var txt = document.getElementById('callMiniTxt');
  if (txt) txt.textContent = '通话中 ' + callClock(state.call.sec);
}
function bindCallMiniDrag(bar) {
  if (!bar || !bar.addEventListener) return;
  var drag = null;
  bar.addEventListener('pointerdown', function (e) {
    if (e.target && e.target.closest && e.target.closest('button')) return;  /* 按钮不触拖动 */
    var r = bar.getBoundingClientRect();
    drag = { dx: (e.clientX || 0) - r.left, dy: (e.clientY || 0) - r.top };
    try { if (bar.setPointerCapture && e.pointerId != null) bar.setPointerCapture(e.pointerId); } catch (err) { /* 合成事件没有真指针 */ }
    bar.classList.add('is-drag');
  });
  bar.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var f = callMiniRect();
    /* offsetWidth/Height 就是未缩放的布局尺寸,和局部坐标同一量纲 —— 夹取用它,
       不能用 window.innerWidth/Height(那会把小窗夹到机身外面去) */
    var w = bar.offsetWidth || 160, h = bar.offsetHeight || 38;
    var lx = ((e.clientX || 0) - drag.dx - f.left) / f.s;
    var ly = ((e.clientY || 0) - drag.dy - f.top) / f.s;
    lx = Math.max(0, Math.min(f.w - w, lx));
    ly = Math.max(0, Math.min(f.h - h, ly));
    bar.style.left = lx + 'px'; bar.style.top = ly + 'px';
    bar.style.right = 'auto'; bar.style.bottom = 'auto';
  });
  function drop() {
    if (!drag) return;
    drag = null;
    bar.classList.remove('is-drag');
    var f = callMiniRect(), r = bar.getBoundingClientRect();
    /* 记忆**局部坐标**:恒定在 390×844 基准里,换窗口尺寸/换缩放都能原处还原 */
    S.callMini = normMiniPos({ x: (r.left - f.left) / f.s, y: (r.top - f.top) / f.s });
    /* 顺手把 DOM 也对齐成同一个整数 —— 不补这一下的话 inline style 会留着
       「119.346px」这种浮点、和存档的 119 差半像素,以后复查时还得解释
       「为什么 DOM 和 storage 不一样」。归一失败(x/y 为 null)就别写 'nullpx'。 */
    if (S.callMini.x != null && S.callMini.y != null) {
      bar.style.left = S.callMini.x + 'px';
      bar.style.top = S.callMini.y + 'px';
      bar.style.right = 'auto';
      bar.style.bottom = 'auto';
    }
    save();
  }
  bar.addEventListener('pointerup', drop);
  bar.addEventListener('pointercancel', drop);
}

/* ── D4c · EMOJI RUNTIME(第9单:发送 / 导入 / TA 甩表情) ──────────────── */
/* 面板要重画时的统一出口:在哪一层开的面板就只重画那一层 */
function emojiRepaint() {
  if (state.panel === 'sticker') { renderChatPanel(); return; }
  if (state.sheet) { paintSheet(); return; }
  paint();
}

/* 点选即发送:表情单独成一条消息;发完也触发 TA 回复(第9单第6条) */
function sendSticker(id) {
  var it = emojiById(id);
  if (!it) { toast('这个表情不见了', 'close'); return; }
  var cid = emojiActiveCid();
  var c = chatOf(cid);
  c.msgs.push({ me: true, type: 'sticker', stk: it.id, text: '', time: nowTime(), rd: false });
  c.time = '刚刚';
  state.panel = null;
  state.sheet = null;
  save();
  paint();
  scheduleReply(cid);
}

/* 写信插入:正文里留 [img:id] 记号,寄出/展示时由 letterBodyHTML 解析回表情 */
function emojiInsertToken(id) {
  var it = emojiById(id);
  if (!it) { toast('这个表情不见了', 'close'); return; }
  var token = '[img:' + it.id + ']';
  var box = document.getElementById('letterBody');
  var at = 0;
  if (box) {
    at = (box.selectionStart === null || box.selectionStart === undefined) ? box.value.length : box.selectionStart;
    box.value = box.value.slice(0, at) + token + box.value.slice(at);
    state.composing.body = box.value;
  } else {
    state.composing.body = String(state.composing.body || '') + token;
  }
  state.sheet = null;
  clearComposeError();
  paint();
  var again = document.getElementById('letterBody');
  if (again) {
    again.focus();
    try { again.setSelectionRange(at + token.length, at + token.length); } catch (e) { /* noop */ }
  }
  toast('已插入表情', 'image');
}

/* 单张压缩:长边不超过 MAX、按原比例、不裁剪;失败一律回调空串(批量要能跳过) */
function emojiCompress(file, cb) {
  var MAX = 360;
  var fail = function () { cb(''); };
  try {
    if (!file || !/^image\//.test(file.type || '')) { fail(); return; }
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        try {
          var w = img.width, h = img.height;
          if (!w || !h) { fail(); return; }
          var k = Math.min(1, MAX / Math.max(w, h));
          var cv = document.createElement('canvas');
          cv.width = Math.max(1, Math.round(w * k));
          cv.height = Math.max(1, Math.round(h * k));
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          /* 透明底的贴纸(PNG/WebP/GIF)必须走 PNG,否则透明区会被压成黑/白块 */
          var keepAlpha = /png|webp|gif|svg/i.test(file.type || '');
          var out = '';
          try { out = keepAlpha ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg', 0.82); }
          catch (e) { out = ''; }
          cb(out);
        } catch (e) { fail(); }
      };
      img.onerror = fail;
      img.src = String(fr.result);
    };
    fr.onerror = fail;
    fr.readAsDataURL(file);
  } catch (e) { fail(); }
}

/* 相册多选批量导入:进度写进 #emjProg,单张坏了跳过不中断 */
function emojiPickFiles(tabId) {
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.multiple = true;                     /* 一次选 N 张 */
  inp.accept = 'image/*';
  inp.style.display = 'none';
  document.body.appendChild(inp);
  inp.onchange = function () {
    var files = inp.files || [];
    try { document.body.removeChild(inp); } catch (e) { /* already gone */ }
    if (!files.length) return;
    emojiImportFiles(files, tabId);
  };
  inp.click();
}

function emojiImportFiles(files, tabId) {
  var total = files.length, done = 0, ok = 0, full = false;
  if (!total) { toast('没有选到图片', 'image'); return; }
  var box = document.getElementById('emjProg');
  var say = function (d, n) { if (box) box.textContent = '已处理 ' + d + '/' + n; };
  say(0, total);
  toast('开始导入 ' + total + ' 张…', 'upload');
  var finish = function () {
    if (done !== total) return;
    save();
    emojiRepaint();
    var skipped = total - ok;
    if (!ok) { toast(full ? '表情太多了，先删掉一些再导入' : '这些图都没能读出来，换几张试试', 'close'); return; }
    toast('成功添加 ' + ok + ' 张' + (skipped ? '（' + skipped + ' 张跳过）' : ''), 'check');
  };
  Array.prototype.forEach.call(files, function (f) {
    emojiCompress(f, function (dataURL) {
      done++;
      if (dataURL) {
        if (EMOJI.items.length < EMOJI_MAX) {
          EMOJI.items.push({ id: uid('e'), tab: tabId, ch: '', img: dataURL, on: true });
          ok++;
        } else { full = true; }
      }
      say(done, total);
      finish();
    });
  });
}

/* 表情被删 → 把引用它的消息清干净,免得聊天流里留下点不动的空壳 */
function pruneStickerMsgs(id) {
  for (var i = 0; i < CHATS.length; i++) {
    var msgs = CHATS[i].msgs || [];
    for (var j = 0; j < msgs.length; j++) {
      if (msgs[j].stk === id) {
        delete msgs[j].stk;
        if (msgs[j].type === 'sticker') { msgs[j].type = 'text'; msgs[j].text = '（表情）'; }
      }
    }
  }
}

/* 梦角甩表情:任何一次发消息(回复/主动)都先问这里。
   概率 stkProb(0~100),池子 = 面板所选 tab 的可见表情(隐藏项与坏档都抽不到)。 */
function taStickerPlan(cid) {
  var st = S.settings.emoji || {};
  var p = (st.prob === undefined || st.prob === null) ? 40 : Number(st.prob);
  if (!isFinite(p) || !(Math.random() * 100 < p)) return null;
  var it = emojiPick(cid);
  if (!it) return null;
  /* mix=false(关掉「允许表情混入消息」)→ 永远单独发一条;否则同条/单独各一半 */
  var separate = (st.mix === false) ? true : (Math.random() < 0.5);
  return { id: it.id, separate: separate };
}

/* ── D5 · ACTIONS ───────────────────────────────────────────────────── */
function inThread(id) { return state.route === 'chat-thread' && state.param === id; }

/* the last line I sent is the only one that can be answered, so it is the only
   one whose receipt can flip from 送达 to 已读 */
function markReadUpTo(id) {
  var c = chatOf(id);
  for (var i = c.msgs.length - 1; i >= 0; i--) {
    if (c.msgs[i].me) { c.readAt = c.msgs[i].time; c.msgs[i].rd = true; break; }
  }
}

/* TA's text comes out of the card library first; when every group is hidden
   (or the library is still empty) the contact's own talk pool answers instead */
function taReply(id, who) {
  var pool = cardPool();
  if (pool.length) return { type: 'card', text: pick(pool) };
  var talk = person(who).reply || ['嗯嗯'];
  return { type: 'text', text: pick(talk) };
}

function scheduleReply(id) {
  var c = chatOf(id), st = S.settings;
  var who = c.kind === 'group' ? pick(GROUPS[0].members || ['c1']) : id;
  var span = Math.max(0.2, st.replyMax - st.replyMin);
  var delay = (st.replyMin + Math.random() * span) * 1000;

  var t1 = setTimeout(function () {
    replyTimers = replyTimers.filter(function (x) { return x !== t1; });
    if (inThread(id)) { state.typing = { id: id, who: who }; paint(); }
  }, Math.max(360, delay * 0.45));
  replyTimers.push(t1);

  var t2 = setTimeout(function () {
    replyTimers = replyTimers.filter(function (x) { return x !== t2; });
    state.typing = null;

    /* 已读不回: they looked, and chose silence — say so instead of leaving the
       read receipt hanging without an explanation */
    if (Math.random() < st.ignoreP) {
      markReadUpTo(id);
      c.unread = 0;
      if (inThread(id)) paint(); else paintHome();
      toast(person(who).name + ' 已读，但没有回你', 'checkDouble');
      save();
      return;
    }

    var r = taReply(id, who);
    var msg = { me: false, who: who, type: r.type, text: r.text, time: nowTime(), seen: true };
    /* 第9单:TA 回消息时按概率甩一张表情 —— 同条(文字+表情)或单独一条 */
    var plan = taStickerPlan(who);
    if (plan && !plan.separate) msg.stk = plan.id;
    c.msgs.push(msg);
    if (plan && plan.separate) {
      c.msgs.push({ me: false, who: who, type: 'sticker', stk: plan.id, text: '', time: nowTime(), seen: true });
    }
    c.time = '刚刚';
    markReadUpTo(id);
    if (inThread(id)) { c.unread = 0; paint(); }
    else { c.unread++; paintHome(); }
    save();
  }, delay);
  replyTimers.push(t2);
}

function sendMessage() {
  var box = document.getElementById('chatInput');
  if (!box) return;
  var v = box.value.trim();
  if (!v) return;
  var id = state.param;
  var c = chatOf(id);
  c.msgs.push({ me: true, text: v, time: nowTime(), rd: false });
  c.time = '刚刚';
  box.value = '';
  autoGrow(box);
  state.panel = null;               /* 发送后收起上滑面板(第1单范式) */
  save();
  paint();
  scheduleReply(id);
}

/* ── 并发红包 / 发字卡(输入条 ＋ 面板里的动作)────────────────────────── */
function openPacketSend(cid) {
  if (!cid) cid = (state.route === 'chat-thread' && state.param) ? state.param : activePacketCid();
  if (!cid || !cidExists(cid)) { toast('先去聊天里选一位联系人', 'gift'); return; }
  state.packetSend = { cid: cid, amount: '', wish: '', err: '' };
  state.sheet = { kind: 'packet-send' };
  paintSheet();
  paintOverlay();
}

function sendMyCard(cid) {
  var pool = cardPool();
  if (!pool.length) { toast('字卡库还是空的，先去字卡库加几张', 'cards'); return; }
  if (!cid || !chatOf(cid)) return;
  var c = chatOf(cid);
  c.msgs.push({ me: true, type: 'card', text: pick(pool), time: nowTime() });
  c.time = '刚刚';
  save();
  if (inThread(cid)) { paint(); toast('字卡已发出', 'check'); }
}

/* 拍一拍 — the action pool is editable, and milk backups append to it */
function patLine() { return pick(S.pokes.length ? S.pokes : POKES_SEED); }

function doPat(id, byMe, who) {
  var c = chatOf(id);
  var line = patLine();
  if (byMe) {
    c.msgs.push({ me: true, sys: true, type: 'sys', text: '我 ' + line, time: nowTime() });
    c.time = '刚刚';
    if (inThread(id)) paint(); else paintHome();
    save();
    if (Math.random() < 0.55) {
      var back = setTimeout(function () {
        replyTimers = replyTimers.filter(function (x) { return x !== back; });
        doPat(id, false, c.kind === 'group' ? pick(GROUPS[0].members || ['c1']) : id);
      }, 900 + Math.random() * 1500);
      replyTimers.push(back);
    }
    return;
  }
  c.msgs.push({ me: false, sys: true, type: 'sys', who: who, time: nowTime(),
                text: person(who).name + ' ' + line.replace(/你/g, '我') });
  c.time = '刚刚';
  if (inThread(id)) { c.unread = 0; paint(); }
  else { c.unread++; paintHome(); }
  toast(person(who).name + ' 拍了拍你', 'poke');
  save();
}

/* ── D4b · SCHEDULER（第3单 · TA 主动行为的总管家）──────────────────────
   全站只有一个心跳。任何「TA 主动做什么」都必须先在这里登记,name→trigger
   (何时触发)+ deliver(触发后落哪),不许模块自己偷偷 setInterval——否则设置页
   管不住它们,也说不清 TA 为什么偏偏这时候冒出来。
   deliver 只有三种落地形态,不允许自创第四种:
     A 聊天流型  → 消息进聊天记录(deliverMsg)
     B 功能内容型 → 内容落功能页,通知走角标 + toast(deliverMoment / deliverLetter)
     C 混合型    → 功能内容 + 聊天告知各一条(本批未用到)                        */
var HEARTBEAT_MIN = 9000, HEARTBEAT_SPAN = 11000;   /* tick 间隔 9~20s */
var heartbeatTimer = null;
var SCHED = { lastFire: 0 };

/* 首批注册的任务;ready:false 的是后续单要填的空壳,只占位不触发 */
var TASK_DEFS = [
  /* 间隔默认值按客户要求全部压到个位数(分钟);高频靠「每日上限」刹住,不会连发轰炸 */
  { name: 'msg',     label: '主动发消息',   group: '聊天',   ready: true,  min: 4,   max: 9,   p: 0.5, daily: 0, cool: 0, win: null,      deliver: deliverMsg },
  { name: 'moments', label: '主动发朋友圈', group: '朋友圈', ready: true,  min: 8,   max: 9,   p: 0.5, daily: 3, cool: 0, win: null,      deliver: deliverMoment },
  { name: 'letters', label: '主动写信',     group: '信箱',   ready: true,  min: 8,   max: 9,   p: 0.5, daily: 2, cool: 0, win: null,      deliver: deliverLetter },
  { name: 'music',   label: '邀请一起听',   group: '一起听', ready: true,  min: 8,   max: 9,   p: 0.45, daily: 2, cool: 0, win: null,     deliver: deliverMusicInvite },
  { name: 'gift',    label: '送礼',         group: '礼物盒', ready: false, min: 60,  max: 180, p: 0.4, daily: 1, cool: 0, win: null,      deliver: null },
  { name: 'call',    label: '来电',         group: '通话',   ready: true,  min: 8,   max: 9,   p: 0.3, daily: 2, cool: 0, win: null,      deliver: deliverCall },
  { name: 'checkin', label: '位置打卡',     group: '打卡',   ready: false, min: 60,  max: 180, p: 0.5, daily: 1, cool: 0, win: null,      deliver: null },
  { name: 'packet',  label: '系统红包',     group: '红包',   ready: true,  min: 8,   max: 9,   p: 0.3, daily: 1, cool: 0, win: null,      deliver: deliverPacket },
  { name: 'diary',   label: 'TA 写日记',    group: '日记',   ready: false, min: 60,  max: 120, p: 0.6, daily: 1, cool: 0, win: [21, 24],  deliver: null },
  { name: 'period',  label: '生理期关怀',   group: '陪伴',   ready: false, min: 120, max: 480, p: 0.5, daily: 1, cool: 0, win: null,      deliver: null },
  { name: 'aidiary', label: 'AI 日记',      group: '日记',   ready: false, min: 60,  max: 120, p: 0.6, daily: 1, cool: 0, win: [21, 24],  deliver: null },
  /* 第17单 · 每日一牌:每日上限写 1,工单验收5 要求「每天 ≤1 次」 */
  { name: 'dailytarot', label: '每日一牌',  group: '塔罗',   ready: true,  min: 8,   max: 9,   p: 0.5, daily: 1, cool: 0, win: null,      deliver: deliverDailyTarot }
];

function taskDef(name) {
  for (var i = 0; i < TASK_DEFS.length; i++) if (TASK_DEFS[i].name === name) return TASK_DEFS[i];
  return null;
}

/* 任务旋钮读写的唯一入口:存档里没有就按注册时的默认值补一份 */
function schedSet(name) {
  var def = taskDef(name);
  if (!def) return null;
  var s = S.settings.sched || (S.settings.sched = {});
  if (!s[name]) {
    s[name] = { on: def.ready, min: def.min, max: def.max, p: def.p, daily: def.daily,
                cool: def.cool, last: 0, next: 0, day: '', count: 0 };
  }
  return s[name];
}

/* 设置页里每一行任务:先给开关,开了才展开间隔/概率/上限的旋钮。
   未上线的任务(ready:false)整行不渲染 —— 客户要求设置页不出现做不了的功能;
   定义留在 TASK_DEFS 里,第6单礼物/第13单日记上线时把 ready 翻成 true 就回来。 */
function schedRow(def) {
  if (!def.ready) return '';
  var st = schedSet(def.name);
  if (!st) return '';
  var hint = def.group + (def.win ? ' · 只在 ' + pad2(def.win[0]) + ':00~' + pad2(def.win[1]) + ':00' : '');
  var head = '<div class="setting-row"><span class="setting-main">' +
    '<span class="setting-label">' + esc(def.label) + '</span>' +
    '<span class="setting-hint">' + esc(hint) + '</span></span>' +
    '<button class="switch' + (st.on ? ' on' : '') + '" data-act="set-toggle" data-k="sched.' + def.name + '.on" ' +
      'role="switch" aria-checked="' + st.on + '" data-od-id="sched-sw-' + def.name + '"><span></span></button></div>';
  if (!st.on) return head;
  return head +
    setNum('sched.' + def.name + '.min', '最快间隔', st.min, 0.2, 1440, 0.1, '分钟') +
    setNum('sched.' + def.name + '.max', '最慢间隔', st.max, 0.2, 2880, 0.1, '分钟') +
    setNum('sched.' + def.name + '.p', '触发概率', st.p, 0, 1, 0.05, '0.5 表示一半机会') +
    setNum('sched.' + def.name + '.daily', '每日上限', st.daily, 0, 20, 1, '0 表示不限');
}

/* 设置项的 key 允许写成 sched.<任务名>.<字段> 的点路径,这里统一拆包 */
var SCHED_LIM = { min: [0.2, 1440], max: [0.2, 2880], p: [0, 1], daily: [0, 20], cool: [0, 240] };
function schedPath(key) {
  var m = /^sched\.([a-z]+)\.(\w+)$/.exec(String(key || ''));
  if (!m || !taskDef(m[1])) return null;
  return { name: m[1], field: m[2] };
}
function schedPut(key, val) {
  var p = schedPath(key);
  if (!p) return false;
  if (p.field === 'on') { schedSet(p.name).on = !!val; return true; }
  var lim = SCHED_LIM[p.field];
  if (!lim) return false;
  var n = parseFloat(val);
  if (!isFinite(n)) return false;
  var e = schedSet(p.name);
  e[p.field] = Math.min(lim[1], Math.max(lim[0], n));
  if (p.field === 'min' && e.max < e.min) e.max = e.min;
  if (p.field === 'max' && e.max < e.min) e.min = e.max;
  return true;
}

function pad2(n) { return String(n).padStart(2, '0'); }

function dayKey(d) {
  d = d || new Date();
  return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
}

function randGap(def, st) {
  var lo = Math.min(st.min, st.max), hi = Math.max(st.min, st.max);
  return (lo + Math.random() * Math.max(0.02, hi - lo)) * 60000;
}

function inWindow(def, d) {
  if (!def.win) return true;
  var h = d.getHours(), a = def.win[0], b = def.win[1];
  return a <= b ? (h >= a && h < b) : (h >= a || h < b);
}

/* 自动行为落在谁身上:正在聊谁就是谁,否则落在第一位联系人的空间里 */
function autoCid() {
  if (state.route === 'chat-thread' && state.param && cidExists(state.param)) return state.param;
  return firstCid();
}

function schedulerTick() {
  heartbeatTimer = null;
  var now = Date.now();

  /* 页面在后台时一个动作都不放,回到前台也不补发轰炸 */
  if (document.hidden) { scheduleNextTick(); return; }

  var coolMs = (S.settings.schedCooldown || 0) * 60000;
  for (var i = 0; i < TASK_DEFS.length; i++) {
    var def = TASK_DEFS[i];
    if (!def.ready || !def.deliver) continue;
    var st = schedSet(def.name);
    if (!st || !st.on) continue;

    if (!st.next) st.next = now + randGap(def, st);
    if (now < st.next) continue;

    if (st.day !== dayKey()) { st.day = dayKey(); st.count = 0; }
    if (!inWindow(def, new Date(now))) { st.next = now + randGap(def, st); continue; }
    if (st.daily > 0 && st.count >= st.daily) { st.next = now + randGap(def, st); continue; }
    if (coolMs && SCHED.lastFire && now - SCHED.lastFire < coolMs) {
      st.next = SCHED.lastFire + coolMs; continue;
    }
    if (Math.random() > st.p) { st.next = now + randGap(def, st); continue; }

    st.count++; st.last = now;
    st.next = now + Math.max(randGap(def, st), (st.cool || 0) * 60000);
    SCHED.lastFire = now;
    save();
    try { def.deliver(st); } catch (e) { /* 单个任务炸了不能把心跳带下去 */ }
    break;   /* 一个心跳只放一个动作,避免 TA 连发 */
  }
  scheduleNextTick();
}

function scheduleNextTick() {
  if (heartbeatTimer) clearTimeout(heartbeatTimer);
  heartbeatTimer = setTimeout(schedulerTick, HEARTBEAT_MIN + Math.random() * HEARTBEAT_SPAN);
}

/* 设置改过之后立刻重新评估,不用等下一个心跳 */
function kickScheduler() { scheduleNextTick(); }

/* ── deliver 实现 ─────────────────────────────────────────────────────── */
/* A · 聊天流型 */
function deliverMsg() {
  var dms = CHATS.filter(function (c) { return c.kind !== 'group'; });
  if (!dms.length) return;
  var c = pick(dms);
  var r = taReply(c.id, c.id);
  var msg = { me: false, who: c.id, type: r.type, text: r.text, time: nowTime(), seen: true };
  /* 第9单:主动找我说话也可能顺手甩一张表情 */
  var plan = taStickerPlan(c.id);
  if (plan && !plan.separate) msg.stk = plan.id;
  c.msgs.push(msg);
  if (plan && plan.separate) {
    c.msgs.push({ me: false, who: c.id, type: 'sticker', stk: plan.id, text: '', time: nowTime(), seen: true });
  }
  c.time = '刚刚';
  if (inThread(c.id)) { c.unread = 0; paint(); }
  else { c.unread++; if (state.route === 'home') paintHome(); }
  toast(person(c.id).name + ' 找我说话啦', 'chat');
}

/* 第10单 · TA 主动来电:不落聊天流,落**全屏来电屏**(验收4)。
   挂在调度中心的 call 任务上,所以开关/间隔/概率/单日上限都归设置页管;
   正在通话中就直接放弃这一次(单一会话门)。 */
function deliverCall() {
  if (callBusyNow()) return;
  var cid = autoCid();
  if (!cid) return;
  if (callRingIn(cid)) toast(person(cid).name + ' 打来电话', 'phone');
}

/* 第17单 · 每日一牌:TA 抽一张 + 本地模板解读,直接进聊天流。
   「每天最多一次」交给调度中心的 daily 旋钮(默认 1),这里**不再自己记日子** ——
   两处各记一份,迟早对不上(第10单 ymKey 的教训是同一类)。 */
var DAILY_TAROT_LINES = ['今天的牌我帮你抽好了', '给你抽了一张今日的牌', '顺手给你翻了一张牌', '牌说想见你'];
function deliverDailyTarot() {
  var dms = CHATS.filter(function (c) { return c.kind !== 'group'; });
  if (!dms.length) return;
  var c = pick(dms);
  var d = tarotDrawOne();
  var reading = tarotTemplate([d], '');
  c.msgs.push({
    me: false, who: c.id, type: 'tarot', time: nowTime(), seen: true,
    text: pick(DAILY_TAROT_LINES),
    tr: { name: d.card.full, kw: d.card.kw, rev: !!d.rev, reading: reading }
  });
  c.time = '刚刚';
  tarotRecord('（每日一牌）', [d], reading, 'local');
  if (inThread(c.id)) { c.unread = 0; paint(); }
  else { c.unread++; if (state.route === 'home') paintHome(); }
  save();
  toast(person(c.id).name + ' 送来了今日一牌', 'tarot');
}

/* A · 聊天流型:TA 从我歌单里挑一首发来邀约卡(歌单空的时候没什么可邀请的) */
function deliverMusicInvite() {
  if (!MUSIC.songs.length) return;
  var dms = CHATS.filter(function (c) { return c.kind !== 'group'; });
  if (!dms.length) return;
  var c = pick(dms);
  var s = pick(MUSIC.songs);
  c.msgs.push({
    me: false, who: c.id, type: 'song', time: nowTime(), seen: true,
    text: '一起听这首吧',
    song: { id: s.id, name: s.name, artist: s.artist, pic: s.pic }
  });
  c.time = '刚刚';
  if (inThread(c.id)) { c.unread = 0; paint(); }
  else { c.unread++; if (state.route === 'home') paintHome(); }
  save();
  toast(person(c.id).name + ' 想和你一起听《' + s.name + '》', 'music');
}

/* A · 聊天流型:TA 从自己的红包袋里发一个红包过来 */
function deliverPacket() {
  var dms = CHATS.filter(function (c) { return c.kind !== 'group'; });
  if (!dms.length) return;
  var c = pick(dms);
  var w = walletOf(c.id);
  var amt = taPacketAmount();
  if (amt > w.ta) amt = Math.min(w.ta, 5.2);
  if (amt < 0.01) return;
  var m = sendPacket(c.id, amt, pick(RP_WISHES), false);
  if (!m) return;
  if (inThread(c.id)) paint();
  else if (state.route === 'chat') paint();
  save();
  toast(person(c.id).name + ' 发来一个红包', 'gift');
}

/* B · 朋友圈:抽 2~5 张字卡拼成一条动态,贴纸随机 */
function makeTaMoment(cid) {
  var pool = cardPool().slice(), got = [], i;
  var n = 2 + Math.floor(Math.random() * 4);
  if (pool.length) {
    for (i = 0; i < n && pool.length; i++) got.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  }
  var text = got.length ? got.join('\n') : pick(MOMENT_FALLBACK);
  var tabs = Object.keys(STICKERS), tab = pick(tabs), s = pick(STICKERS[tab]);
  return {
    id: uid('m'), cid: cid, who: cid, text: text,
    place: Math.random() < 0.5 ? pick(PLACES) : '',
    scene: null, sceneLabel: '',
    sticker: { kind: tab, id: s[0], label: s[1] || s[0] },
    time: '刚刚', likes: [], comments: [], unread: true
  };
}

function deliverMoment() {
  var cid = autoCid();
  if (!cid) return;
  var m = makeTaMoment(cid);
  MOMENTS.unshift(m);
  if (state.route === 'moments' && activeMomCid() === cid) { m.unread = false; paint(); }
  else if (state.route === 'home') paintHome();
  toast(person(cid).name + ' 发了新动态', 'moments');
  save();
}

/* ── 从字卡库抽一封信 ───────────────────────────────────────────────────
   卡片是「一句 TA 会说的话」,直接一张一行地贴出来是清单、不是信 —— 所以:
     1. 洗掉每张卡末尾的标点,再用句号把卡片连成句子,每 3 句分一段;
     2. 信首补称呼(S.myName),信尾的落款交给 sign 字段,和对齐手写种子信;
     3. 标题从「短到能当标题」的卡里抽(2~12 字);
     4. 纯语气短卡("嗯""哈哈")单独成句像复读,只有长卡不够 4 张时才启用;
     5. 库空走兜底语料。隐藏分组从头到尾不参与(cardPool 只收非隐藏)。      */
var CARD_TAIL = /[\s，。！？、；：…~～.!?,;:]+$/;

function cardLine(s) { return String(s === null || s === undefined ? '' : s).replace(CARD_TAIL, '').trim(); }

function cardsToParagraphs(cards, per) {
  var lines = cards.map(cardLine).filter(Boolean);
  var paras = [], n = per || 3;
  for (var i = 0; i < lines.length; i += n) paras.push(lines.slice(i, i + n).join('。') + '。');
  return paras.join('\n\n');
}

function shortCardIndex(pool) {
  var idx = [];
  for (var i = 0; i < pool.length; i++) {
    var len = cardLine(pool[i]).length;
    if (len >= 2 && len <= 12) idx.push(i);
  }
  var src = idx.length ? idx : pool.map(function (_, i) { return i; });
  return src[Math.floor(Math.random() * src.length)];
}

function letterFromPool() {
  var all = cardPool().slice();
  var long = all.filter(function (s) { return cardLine(s).length >= 6; });
  var pool = long.length >= 4 ? long : all;
  var who = S.myName || ME.name || '你';

  if (!pool.length) {
    return { subject: pick(LETTER_FALLBACK.subject), body: who + '：\n\n' + pick(LETTER_FALLBACK.body) };
  }

  var si = shortCardIndex(pool);
  var subject = cardLine(pool[si]) || '见字如面';
  pool.splice(si, 1);                    /* 当标题用掉的那张不再出现在正文里 */

  var n = Math.min(5 + Math.floor(Math.random() * 6), pool.length);
  var got = [];
  for (var i = 0; i < n; i++) got.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);

  var body = who + '：\n\n' + cardsToParagraphs(got, 3);
  return { subject: subject.slice(0, 60), body: body };
}

function makeTaLetter(cid) {
  var c = letterFromPool();
  return {
    id: uid('l'), cid: cid, dir: 'in', subject: c.subject, body: c.body,
    sign: person(cid).name, time: '刚刚', unread: true, replied: false
  };
}

function deliverLetter() {
  var cid = autoCid();
  if (!cid) return;
  var l = makeTaLetter(cid);
  LETTERS.unshift(l);
  if (state.route === 'letters' && activeLetterCid() === cid) { l.unread = false; paint(); }
  else if (state.route === 'home') paintHome();
  toast(person(cid).name + ' 寄来一封信', 'mail');
  save();
}

/* the input grows with the line, up to the height the design allows */
function autoGrow(el) {
  if (!el) return;
  el.style.height = 'auto';
  el.style.height = Math.min(96, Math.max(24, el.scrollHeight)) + 'px';
}

/* 幂等:寄出 = 定稿。草稿清空、信立刻变成 dir:'out',再打开只剩「回信」。 */
function sendLetter() {
  var c = state.composing;
  var s = document.getElementById('letterSubject');
  var b = document.getElementById('letterBody');
  if (s) c.subject = s.value;
  if (b) c.body = b.value;
  if (!cidExists(c.to)) c.to = activeLetterCid();
  if (!c.subject.trim()) { c.err = '还没写主题'; paint(); return; }
  if (!c.body.trim()) { c.err = '正文还是空的，写一句也好'; paint(); return; }
  var cid = c.to, replyTo = c.replyTo;
  var L = {
    id: uid('l'), cid: cid, dir: 'out',
    subject: c.subject.trim().slice(0, 60), body: c.body.trim(),
    sign: (S.myName || ME.name || '我'), time: '刚刚', unread: false, replied: false
  };
  LETTERS.unshift(L);
  var orig = letterById(replyTo);
  if (orig && orig.dir === 'in' && orig.cid === cid) orig.replied = true;
  state.composing = { subject: '', body: '', to: cid, err: '', replyTo: '' };
  state.sheet = null;
  save();
  toast('信已经寄出', 'mail');
  go('#letters');
  scheduleLetterReply(cid, L.id);
}

/* ── D4c · 社交反应（第4/5单的行为层）─────────────────────────────────── */

/* 我寄出信:TA 按概率隔一会儿回信,正文从字卡库抽 5~10 张拼 */
function scheduleLetterReply(cid, outId) {
  var st = S.settings.letter;
  if (Math.random() > st.replyP) return;
  var span = Math.max(1, st.replyMax - st.replyMin);
  var delay = (st.replyMin + Math.random() * span) * 1000;
  socialLater(function () {
    if (!letterById(outId)) return;      /* 信被删了就别回 */
    var c = letterFromPool();
    var live = (state.route === 'letters' && activeLetterCid() === cid);
    LETTERS.unshift({
      id: uid('l'), cid: cid, dir: 'in', subject: c.subject, body: c.body,
      sign: person(cid).name, time: '刚刚', unread: !live, replied: true
    });
    var mine = letterById(outId);
    if (mine) mine.replied = true;
    save();
    if (live) paint(); else if (state.route === 'home') paintHome();
    toast(person(cid).name + ' 回信了', 'mail');
  }, delay);
}

/* ── D4d · AI 解读（B 级接口,用户自备 key）─────────────────────────────── */
function aiEndpoint(base) {
  var b = String(base || '').trim().replace(/\/+$/, '');
  if (/\/chat\/completions$/.test(b)) return b;
  return /\/v1$/.test(b) ? b + '/chat/completions' : b + '/v1/chat/completions';
}

/* 一次请求三种结局:拿到文本 / 拿到中文错误 / 超时。绝不把原始异常丢给用户。 */
function callAI(cfg, messages, cb) {
  var ctrl = (typeof AbortController === 'function') ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 45000);
  var done = false;
  function fin(err, text) { if (done) return; done = true; clearTimeout(timer); cb(err, text || ''); }

  fetch(aiEndpoint(cfg.base), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.key },
    body: JSON.stringify({ model: cfg.model, messages: messages, temperature: 0.9, max_tokens: 400 }),
    signal: ctrl ? ctrl.signal : undefined
  }).then(function (r) {
    return r.text().then(function (t) { return { ok: r.ok, status: r.status, text: t }; });
  }).then(function (res) {
    if (!res.ok) {
      var why = '';
      try { why = ((JSON.parse(res.text) || {}).error || {}).message || ''; } catch (e) { why = ''; }
      fin('接口返回 ' + res.status + (why ? '：' + why : '，检查 key、模型名和接口地址'), '');
      return;
    }
    var data = null;
    try { data = JSON.parse(res.text); } catch (e) { data = null; }
    if (!data) { fin('接口返回的不是 JSON，检查接口地址是不是写全了', ''); return; }
    var txt = data && data.choices && data.choices[0] && data.choices[0].message &&
      data.choices[0].message.content;
    if (!txt) { fin('接口没有返回内容', ''); return; }
    fin('', String(txt).trim());
  }).catch(function (e) {
    if (e && e.name === 'AbortError') { fin('等了 45 秒还没回，检查网络或接口地址', ''); return; }
    fin('连不上接口：' + ((e && e.message) ? e.message : '未知错误') + '（浏览器直连，注意跨域限制）', '');
  });
}

function runLetterAI(l) {
  var ai = S.ai;
  if (!ai.key) {
    state.aiOut = { busy: false, forId: l.id, text: '', err: '还没填 API Key：设置 → AI 解读，填上再回来。' };
    paint();
    return;
  }
  state.aiOut = { busy: true, forId: l.id, text: '', err: '' };
  paint();
  var who = person(l.cid).name;
  callAI(ai, [
    { role: 'system', content: ai.persona },
    { role: 'user', content: '请读下面这封信，用两三句说说写信的人此刻是什么心情、想表达什么。\n\n' +
      '写信人：' + who + '\n标题：' + l.subject + '\n\n' + letterPlain(l.body) }
  ], function (err, text) {
    if (state.aiOut.forId !== l.id) return;   /* 人已经翻到别的信了,别把结果贴错地方 */
    state.aiOut = { busy: false, forId: l.id, text: text || '', err: err || '' };
    paint();
  });
}

/* 占卜历史:一条 = 问题 + 牌快照 + 解读 + 来源。牌只存「名字/关键词/方位」的
   快照,以后牌库怎么改,旧记录都不跟着变(和问卷成绩存 rand 小标同型)。 */
function tarotRecord(q, drawn, reading, src) {
  var now = new Date();
  var r = {
    id: uid('tr'),
    q: String(q || '').slice(0, 200),
    cards: drawn.map(function (d) { return { name: d.card.full, kw: d.card.kw, rev: !!d.rev }; }),
    reading: String(reading || '').slice(0, 4000),
    src: src === 'ai' ? 'ai' : 'local',
    ts: now.getTime(), day: dayKey(now), time: nowTime()
  };
  TAROT_LOG.push(r);
  while (TAROT_LOG.length > TAROT_CAP) TAROT_LOG.shift();   /* 满了丢最旧 */
  save();
  return r;
}
/* AI 解读回来后**改写同一条**记录,不是再新增一条 —— 一次占卜只留一份结果 */
function tarotUpdateReading(id, text, src) {
  for (var i = 0; i < TAROT_LOG.length; i++) {
    if (TAROT_LOG[i].id !== id) continue;
    TAROT_LOG[i].reading = String(text || '').slice(0, 4000);
    TAROT_LOG[i].src = src === 'ai' ? 'ai' : 'local';
    save();
    return TAROT_LOG[i];
  }
  return null;
}

function tarotDrawOne() {
  var pool = TAROT.slice();
  var c = pool[Math.floor(Math.random() * pool.length)];
  return { card: c, rev: Math.random() < 0.5 };          /* 正逆位各约 50% */
}

/* 抽牌:洗牌后取前 n 张(同一把里不重复) */
function drawTarot() {
  var t = state.tarot;
  var n = Math.max(1, Math.min(3, t.mode || 3));
  var pool = TAROT.slice();
  for (var a = pool.length - 1; a > 0; a--) {            /* Fisher–Yates */
    var b = Math.floor(Math.random() * (a + 1));
    var tmp = pool[a]; pool[a] = pool[b]; pool[b] = tmp;
  }
  t.drawn = pool.slice(0, n).map(function (c) { return { card: c, rev: Math.random() < 0.5 }; });
  t.dealt = 0;
  t.reading = ''; t.src = ''; t.histId = '';
  paint();
  /* 逐张翻开;**最后一张亮完**才落解读与历史 —— 别在牌还没翻开时就记账 */
  for (var i = 0; i < n; i++) {
    later((function (k) {
      return function () {
        if (state.tarot !== t) return;                   /* 中途重新抽过,别写旧的那把 */
        var slot = document.querySelector('#appRoot [data-od-id="tarot-slot-' + k + '"]');
        if (slot) slot.classList.add('flipped');
        if (k === n - 1) {
          later(function () {
            if (state.tarot !== t || state.route !== 'tarot') return;
            t.dealt = n;
            t.reading = tarotTemplate(t.drawn, t.q);
            t.src = 'local';
            t.histId = tarotRecord(t.q, t.drawn, t.reading, 'local').id;
            paint();
            /* 配了 Key 就自动请 TA 解读 —— 买家不知道要点按钮，本地这份先垫着，
               AI 回来顶掉它；失败 toast 一声、本地解读原样保留。 */
            if (tarotAiReady()) runTarotAI();
          }, 640);
        }
      };
    })(i), 240 + i * 220);
  }
}

/* 【加购·AI 解读】问题 + 牌名方位 + 牌义关键词 → 2~3 句 TA 口吻。
   没 Key 时按钮根本点不动(runTarotAI 再兜一次底,防的是手改 DOM 点出来)。
   system = 共用人设 + 塔罗专属指令 —— 人设是「你是梦角」,塔罗只是
   「通过塔罗牌解释你的回答」这个表达方式,别把读信的那套限制带进来。 */
function runTarotAI() {
  var t = state.tarot;
  if (!tarotAiReady() || t.aiBusy || !t.drawn.length) return;
  var ai = S.ai;
  var slots = tarotSlots(t.drawn.length);
  var lines = t.drawn.map(function (d, i) {
    return slots[i] + '：' + d.card.full + '（' + tarotOri(d) + '，关键词：' +
      tarotWords(d).slice(0, 4).join('、') + '）';
  });
  var ask = String(t.q || '').trim();
  var sys = String(ai.persona || '').trim() +
    '\n现在你通过塔罗牌来解释你的回答：把牌面读成你自己想对对方说的话，' +
    '两三句、第一人称、口语化；不要说明书式地复述牌名，也不要说「这张牌代表」。';
  t.aiBusy = true;
  paint();
  callAI(ai, [
    { role: 'system', content: sys },
    { role: 'user', content:
      (ask ? '我问的问题是：' + ask + '\n' : '') + '抽到的牌面：\n' + lines.join('\n') }
  ], function (err, text) {
    if (state.tarot !== t) return;                       /* 人已经重抽了,别贴到新牌上 */
    t.aiBusy = false;
    if (err) { toast(err, 'close'); paint(); return; }
    t.reading = String(text || '').trim() || t.reading;
    t.src = 'ai';
    if (t.histId) tarotUpdateReading(t.histId, t.reading, 'ai');
    toast('TA 解读好了', 'spark');
    paint();
  });
}

/* ── D5b · MILK IMPORT ────────────────────────────────────────────────────
   milk 的备份换过好几层外壳:顶层直给、套一层 localStorage、套一层 data、
   键名带 CHAT_APP_V3_<session>_ 前缀,值本身还可能是 JSON 字符串。所以抓取
   认键名不认路径(任意深度都处理),再用「组名 + 条目」去重兜底——不靠 skip
   防重,否则带前缀的键落到模糊分支时会整条数组被静默丢掉。 */
var MILK_KEYS = {
  replies: /customReplies$/i,
  groups: /customReplyGroups$/i,
  pokes: /customPokes$/i,
  pokeGroups: /customPokeGroups$/i
};

function parseMaybe(v) {
  if (typeof v !== 'string') return v;
  var s = v.trim();
  if (!s || (s.charAt(0) !== '{' && s.charAt(0) !== '[')) return v;
  try { return JSON.parse(s); } catch (e) { return v; }
}

function str1(v) { return String(v === undefined || v === null ? '' : v).trim(); }

function arrOf(v) {
  var x = parseMaybe(v);
  if (Array.isArray(x)) return x;
  if (x && typeof x === 'object') {
    if (Array.isArray(x.items)) return x.items;
    if (Array.isArray(x.list)) return x.list;
    if (Array.isArray(x.replies)) return x.replies;
  }
  return [];
}

/* 键名可能在前面挂了前缀,取最后一段再匹配 */
function bare(k) { var i = k.lastIndexOf('_'); return i < 0 ? k : k.slice(i + 1); }

function mergeReplyList(v, acc) {
  arrOf(v).forEach(function (x) {
    var s = str1(x);
    if (s && acc.flat.indexOf(s) < 0) acc.flat.push(s);
  });
}

function mergeGroupList(v, acc) {
  arrOf(v).forEach(function (g) {
    if (!g || typeof g !== 'object') return;
    var name = str1(g.name) || '未命名分组';
    var items = arrOf(g.items).map(str1).filter(Boolean);
    var found = null;
    for (var i = 0; i < acc.groups.length; i++) if (acc.groups[i].name === name) { found = acc.groups[i]; break; }
    if (!found) { found = { name: name, items: [] }; acc.groups.push(found); }
    items.forEach(function (s) { if (found.items.indexOf(s) < 0) found.items.push(s); });
  });
}

function collectMilk(node, acc, depth) {
  if (!node || typeof node !== 'object' || depth > 6) return;
  if (Array.isArray(node)) {
    node.forEach(function (x) { collectMilk(x, acc, depth + 1); });
    return;
  }
  Object.keys(node).forEach(function (k) {
    var v = parseMaybe(node[k]);
    var b = bare(k);
    if (MILK_KEYS.groups.test(k) || MILK_KEYS.groups.test(b)) mergeGroupList(v, acc);
    else if (MILK_KEYS.replies.test(k) || MILK_KEYS.replies.test(b)) mergeReplyList(v, acc);
    else if (MILK_KEYS.pokeGroups.test(k) || MILK_KEYS.pokeGroups.test(b)) {
      arrOf(v).forEach(function (g) { arrOf(g && g.items).forEach(function (x) { var s = str1(x); if (s) acc.pokes.push(s); }); });
    } else if (MILK_KEYS.pokes.test(k) || MILK_KEYS.pokes.test(b)) {
      arrOf(v).forEach(function (x) { var s = str1(x); if (s) acc.pokes.push(s); });
    } else {
      collectMilk(v, acc, depth + 1);
    }
  });
}

function libGroupByName(name) {
  for (var i = 0; i < S.cardLib.groups.length; i++) if (S.cardLib.groups[i].name === name) return S.cardLib.groups[i];
  return null;
}

/* milk 里 customReplies 是全部字卡的扁平表,而 customReplyGroups[].items 全
   都包含在其中——两个列表各导一遍会让同一句话出现两次。做法:先把组内条目
   收进一个 Set,customReplies 里命中 Set 的跳过,剩下的一律进「未分组」。 */
function applyImport(data) {
  var d = parseMaybe(data);
  if (typeof d === 'string') {
    try { d = JSON.parse(d); } catch (e) { toast('这不是有效的 JSON，检查一下内容', 'close'); return false; }
  }
  if (!d || typeof d !== 'object') { toast('这不是有效的 JSON，检查一下内容', 'close'); return false; }

  if (Array.isArray(d.contacts) || d.cardLib) {
    if (Array.isArray(d.contacts) && d.contacts.length) replaceAll(PEOPLE, d.contacts);
    if (Array.isArray(d.groups) && d.groups.length) replaceAll(GROUPS, d.groups);
    if (Array.isArray(d.chats)) replaceAll(CHATS, d.chats.map(normChat).filter(Boolean));
    if (d.cardLib) S.cardLib = normLib(d.cardLib);
    if (Array.isArray(d.pokes) && d.pokes.length) S.pokes = d.pokes.map(str1).filter(Boolean);
    if (d.settings) S.settings = normSettings(d.settings);
    if (Array.isArray(d.moments)) replaceAll(MOMENTS, d.moments.map(normMoment).filter(Boolean));
    if (Array.isArray(d.letters)) replaceAll(LETTERS, d.letters.map(normLetter).filter(Boolean));
    if (d.wallet) WALLET = normWallet(d.wallet);
    if (Array.isArray(d.quizzes)) QUIZZES = normQuizzes(d.quizzes);
    if (Array.isArray(d.quizRuns)) QUIZ_RUNS = normRuns(d.quizRuns);
    if (d.emoji) EMOJI = emojiNormLib(d.emoji) || EMOJI;
    if (d.ai && typeof d.ai === 'object') {
      var keepKey = S.ai.key;                 /* 备份里 key 常是空的,别把本地那把抹了 */
      S.ai = normAi(d.ai);
      if (!S.ai.key) S.ai.key = keepKey;
    }
    if (d.avatars && typeof d.avatars.me === 'string') S.avatars.me = d.avatars.me;
    if (d.wall && typeof d.wall.chat === 'string') S.wall.chat = d.wall.chat;
    if (d.music) MUSIC = musNormMusic(d.music);
    if (Array.isArray(d.calls)) CALL_LOG = normCalls(d.calls);
    if (d.callMini) S.callMini = normMiniPos(d.callMini);
    if (Array.isArray(d.tarot)) TAROT_LOG = normTarot(d.tarot);
    if (typeof d.myName === 'string' && d.myName.trim()) { S.myName = d.myName.trim(); ME.name = S.myName; }
    save();
    kickScheduler();
    state.sheet = null;
    paint();
    toast('本站备份已经恢复', 'check');
    return true;
  }

  var acc = { flat: [], groups: [], pokes: [] };
  collectMilk(d, acc, 0);
  if (!acc.flat.length && !acc.groups.length && !acc.pokes.length) {
    toast('没有找到可导入的字卡或拍一拍，确认一下是不是回复库文件', 'close');
    return false;
  }

  var inGroups = {};
  acc.groups.forEach(function (g) { g.items.forEach(function (t) { inGroups[t] = true; }); });

  var added = 0, newGroups = 0;
  acc.groups.forEach(function (g) {
    var target = libGroupByName(g.name);
    if (!target) {
      target = { id: uid('g'), name: g.name, hidden: false, items: [] };
      S.cardLib.groups.push(target);
      newGroups++;
    }
    g.items.forEach(function (t) {
      if (target.items.indexOf(t) < 0) { target.items.push(t); added++; }
    });
  });

  var loose = acc.flat.filter(function (t) { return !inGroups[t]; });
  if (loose.length) {
    var box = libGroupByName('未分组');
    if (!box) { box = { id: uid('g'), name: '未分组', hidden: false, items: [] }; S.cardLib.groups.push(box); newGroups++; }
    loose.forEach(function (t) {
      if (box.items.indexOf(t) < 0) { box.items.push(t); added++; }
    });
  }

  var newPokes = 0;
  acc.pokes.forEach(function (t) {
    if (S.pokes.indexOf(t) < 0) { S.pokes.push(t); newPokes++; }
  });

  save();
  state.sheet = null;
  paint();
  if (!added && !newPokes && !newGroups) {
    toast('这些内容都已经在库里了（去重生效）', 'check');
  } else {
    toast('导入 ' + added + ' 张字卡 / ' + newGroups + ' 个分组 / ' + newPokes + ' 条拍一拍', 'check');
  }
  return true;
}

function pickFile(accept, cb) {
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = accept;
  inp.style.position = 'fixed';
  inp.style.left = '-9999px';
  document.body.appendChild(inp);
  inp.addEventListener('change', function () {
    var f = inp.files && inp.files[0];
    if (f) cb(f);
    setTimeout(function () { if (inp.parentNode) inp.parentNode.removeChild(inp); }, 0);
  });
  inp.click();
}

function readTextFile(file, cb) {
  var fr = new FileReader();
  fr.onload = function () { cb(String(fr.result || '')); };
  fr.onerror = function () { toast('读取文件失败', 'close'); };
  fr.readAsText(file);
}

    var q = quizById(state.quiz.qid);
    if (!q || state.quiz.phase !== 'answer') return;
    var i = state.quiz.idx;
    var cur = q.qs[i];
    if (!cur) return;
    state.quiz.ans[cur.id] = parseInt(el.getAttribute('data-v'), 10) || 0;
    paint();
    if (i < q.qs.length - 1) {
      qzClearTimer();
      qzTimer = setTimeout(function () {
        qzTimer = null;
        if (state.route !== 'quiz-run') return;
        state.quiz.idx = Math.min(state.quiz.idx + 1, q.qs.length - 1);
        paint();
      }, 240);
    }
  },
  'quiz-back': function () {
    if (state.quiz.phase !== 'answer') return;
    state.quiz.idx = Math.max(0, state.quiz.idx - 1);
    paint();
  },
  'quiz-submit': function () {
    var q = quizById(state.quiz.qid);
    if (!q) return;
    if (state.quiz.phase !== 'answer') return;      /* 幂等:提交过一次就不再提交 */
    var ans = state.quiz.ans;
    if (!q.qs.every(function (x) { return ans[x.id] !== undefined; })) {
      toast('还有题没答', 'close');
      return;
    }
    /* TA 的答案先定下来,思考动画只是把它一条条露出来 */
    var taAll = {};
    q.qs.forEach(function (x) { taAll[x.id] = taPick(x); });
    state.quiz.taAll = taAll;
    state.quiz.think = 0;
    state.quiz.phase = 'thinking';
    paint();
    qzClearTimer();
    qzTimer = setTimeout(qzThinkStep, 300);
  },

  /* ── 编辑器 ─────────────────────────────────────────────────────── */
  'qe-add-opt': function (el) {
    var q = qeQ(state.qedit, el.getAttribute('data-q'));
    if (!q) return;
    q.opts.push('');
    paint();
  },
  'qe-del-opt': function (el) {
    var q = qeQ(state.qedit, el.getAttribute('data-q'));
    if (!q) return;
    var i = parseInt(el.getAttribute('data-i'), 10);
    if (q.opts.length <= QZ_MIN_OPTS) return;
    q.opts.splice(i, 1);
    if (q.ans >= q.opts.length) q.ans = q.opts.length - 1;   /* 删到标准答案就把下标拉回来 */
    if (q.ans < 0) q.ans = 0;
    paint();
  },
  'qe-add-q': function () {
    if (!state.qedit) return;
    state.qedit.qs.push({ id: uid('q'), t: '', opts: ['', ''], ans: 0 });

  },
  'qe-del-q': function (el) {
    var d = state.qedit;
    if (!d || d.qs.length <= 1) return;
    var qid = el.getAttribute('data-q');
    for (var i = 0; i < d.qs.length; i++) {
      if (d.qs[i].id === qid) { d.qs.splice(i, 1); break; }
    }
    paint();
  },
  'qe-save': function () {
    var d = state.qedit;
    if (!d) return;
    var name = String(d.name || '').trim();
    if (!name) { d.err = '给这套问卷起个名字'; paint(); return; }
    var qs = [];
    for (var i = 0; i < d.qs.length; i++) {
      var t = String(d.qs[i].t || '').trim();
      var opts = d.qs[i].opts.map(function (o) { return String(o || '').trim(); }).filter(Boolean);
      if (!t) { d.err = '第 ' + (i + 1) + ' 题还没写题干'; paint(); return; }
      if (opts.length < QZ_MIN_OPTS) { d.err = '第 ' + (i + 1) + ' 题至少要 ' + QZ_MIN_OPTS + ' 个选项'; paint(); return; }
      /* 草稿里的 ai 是下标,-1 = 「随机」→ 存空串(taPick 见空串就每次均匀摇一个);
         其余越界的一律退回第一个选项 */
      var ai = parseInt(d.qs[i].ans, 10);
      if (!isFinite(ai)) ai = 0;
      var ansText = (ai === -1) ? '' : ((ai >= 0 && ai < opts.length) ? opts[ai] : opts[0]);
      qs.push({ id: d.qs[i].id, t: t, opts: opts, ans: ansText });
    }
    if (!qs.length) { d.err = '至少留一道题'; paint(); return; }
    var from = String(d.from || '').trim();
    if (d.isNew) QUIZZES.push({ id: uid('qz'), name: name, from: from, qs: qs });
    else {
      var ex = quizById(d.id);
      if (ex) { ex.name = name; ex.from = from; ex.qs = qs; }
    }
    save();
    state.qedit = null;
    go('#questionnaire');
    toast(d.isNew ? '问卷已保存，可以直接答了' : '问卷已更新', 'check');
  },

  /* 点聊天流里的来信红包 → 打开拆红包 overlay(已拆/已退回不再入账) */
  'rp-tap': function (el) {

    if (!m || !m.pk) return;
    if (m.me) {
      toast(m.pk.state === 'opened' ? person(cid).name + ' 已经领了'
        : (m.pk.state === 'refunded' ? '红包已退回你的袋子' : '等 ' + person(cid).name + ' 来拆吧'), 'gift');
      return;
    }
    if (m.pk.state !== 'idle') { toast('这个红包已经拆过了', 'gift'); return; }
    state.rp = { cid: cid, pkid: m.pk.id, revealed: false };

  'rp-reveal': function () {

    var m = findPk(state.rp.cid, state.rp.pkid);

    m.pk.state = 'opened';

  'send-rp': function () {

    var w = walletOf(cid);

    var m = sendPacket(cid, amt, d.wish, true);

    state.sheet = null;

/* ── D6 · ROUTER ────────────────────────────────────────────────────── */
var SCREENS = {
  chat: renderChat,
  'chat-thread': renderThread,
  letters: renderLetters,
  'letters-compose': renderCompose,
  'letters-open': renderLetterOpen,
  moments: renderMoments,
  tarot: renderTarot,
  questionnaire: renderQuiz,
  'quiz-run': renderQuizRun,
  'quiz-result': renderQuizResult,
  'quiz-edit': renderQuizEdit,
  redpacket: renderPacket,
  music: renderMusic,
  emoji: renderEmoji,
  contacts: renderContacts,
  cards: renderCards,
  settings: renderSettings,
  calls: renderCalls,
  'call-incoming': renderCallIncoming,
  'call-out': renderCallOut,
  'call-active': renderCallActive
};
var APP_ROUTES = Object.keys(SCREENS);

var viewport = $('#viewport');
var homeScreen = null, appScreen = null;
var cur = null, curParam = null;
/* every route change takes a new token; a transition callback whose token is
   stale is ignored, so late timers can never normalise a layer that has since
   been given a job by a newer navigation */
var navToken = 0;

/* A navigation must never leave a layer parked half-way through its motion. A
   dropped timer, a throttled background tab, or two route changes in the same
   frame could all strand `.is-leaving` on the app layer — which paints the
   app's own surface over the wallpaper forever. Every transition timer checks
   its token before touching the DOM, and `animationend` is the authority on
   when the motion actually finished. */
function toApp(show) {
  if (!appScreen) return;
  navToken++;                       /* retires any pending hide timer */
  appScreen.classList.remove('is-leaving', 'is-entering');
  appScreen.classList.add('is-active');
  if (show) appScreen.style.visibility = '';
}

function toHome(show) {
  if (!appScreen) return;
  var t = ++navToken;
  appScreen.classList.remove('is-entering');
  if (!show) {
    appScreen.classList.remove('is-leaving');
    appScreen.classList.remove('is-active');
    appScreen.style.visibility = 'hidden';
    return;
  }
  appScreen.classList.add('is-leaving');
  later(function () {
    if (t !== navToken) return;
    appScreen.classList.remove('is-leaving', 'is-active');
    appScreen.style.visibility = 'hidden';
  }, 320);
}

function enterApp() {
  toApp(true);
  var t = navToken;
  appScreen.classList.remove('is-entering');
  void appScreen.offsetHeight;          /* restart the keyframe on a re-entry */
  appScreen.classList.add('is-entering');
  later(function () {
    if (t !== navToken) return;
    appScreen.classList.remove('is-entering');
    homeScreen.classList.remove('is-active');
  }, 340);
}

function go(hash) {
  if (location.hash === hash) { sync(); return; }
  location.hash = hash;
}

function parseHash() {
  var bits = location.hash.replace(/^#/, '').split('/');
  var base = bits[0] || 'home';
  var param = bits[1] || null;
  if (base !== 'home' && APP_ROUTES.indexOf(base) < 0) { base = 'home'; param = null; }
  return { base: base, param: param };
}

function syncStatusBar() {
  var onVeil = (state.route === 'call-incoming' || state.route === 'call-active' ||
                state.route === 'call-out');
  $('#statusBar').classList.toggle('on-veil', onVeil);
  $('#gestureBar').classList.toggle('on-dark', onVeil);
}

function sync() {
  var r = parseHash();
  if (r.base === cur && r.param === curParam) return;

  var first = (cur === null);
  var cameFromHome = (cur === 'home' || first);
  state.route = r.base;
  state.param = r.param;
  state.sheet = null;
  state.panel = null;      /* 切屏也收起上滑面板 */
  state.rp = null;         /* 离开时关掉拆红包 overlay */
  qzClearTimer();          /* 离开时停掉问卷的自动进题 / TA 思考动画 */
  dropNavTimers();

  if (r.base === 'home') {
    paintHome();
    homeScreen.classList.add('is-active');
    var retreat = (cur !== null && cur !== 'home');
    toHome(retreat);            /* keeps the app visible while it slides away */
    if (!retreat) homeScreen.style.visibility = '';
    paintSheet();
  } else {
    paint();
    /* the wallpaper stays painted for the length of the slide precisely so
       nothing behind the handset can show through the incoming sheet; the
       enter timer hides it once the motion has landed */
    homeScreen.style.visibility = '';
    homeScreen.classList.add('is-active');
    if (cameFromHome && !first) enterApp();
    else { toApp(true); homeScreen.classList.remove('is-active'); }
  }

  cur = r.base;
  curParam = r.param;
  syncStatusBar();
  syncMusicTimer();
  syncCallTimer();
  renderCallMini();     /* 换屏后小窗该露就露、该收就收(通话本身不随路由中断) */
}

/* ── D7 · EVENTS ────────────────────────────────────────────────────── */
function onClick(e) {
  var el = e.target.closest ? e.target.closest('[data-go],[data-act]') : null;
  /* 点到输入条(含面板)以外的地方 → 收起上滑面板(第1单范式第6条) */
  if (state.panel) {
    var inFoot = e.target.closest ? e.target.closest('.chat-foot') : null;
    if (!inFoot) { state.panel = null; renderChatPanel(); }
  }
  if (!el || !viewport.contains(el)) return;
  if (el.hasAttribute('data-go')) {
    var had = !!state.sheet;
    state.sheet = null;
    var target = el.getAttribute('data-go');
    if (location.hash === target) { if (had) paint(); return; }
    go(target);
    return;
  }
  var fn = ACTIONS[el.getAttribute('data-act')];
  if (fn) fn(el, e);
}

function onInput(e) {
  var t = e.target;
  if (!t) return;
  /* data-qe 的编辑器字段大多没有 id,必须放在「没有 id 就 return」之前,
     否则问卷编辑器里打的字根本进不了草稿(踩过:保存时才发现全丢了) */
  if (t.getAttribute && t.getAttribute('data-qe')) { qeInput(t); return; }
  if (!t.id) {
    if (t.getAttribute && t.getAttribute('data-set')) applySet(t.getAttribute('data-set'), t.value);
    return;
  }
  /* every settings field is declared by data-set, so one handler owns them all */
  if (t.getAttribute && t.getAttribute('data-set')) { applySet(t.getAttribute('data-set'), t.value); return; }
  if (t.getAttribute && t.getAttribute('data-qe')) { qeInput(t); return; }
  if (t.id === 'contactSearch') { state.query = t.value; paint(); return; }
  if (t.id === 'libSearch') { state.libQuery = t.value; paint(); return; }
  if (t.id === 'chatInput') {
    var btn = document.getElementById('chatSend');
    if (btn) btn.disabled = !t.value.trim();
    autoGrow(t);
    return;
  }
  if (t.id === 'letterSubject') { state.composing.subject = t.value; clearComposeError(); return; }
  /* 表情分组名的草稿:不进草稿的话,一打字重绘就会把这一格清空 */
  if (t.id === 'emjTabName') { if (state.emojiTabDraft) state.emojiTabDraft.name = t.value; return; }
  if (t.id === 'letterBody') { state.composing.body = t.value; clearComposeError(); return; }
  if (t.id === 'letterSearch') { state.letterQuery = t.value; paint(); return; }
  if (t.id === 'momentDraft') {
    state.momentDraft = t.value;
    var pc = document.getElementById('postCount');   /* 计数跟手走,不用整页重绘 */
    if (pc) pc.textContent = t.value.length + ' / 200';
    return;
  }
  if (t.id === 'postPlaceInput') { state.postPlace = t.value.trim().slice(0, 20); return; }
  if (t.id === 'commentDraft') { state.commentDraft = t.value; return; }
  if (t.id === 'newContactName') { state.newContact.name = t.value; return; }  if (t.id === 'rpAmount') { if (state.packetSend) state.packetSend.amount = t.value; return; }
  if (t.id === 'rpWish') { if (state.packetSend) state.packetSend.wish = t.value; return; }
  if (t.id === 'editContactName') { if (state.edit) state.edit.name = t.value; return; }
  if (t.id === 'editContactNote') { if (state.edit) state.edit.note = t.value; return; }
  if (t.id === 'libGroupName') { state.libDraft.name = t.value; return; }
  if (t.id === 'libCardText') { state.cardDraft.text = t.value; return; }
  if (t.id === 'libBatchText') { state.batchDraft.text = t.value; return; }
  if (t.id === 'libImportText') { state.restoreText = t.value; return; }
  if (t.id === 'musicAddText') { state.musicAdd.text = t.value; return; }
  if (t.id === 'pokeDraft') { state.pokeDraft = t.value; return; }
  /* 占卜提问:只进草稿不重绘 —— 打字时整页 paint() 会让这一格失焦 */
  if (t.id === 'tarotQ') { if (state.tarot) state.tarot.q = t.value; return; }
}

/* ── 问卷编辑器草稿 ─────────────────────────────────────────────────────
   文字类改动一律不重绘:整页 paint() 会让正在打字的那一格失焦(联系人编辑
   踩过同一个坑)。只有加/删选项、加/删题这种结构改动才重绘。 */
function qeInput(t) {
  var d = state.qedit;
  if (!d) return;
  var kind = t.getAttribute('data-qe');
  if (kind === 'name') { d.name = t.value; return; }
  if (kind === 'from') { d.from = t.value; return; }
  var q = qeQ(d, t.getAttribute('data-q'));
  if (!q) return;
  if (kind === 'qt') { q.t = t.value; return; }
  if (kind === 'opt') {
    var i = parseInt(t.getAttribute('data-i'), 10);
    if (!isFinite(i) || i < 0 || i >= q.opts.length) return;
    q.opts[i] = t.value;
    var sel = $('select[data-qe="ans"][data-q="' + t.getAttribute('data-q') + '"]');
    if (sel && sel.options[i]) sel.options[i].text = t.value || ('选项 ' + (i + 1));
  }
}

function onChange(e) {
  var t = e.target;
  if (!t || !t.getAttribute) return;
  if (t.getAttribute('data-qe') === 'ans') {
    var q = qeQ(state.qedit, t.getAttribute('data-q'));
    var v = parseInt(t.value, 10);
    /* -1 = 随机,是个正经取值,别被 || 0 吃掉 */
    if (q) q.ans = isFinite(v) ? v : 0;
  }
}

/* A settings number is clamped the moment it is typed, and a nickname of pure
   spaces is not a name — the field keeps its text until it becomes valid. */
var AI_LIM = { base: 240, model: 60, key: 240, persona: 600 };
function aiPut(key, val) {
  var f = String(key).slice(3);
  if (!AI_LIM[f]) return false;
  S.ai[f] = String(val).slice(0, AI_LIM[f]);
  return true;
}

function applySet(key, value) {
  var v = String(value === undefined || value === null ? '' : value);
  if (key === 'myName') {
    if (!v.trim()) return;
    S.myName = v.trim().slice(0, 12);
    ME.name = S.myName;
    save();
    return;
  }
  /* AI 配置是纯文本,原样收下,只截长度 —— 每次按键都跑一遍 normAi 会把
     用户正在输入的地址和 key 修得没法用 */
  if (/^ai\./.test(key)) {
    if (aiPut(key, v)) save();
    return;
  }
  if (/^sched\./.test(key)) {
    if (schedPut(key, v)) { save(); kickScheduler(); }
    return;
  }
  /* 红包袋余额:直接改当前选中联系人那一对余额(元) */
  if (/^wallet\./.test(key)) {
    var n2 = parseFloat(v);
    if (!isFinite(n2) || n2 < 0) return;
    var field = key.slice(7);
    if (field !== 'mine' && field !== 'ta') return;
    walletOf(activeWalletCid())[field] = Math.round(n2 * 100) / 100;
    save();
    return;                          /* 不重绘:别把正在输入的数字框焦点冲掉 */
  }
  var n = parseFloat(v);
  if (!isFinite(n)) return;
  /* 朋友圈 / 信箱 / 表情包 / 通话的旋钮在设置里是 moment.xxx / letter.xxx /
     emoji.xxx / call.xxx 的点路径;统一走 S.settings.<组>.<字段> 再整层重建,
     否则顶层兜底会被 normSettings 白名单丢掉(通话踩过) */
  var dot = /^(moment|letter|emoji|call)\.(\w+)$/.exec(key);
  if (dot) {
    S.settings[dot[1]][dot[2]] = n;
    S.settings = normSettings(S.settings);
    save();
    return;
  }
  S.settings[key] = n;
  S.settings = normSettings(S.settings);
  if (key === 'schedCooldown') kickScheduler();
  save();
}

function clearComposeError() {
  if (!state.composing.err) return;
  state.composing.err = '';
  var m = document.getElementById('composeMsg');
  if (m) m.innerHTML = '<span style="color:var(--muted)">收信人：' + esc(person(state.composing.to).name) + '</span>';
}

function onKey(e) {
  if (e.key === 'Escape' && state.sheet) { ACTIONS['close-sheet'](); return; }
  if (e.key === 'Enter' && e.target && e.target.id === 'chatInput' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

/* 拍一拍 lives on a double tap of the speaker's face in the nav bar — the
   thread itself carries no avatars, so the face up there is the only one. */
function onDbl(e) {
  var el = e.target.closest ? e.target.closest('[data-pat]') : null;
  if (!el || !viewport.contains(el)) return;
  if (state.route !== 'chat-thread' || !state.param) return;
  e.preventDefault();
  doPat(state.param, true);
}

/* On a phone the keyboard is an overlay: without the visual viewport gap the
   input sits underneath it and the user types blind. */
function syncKeyboard() {
  var vv = window.visualViewport;
  if (!vv) return;
  var gap = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
  document.documentElement.style.setProperty('--kb', gap + 'px');
  if (gap > 40) {
    var body = document.querySelector('#appRoot .app-body');
    if (body) body.scrollTop = body.scrollHeight;
  }
}

/* ── D8 · BOOT ──────────────────────────────────────────────────────── */
function boot() {
  load();
  viewport.innerHTML = '';

  homeScreen = document.createElement('section');
  homeScreen.className = 'screen home';
  homeScreen.id = 'homeScreen';
  homeScreen.setAttribute('data-layer', 'home');
  homeScreen.setAttribute('data-od-id', 'screen-home');
  homeScreen.innerHTML = renderHome();

  appScreen = document.createElement('section');
  appScreen.className = 'screen';
  appScreen.id = 'appScreen';
  appScreen.setAttribute('data-layer', 'app');
  /* #appRoot needs a definite height so .app's height:100% has something to
     resolve against; the sheet layer lives outside it and is never rewritten
     by a route paint. */
  appScreen.innerHTML = '<div id="appRoot" style="height:100%"></div>' +
    '<div class="sheet-layer" id="sheetHost"></div>' +
    '<div class="overlay-layer" id="overlayHost"></div>';

  viewport.appendChild(homeScreen);
  viewport.appendChild(appScreen);

  /* 通话小窗的宿主层:挂在 #viewport 上而不是 #appRoot —— 路由重绘只重写
     #appRoot,碰不到这里,所以收起小窗后逛任何页面通话都不断(第10单验收5) */
  var miniHost = document.createElement('div');
  miniHost.className = 'call-mini-host';
  miniHost.id = 'callMiniHost';
  viewport.appendChild(miniHost);

  window.addEventListener('hashchange', sync);
  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.addEventListener('change', onChange);
  document.addEventListener('keydown', onKey);
  document.addEventListener('dblclick', onDbl);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', syncKeyboard);
    window.visualViewport.addEventListener('scroll', syncKeyboard);
  }
  window.addEventListener('beforeunload', function () { try { save(); } catch (e) { /* noop */ } });

  /* TA's own clock starts with the app */
  kickScheduler();

  var st0 = document.getElementById('statusTime');
  if (st0) st0.textContent = nowTime();

  setInterval(function () {
    var st = document.getElementById('statusTime');
    if (st) st.textContent = nowTime();
    var hc = document.getElementById('homeClock');
    if (hc) hc.textContent = nowTime();
  }, 30000);

  sync();
}

boot();

/* 走到这里说明启动成功,把不依赖 JS 的兜底提示层摘掉。
   放在 boot() 之后是有意的:万一 boot 抛错,这行不会执行,提示层继续留着,
   用户至少能看到人话说明,而不是白屏。 */
(function () {
  var bg = document.getElementById('bootGuard');
  if (bg && bg.parentNode) bg.parentNode.removeChild(bg);
})();

})();
</script>
</body>
</html>
