<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>云蓝桌面 · 小组件通讯</title>
<style>
/* ══════════════════════════════════════════════════════════════════════════
   1 · TOKENS
   Six colour tokens + derived values. No raw hex is used anywhere below
   this block — every colour resolves through var() or color-mix().
   ══════════════════════════════════════════════════════════════════════════ */
:root {
  /* core six — bound from the approved spec palette */
  --bg:      #E4F0FB;
  --surface: #FFFFFF;
  --fg:      #14304F;
  --muted:   #56779A;
  --border:  #C3D9F0;
  --accent:  #3E86D2;

  /* derived */
  --accent-strong: color-mix(in oklch, var(--accent) 84%, black);
  --accent-soft:   color-mix(in oklch, var(--accent) 12%, transparent);
  --accent-faint:  color-mix(in oklch, var(--accent) 6%, transparent);
  --open-press:    color-mix(in oklch, var(--accent) 12%, white);
  --fg-soft:       color-mix(in oklch, var(--fg) 5%, transparent);
  --fg-line:       color-mix(in oklch, var(--fg) 9%, transparent);
  --rose:          #E05C70;
  --gold:          #E0A32B;
  --jade:          #2E9E77;
  --scrim:         color-mix(in oklch, var(--fg) 42%, transparent);

  /* day-wallpaper stops (pure CSS scene — no photographic claim) */
  --sky-1: #B4D9F5;
  --sky-2: #7FB6E8;
  --sky-3: #3E86D2;
  --sky-sun: #FFF3D6;

  /* scene palette — artwork layers only (device hardware, tarot deck, red
     packet, call veil). Kept out of the UI token set on purpose: these are
     painted scenery, not interface colours, so nothing in the interface may
     reference them for chrome. */
  --hw-1: #0B0D11;  --hw-2: #2E3238;  --hw-3: #40444B;
  --hw-4: #23262C;  --hw-5: #0C0E12;
  --lens-1: #404B5C; --lens-2: #0A0C10;
  --deck-1: #1C3350; --deck-2: #16273E; --deck-3: #101C2E;
  --deck-4: #2A4165; --deck-5: #1B2E47;
  --call-1: #16324F; --call-2: #142942; --call-3: #0E1D31;
  --veil: rgba(126, 186, 236, .24);
  --mute-1: #3A4A5E; --mute-2: #B9C6D6; --mute-3: #44566B;
  --rp-1: #E8664F; --rp-2: #C9422F; --rp-ink: #FFE9C9; --rp-ink-2: #A83224;
  --seal-1: #FFD98A; --seal-3: #B8791A; --seal-ink: #6B4108;
  --open-1: #F2F6FB; --open-2: #E1EAF4;

  /* type — sans display for chrome, serif for editorial moments */
  --font-display: 'PingFang SC', 'HarmonyOS Sans SC', 'Source Han Sans SC', 'Microsoft YaHei UI', system-ui, sans-serif;
  --font-body:    'PingFang SC', 'HarmonyOS Sans SC', 'Source Han Sans SC', 'Microsoft YaHei UI', system-ui, sans-serif;
  --font-mono:    ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
  --font-serif:   'Songti SC', 'Source Han Serif SC', 'Noto Serif SC', Georgia, serif;

  /* type scale — baseline ≥14px so 720p preview rendering stays legible */
  --fs-title: 22px;
  --fs-h:     17px;
  --fs-body:  15px;
  --fs-sub:   14px;
  --fs-meta:  13px;
  --fs-micro: 12px;

  /* 4-point spacing grid */
  --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px;
  --s5: 20px; --s6: 24px; --s7: 32px; --s8: 44px;

  --radius-sm: 10px;
  --radius:    14px;
  --radius-lg: 20px;
  --radius-xl: 26px;
  --radius-pill: 999px;

  --shadow-soft: 0 2px 10px rgba(20, 48, 79, 0.07);
  --shadow:      0 10px 26px -10px rgba(20, 48, 79, 0.30);
  --shadow-lift: 0 18px 42px -16px rgba(20, 48, 79, 0.42);
  --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);

  /* handset shell */
  --phone-screen-width: 390px;
  --phone-screen-height: 844px;
  --phone-bezel: 10px;
  --phone-outer-radius: 52px;
  --phone-screen-radius: 42px;
  --phone-safe-top: 50px;
  --phone-safe-bottom: 28px;
  --status-h: 44px;
}

/* ══════════════════════════════════════════════════════════════════════════
   2 · BASE + HANDSET SHELL
   ══════════════════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 32px 24px;
  background: radial-gradient(circle at 50% 14%, color-mix(in oklch, white 88%, transparent), transparent 38%) var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: var(--fs-body);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; border-radius: 6px; }
img { display: block; max-width: 100%; }

.phone-frame {
  position: relative;
  width: calc(var(--phone-screen-width) + var(--phone-bezel) * 2);
  height: calc(var(--phone-screen-height) + var(--phone-bezel) * 2);
  padding: var(--phone-bezel);
  border-radius: var(--phone-outer-radius);
  background: linear-gradient(160deg, var(--hw-3) 0%, var(--hw-4) 46%, var(--hw-5) 100%);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.13),
    0 34px 70px -22px rgba(12,20,32,.55),
    0 10px 26px -12px rgba(12,20,32,.34);
  isolation: isolate;
}
.hardware-button {
  position: absolute; width: 3px; border-radius: 3px;
  background: linear-gradient(90deg, var(--hw-1), var(--hw-2) 62%, var(--hw-1));
}
.hardware-button.volume { left: -3px; top: 214px; height: 86px; }
.hardware-button.power  { right: -3px; top: 262px; height: 90px; }

.phone-screen {
  position: relative;
  width: var(--phone-screen-width);
  height: var(--phone-screen-height);
  overflow: hidden;
  border-radius: var(--phone-screen-radius);
  background: var(--bg);
}
.status-bar {
  position: absolute; z-index: 60; inset: 0 0 auto;
  height: var(--status-h);
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 26px 0;
  color: var(--fg);
  font-size: var(--fs-meta); font-weight: 600;
  letter-spacing: 0.01em;
  pointer-events: none;
}
.status-bar .status-icons { display: inline-flex; align-items: center; gap: 5px; }
.status-bar .status-icons svg { width: 15px; height: 11px; fill: currentColor; }
.status-bar .status-icons .battery { width: 23px; }
.camera-dot {
  position: absolute; z-index: 62; top: 13px; left: 50%;
  width: 9px; height: 9px; transform: translateX(-50%);
  border-radius: 50%;
  background: radial-gradient(circle at 36% 34%, var(--lens-1) 0 14%, var(--lens-2) 38%, black 78%);
  pointer-events: none;
}
.gesture-indicator {
  position: absolute; z-index: 60; left: 50%; bottom: 7px;
  width: 108px; height: 4px; transform: translateX(-50%);
  border-radius: 99px; background: var(--fg); opacity: .55;
  pointer-events: none;
}
.gesture-indicator.on-dark { background: white; opacity: .7; }

/* the app viewport — screens are stacked here */
.viewport {
  position: absolute; inset: 0;
  overflow: hidden;
  /* isolate keeps both layers inside one predictable context, and the opaque
     base means no frame of any transition can ever read as far as the page
     background behind the handset */
  isolation: isolate;
  background: var(--bg);
}
.screen {
  position: absolute; inset: 0;
  /* z-index turns every layer into its own stacking context. Without it a
     child's z-index escapes into .phone-frame's context, so .home-inner
     (z-index: 1) painted the wallpaper and its icons over the open app. */
  z-index: 0;
  padding-top: var(--status-h);
  padding-bottom: var(--phone-safe-bottom);
  display: none;
  background: var(--bg);
}
.screen.is-active { display: block; }
.screen[data-layer="home"] { z-index: 1; }
.screen[data-layer="app"]  { z-index: 2; }

/* the app layer paints its own opaque canvas — a surface, not a hole in the
   handset. Anything translucent inside it (glass nav, composer) now reads
   against this sheet instead of the wallpaper underneath. */
.screen[data-layer="app"] {
  padding: 0;
  background: var(--bg);
  border-radius: var(--phone-screen-radius);
  box-shadow: 0 -1px 0 color-mix(in oklch, var(--border) 60%, transparent);
  overflow: hidden;
  will-change: transform;
}

/* the wallpaper's own layout applies only while it is the visible layer, so an
   inactive home is display:none twice over: it can never paint its gradient or
   take keyboard focus under an open app */
.screen.home { flex-direction: column; }
.screen.home.is-active { display: flex; }
.screen[data-layer="app"].is-entering { animation: appIn 300ms var(--ease) both; }
.screen[data-layer="app"].is-leaving  { animation: appOut 300ms var(--ease) both; pointer-events: none; }
@keyframes appIn  { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes appOut { from { transform: translateY(0); } to { transform: translateY(100%); } }

/* ══════════════════════════════════════════════════════════════════════════
   3 · STATUS PALETTE (three tints, one role each — contrast measured)
   ══════════════════════════════════════════════════════════════════════════ */
.tint-blue { background: color-mix(in oklch, var(--accent) 11%, white); color: var(--accent-strong); }
.tint-red  { background: color-mix(in oklch, var(--rose) 15%, white);   color: color-mix(in oklch, var(--rose) 78%, black); }
.tint-gold { background: color-mix(in oklch, var(--gold) 20%, white);   color: color-mix(in oklch, var(--gold) 62%, black); }
.tint-jade { background: color-mix(in oklch, var(--jade) 13%, white);   color: color-mix(in oklch, var(--jade) 76%, black); }

/* ══════════════════════════════════════════════════════════════════════════
   4 · HOME — wallpaper, widgets, app grid
   ══════════════════════════════════════════════════════════════════════════ */
.home {
  padding: 0;
  background: linear-gradient(170deg, var(--sky-1) 0%, var(--sky-2) 44%, var(--sky-3) 100%);
}
/* the wallpaper's column layout and visibility are declared next to .screen
   above, so one rule owns the layer's activation */
.home::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(circle at 74% 15%, color-mix(in oklch, var(--sky-sun) 62%, transparent), transparent 34%);
}
.home-inner {
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  height: 100%;
  padding: var(--status-h) var(--s5) 0;
}
.home-top {
  display: flex; align-items: flex-start; justify-content: space-between;
  padding-top: var(--s3);
  color: white;
}
.home-clock { font-size: 40px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.home-date { font-size: var(--fs-sub); opacity: .92; margin-top: 6px; }
.home-weather {
  display: flex; align-items: center; gap: var(--s2);
  padding: 8px 13px; border-radius: var(--radius-pill);
  background: rgba(255,255,255,.22);
  backdrop-filter: blur(10px);
  font-size: var(--fs-meta);
}
.home-weather svg { width: 17px; height: 17px; }

.hero-widget {
  margin-top: var(--s5);
  display: flex; align-items: center; gap: var(--s3);
  padding: 13px var(--s4);
  border-radius: var(--radius-lg);
  background: rgba(255,255,255,.86);
  backdrop-filter: blur(16px);
  box-shadow: var(--shadow-soft);
  color: var(--fg);
  text-align: left;
  width: 100%;
  transition: transform 160ms var(--ease), background 160ms var(--ease);
}
.hero-widget:hover { background: white; }
.hero-widget:active { transform: scale(.98); }
.hero-widget .hw-av { width: 42px; height: 42px; flex: none; }
.hero-widget .hw-body { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.hero-widget .hw-name { font-size: var(--fs-body); font-weight: 600; }
.hero-widget .hw-msg {
  font-size: var(--fs-meta); color: var(--muted); margin-top: 3px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.hero-widget .hw-count {
  flex: none; min-width: 22px; height: 22px; padding: 0 6px;
  display: grid; place-items: center;
  border-radius: var(--radius-pill);
  background: var(--rose); color: white;
  font-size: 11px; font-weight: 700;
}

.widget-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); margin-top: var(--s2); }
.mini-widget {
  display: flex; align-items: center; gap: var(--s3);
  padding: 11px var(--s3);
  border-radius: var(--radius);
  background: rgba(255,255,255,.7);
  backdrop-filter: blur(14px);
  color: var(--fg);
  transition: transform 160ms var(--ease), background 160ms var(--ease);
}
.mini-widget:hover { background: rgba(255,255,255,.9); }
.mini-widget:active { transform: scale(.97); }
.mini-widget .mw-mark { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border-radius: 9px; background: rgba(255,255,255,.85); color: var(--accent-strong); }
.mini-widget .mw-mark svg { width: 15px; height: 15px; }
.mini-widget .mw-k { font-size: var(--fs-micro); color: var(--muted); display: block; }
.mini-widget .mw-v { font-size: var(--fs-sub); font-weight: 600; }
.mini-widget .mw-v.num { font-variant-numeric: tabular-nums; }

.app-grid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-auto-rows: min-content;
  gap: var(--s5) var(--s3);
  align-content: start;
  padding-top: var(--s6);
}
.app-icon {
  display: flex; flex-direction: column; align-items: center; gap: 7px;
  color: white;
}
.app-icon .glyph {
  position: relative;
  width: 56px; height: 56px;
  display: grid; place-items: center;
  border-radius: 17px;
  background: var(--tile, white);
  color: var(--tile-fg, white);
  box-shadow: 0 6px 14px -6px rgba(12,28,48,.45), inset 0 1px 0 rgba(255,255,255,.32);
  transition: transform 180ms var(--ease);
}
.app-icon .glyph svg { width: 26px; height: 26px; }
.app-icon:hover .glyph { transform: translateY(-3px) scale(1.03); }
.app-icon:active .glyph { transform: scale(.93); }
.app-icon .label {
  font-size: var(--fs-micro); font-weight: 500;
  color: white; text-shadow: 0 1px 4px rgba(12,28,48,.5);
  max-width: 100%; text-align: center;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.app-icon .badge {
  position: absolute; top: -4px; right: -4px;
  min-width: 20px; height: 20px; padding: 0 5px;
  display: grid; place-items: center;
  border-radius: var(--radius-pill);
  background: var(--rose); color: white;
  font-size: 11px; font-weight: 700;
  box-shadow: 0 0 0 2px rgba(255,255,255,.65);
}

/* ══════════════════════════════════════════════════════════════════════════
   5 · APP CHROME — nav bar, back, FAB, segmented control
   ══════════════════════════════════════════════════════════════════════════ */
.app { display: flex; flex-direction: column; height: 100%; background: var(--bg); }
.app-nav {
  flex: none;
  display: flex; align-items: center; gap: var(--s3);
  padding: var(--status-h) var(--s4) var(--s3);
  background: color-mix(in oklch, var(--surface) 88%, transparent);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--border);
}
.app-nav.solid { background: var(--surface); }
.nav-back {
  width: 34px; height: 34px; flex: none;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--accent-faint);
  color: var(--accent-strong);
  transition: background 160ms var(--ease), transform 140ms var(--ease);
}
.nav-back:hover { background: color-mix(in oklch, var(--accent) 20%, white); }
.nav-back:active { transform: scale(.92); }
.nav-back svg { width: 17px; height: 17px; }
.nav-title { font-size: var(--fs-h); font-weight: 600; letter-spacing: -0.01em; }
.nav-sub { font-size: var(--fs-micro); color: var(--muted); margin-top: 2px; }
/* the title block shares the row with a back key, an avatar and up to two
   actions — without min-width it refuses to shrink and pushes the acts out */
.nav-head { min-width: 0; }
.nav-title, .nav-sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-av { flex: none; display: block; }
.nav-spacer { flex: 1; min-width: 0; }
.nav-act {
  width: 34px; height: 34px; flex: none;
  display: grid; place-items: center;
  border-radius: 50%; color: var(--muted);
  transition: color 160ms var(--ease), background 160ms var(--ease), transform 140ms var(--ease);
}
.nav-act:hover { color: var(--accent-strong); background: var(--accent-faint); }
.nav-act:active { transform: scale(.92); }
.nav-act svg { width: 18px; height: 18px; }

.app-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
.app-body::-webkit-scrollbar { display: none; }
.pad { padding: var(--s4); }
.pad-b { padding-bottom: var(--s8); }

.fab {
  position: absolute; right: var(--s5); bottom: calc(var(--phone-safe-bottom) + var(--s4));
  width: 52px; height: 52px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--accent); color: white;
  box-shadow: var(--shadow-lift);
  transition: transform 160ms var(--ease), background 160ms var(--ease);
}
.fab:hover { background: var(--accent-strong); transform: translateY(-2px); }
.fab:active { transform: scale(.94); }
.fab svg { width: 22px; height: 22px; }

.segmented {
  display: flex; gap: 3px; padding: 3px;
  border-radius: var(--radius-pill);
  background: color-mix(in oklch, var(--accent) 10%, white);
}
.segmented button {
  flex: 1; text-align: center;
  padding: 8px 12px;
  border-radius: var(--radius-pill);
  font-size: var(--fs-sub); font-weight: 500;
  color: var(--muted);
  transition: background 160ms var(--ease), color 160ms var(--ease);
  min-height: 38px;
}
.segmented button:hover { color: var(--fg); }
.segmented button.on { background: var(--surface); color: var(--accent-strong); box-shadow: var(--shadow-soft); }

/* ══════════════════════════════════════════════════════════════════════════
   6 · SHARED PARTS — avatar, card, row, button, field
   ══════════════════════════════════════════════════════════════════════════ */
.avatar {
  flex: none;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--accent-soft);
  color: var(--accent-strong);
  font-weight: 600;
  overflow: hidden;
  user-select: none;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar.a36 { width: 36px; height: 36px; font-size: var(--fs-sub); }
.avatar.a40 { width: 40px; height: 40px; font-size: var(--fs-sub); }
.avatar.a44 { width: 44px; height: 44px; font-size: var(--fs-body); }
.avatar.a72 { width: 72px; height: 72px; font-size: 26px; }
.avatar.a120 { width: 120px; height: 120px; font-size: 44px; }
.avatar[data-tone="1"] { background: color-mix(in oklch, var(--jade) 16%, white); color: color-mix(in oklch, var(--jade) 76%, black); }
.avatar[data-tone="2"] { background: color-mix(in oklch, var(--gold) 22%, white); color: color-mix(in oklch, var(--gold) 62%, black); }
.avatar[data-tone="3"] { background: color-mix(in oklch, var(--rose) 16%, white); color: color-mix(in oklch, var(--rose) 74%, black); }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: var(--s4);
  box-shadow: var(--shadow-soft);
}
.list { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.list > * + * { border-top: 1px solid var(--border); }
.row-item {
  display: flex; align-items: center; gap: var(--s3);
  width: 100%; padding: 13px var(--s4);
  text-align: left; color: var(--fg);
  transition: background 160ms var(--ease);
  min-height: 56px;
}
.row-item:hover { background: var(--accent-faint); }
.row-item:active { background: var(--accent-soft); }
.row-item .ri-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.row-item .ri-t { font-size: var(--fs-body); font-weight: 500; }
.row-item .ri-s {
  font-size: var(--fs-meta); color: var(--muted); margin-top: 3px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.row-item .ri-end { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
.row-item .ri-time { font-size: var(--fs-micro); color: var(--muted); font-variant-numeric: tabular-nums; }
.row-item .chev { flex: none; width: 16px; height: 16px; color: var(--border); }

.unread-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--rose); }
.unread-pill {
  min-width: 20px; height: 20px; padding: 0 6px;
  display: grid; place-items: center;
  border-radius: var(--radius-pill);
  background: var(--rose); color: white;
  font-size: 11px; font-weight: 700;
}

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 44px; padding: 0 var(--s5);
  border-radius: var(--radius-pill);
  font-size: var(--fs-body); font-weight: 600;
  transition: background 160ms var(--ease), color 160ms var(--ease), border-color 160ms var(--ease), transform 140ms var(--ease);
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { background: var(--accent-strong); }
.btn-secondary { background: var(--surface); color: var(--fg); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--accent-faint); border-color: var(--accent); color: var(--accent-strong); }
.btn-quiet { background: var(--accent-faint); color: var(--accent-strong); }
.btn-quiet:hover { background: var(--accent-soft); }
.btn-block { width: 100%; }
.btn-sm { min-height: 36px; padding: 0 var(--s4); font-size: var(--fs-sub); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field > label { font-size: var(--fs-meta); color: var(--muted); font-weight: 500; }
.input, .textarea {
  width: 100%; min-height: 44px;
  padding: 11px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--fg);
  font-size: var(--fs-body);
  transition: border-color 160ms var(--ease), box-shadow 160ms var(--ease);
}
.input::placeholder, .textarea::placeholder { color: var(--muted); }
.input:hover, .textarea:hover { border-color: color-mix(in oklch, var(--accent) 42%, var(--border)); }
.input:focus, .textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.textarea { min-height: 116px; resize: vertical; line-height: 1.6; }

.section-label {
  font-size: var(--fs-micro); font-weight: 600; letter-spacing: 0.06em;
  color: var(--muted); text-transform: uppercase;
  padding: 0 var(--s1) var(--s2);
}
.empty-note { padding: var(--s7) var(--s4); text-align: center; color: var(--muted); font-size: var(--fs-sub); }
.num { font-variant-numeric: tabular-nums; }
.serif { font-family: var(--font-serif); }

/* ══════════════════════════════════════════════════════════════════════════
   7 · CHAT — conversation list and thread
   ══════════════════════════════════════════════════════════════════════════ */
.chat-date-chip {
  align-self: center;
  padding: 4px 12px; margin: var(--s3) auto;
  border-radius: var(--radius-pill);
  background: color-mix(in oklch, var(--fg) 6%, white);
  color: var(--muted); font-size: var(--fs-micro);
}
.thread {
  display: flex; flex-direction: column;
  padding: var(--s4) var(--s4) var(--s2);
}
/* Every bubble climbs out of the brand colour's own hue family, but the stops
   are written as explicit OKLCH rather than color-mix: a pink cast and a violet
   cast were what the nested mixes actually resolved to, and both fought the
   sky-blue shell. These four literals were measured through a canvas readback,
   so what ships is what was checked. */
:root {
  --tone-them: oklch(97.4% 0.012 245);   /* #f0f8fe — a whisper of sky, not white */
  --tone-t1:   oklch(92% 0.046 188);     /* #c3efea — jade, matching avatar tone 1 */
  --tone-t2:   oklch(92.5% 0.052 84);    /* #f7e4c0 — gold, matching avatar tone 2 */
  --tone-t3:   oklch(91.5% 0.048 352);   /* #fed6e6 — rose, matching avatar tone 3 */
  --tone-tip:  var(--accent);
}
/* measured: ink on every one of those surfaces runs 7.5:1 – 19.6:1 */
:root {
  --ink-t1: oklch(38% 0.076 200);
  --ink-t2: oklch(40% 0.082 76);
  --ink-t3: oklch(38% 0.096 6);
}
.msg-row { display: flex; margin-bottom: var(--s3); }
/* consecutive bubbles from one voice tighten into a stack */
.msg-row.tight { margin-bottom: 4px; }
.msg {
  display: flex; gap: var(--s2);
  align-items: flex-end;
  min-width: 0;
}
.msg.them { margin-right: auto; }
.msg.me { margin-left: auto; flex-direction: row-reverse; }
/* A bubble must be measured against the row it sits in, not against its own
   flex base size — otherwise "我这边云压得很低，像要下雪" wraps with 雪 stranded on
   line two. The row owns the spacing, so each side declares its own ceiling:
   a DM bubble is a reading column (~34 CJK glyphs), a group bubble gives up
   the avatar column as well so every speaker lines up on one edge. */
.msg-row > .msg { flex: 1 1 auto; min-width: 0; }
/* no avatar column in the thread any more — the speaker's face lives in the
   nav bar, so a bubble only has to stay inside its reading column */
.msg.me > .bubble { max-width: min(86%, 400px); }
.msg.them > .bubble { max-width: min(86%, 400px); }
/* a grouped bubble keeps its column width, so the stack still reads as one
   utterance — without the avatar column there is nothing to step aside for */


.msg .bubble {
  position: relative;
  max-width: 78%;
  padding: 9px 13px 8px;
  border-radius: 18px;
  font-size: var(--fs-body);
  line-height: 1.5;
  overflow-wrap: anywhere;
  word-break: break-word;
}
.bubble-text { display: block; }
.bubble-meta {
  display: flex; align-items: center; justify-content: flex-end;
  gap: 4px; margin-top: 4px;
  font-size: 11px; line-height: 1;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* ── their side: one crisp sheet of paper, tail folded out of the same sheet ── */
.msg.them .bubble {
  background: var(--tone-them);
  border: 1px solid var(--border);
  border-bottom-left-radius: 0;
  box-shadow: 0 1px 2px color-mix(in oklch, var(--fg) 6%, transparent),
              0 8px 18px -14px color-mix(in oklch, var(--fg) 46%, transparent);
  color: var(--fg);
}
.msg.them.voiced .bubble {
  background: var(--who-bg, var(--tone-them));
  border-color: color-mix(in oklch, var(--who-tip, var(--border)) 72%, white);
}
.msg.them .bubble::before {
  content: ""; position: absolute; left: -9px; bottom: -1px;
  width: 12px; height: 16px;
  background: var(--border);
  clip-path: polygon(100% 0, 0 100%, 100% 100%);
}
.msg.them .bubble::after {
  content: ""; position: absolute; left: -9px; bottom: 0;
  width: 13px; height: 16px;
  background: inherit;
  clip-path: polygon(100% 0, 0 100%, 100% 100%);
}
.msg.them.voiced .bubble::before {
  background: color-mix(in oklch, var(--who-tip, var(--border)) 72%, white);
}
.msg.them .bubble-meta { color: color-mix(in oklch, var(--fg) 62%, var(--tone-them)); }

/* ── my side: a sky-coloured sheet, tail on the other shoulder ── */
.msg.me .bubble {
  background: linear-gradient(158deg,
    color-mix(in oklch, var(--accent) 88%, white) 0%,
    var(--accent-strong) 78%);
  color: white;
  border-bottom-right-radius: 0;
  box-shadow: 0 1px 2px color-mix(in oklch, var(--accent-strong) 20%, transparent),
              0 10px 22px -16px var(--accent-strong);
}
.msg.me .bubble::after {
  content: ""; position: absolute; right: -9px; bottom: 0;
  width: 13px; height: 16px;
  background: var(--accent-strong);
  clip-path: polygon(0 0, 100% 100%, 0 100%);
}
/* time and receipt sit inside the bubble's lower right, so the column keeps a
   clean edge and no timestamp can ever cross the tail */
.msg.me .bubble-meta { color: color-mix(in oklch, white 80%, transparent); }
.bubble-read { display: inline-flex; align-items: center; gap: 3px; }
.bubble-read svg { width: 11px; height: 11px; }

.msg .who {
  display: block; margin-bottom: 3px;
  font-size: var(--fs-micro); font-weight: 600;
  color: var(--who-ink, var(--muted));
}
.msg .who::after {
  content: ""; display: block; width: 18px; height: 2px; margin-top: 4px;
  border-radius: 2px; background: var(--who-tip, var(--border));
}

/* one reveal per thread, not per bubble: a 60-message scroll must not stagger */
.thread.reveal .msg-row { animation: bubbleIn 320ms var(--ease) both; }
@keyframes bubbleIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }


.composer {
  flex: none;
  display: flex; align-items: flex-end; gap: var(--s2);
  padding: var(--s3) var(--s4) calc(var(--phone-safe-bottom) + var(--s2));
  background: color-mix(in oklch, var(--surface) 92%, transparent);
  backdrop-filter: blur(18px);
  border-top: 1px solid var(--border);
}
.composer .cbtn {
  width: 40px; height: 40px; flex: none;
  display: grid; place-items: center;
  border-radius: 50%; color: var(--muted);
  transition: color 160ms var(--ease), background 160ms var(--ease), transform 140ms var(--ease);
}
.composer .cbtn:hover { color: var(--accent-strong); background: var(--accent-faint); }
.composer .cbtn:active { transform: scale(.9); }
.composer .cbtn svg { width: 21px; height: 21px; }
.composer .cinput {
  flex: 1; min-width: 0;
  min-height: 40px; max-height: 96px;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--surface);
  font-size: var(--fs-body); line-height: 1.4;
  resize: none;
}
.composer .cinput:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.composer .send {
  width: 40px; height: 40px; flex: none;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--accent); color: white;
  transition: background 160ms var(--ease), transform 140ms var(--ease);
}
.composer .send:hover { background: var(--accent-strong); }
.composer .send:active { transform: scale(.9); }
.composer .send svg { width: 18px; height: 18px; }
.composer .send[disabled] { background: var(--border); cursor: not-allowed; }
.composer .cbtn.on { color: var(--accent-strong); background: var(--accent-faint); }

/* 输入条上滑面板:夹在消息流与输入条之间,展开把输入条顶上去(不浮层盖住内容) */
.chat-foot { flex: none; display: flex; flex-direction: column; min-height: 0; }
.chat-panel { display: none; overflow: hidden; border-top: 1px solid var(--border); background: var(--surface); }
.chat-panel[data-open="1"] { display: block; animation: panelUp 200ms var(--ease) both; }
@keyframes panelUp { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
.chat-panel .panel-pad { padding: var(--s4) var(--s4) calc(var(--phone-safe-bottom) + var(--s4)); }
.panel-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s3); }
.panel-item { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 6px 0; border-radius: var(--radius); color: var(--muted); transition: color 160ms var(--ease); }
.panel-item:hover { color: var(--accent-strong); }
.panel-item .pi-ic { width: 50px; height: 50px; display: grid; place-items: center; border-radius: 15px; background: var(--accent-faint); color: var(--accent-strong); transition: background 160ms var(--ease); }
.panel-item:hover .pi-ic { background: var(--accent-soft); }
.panel-item .pi-ic svg { width: 24px; height: 24px; }
.panel-item .pi-t { font-size: var(--fs-meta); }
.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ══════════════════════════════════════════════════════════════════════════
   8 · LETTERS — inbox rows and the writing desk
   ══════════════════════════════════════════════════════════════════════════ */
.paper {
  position: relative;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface);
  background: repeating-linear-gradient(
    var(--surface) 0 31px,
    color-mix(in oklch, var(--border) 55%, white) 31px 32px
  );
  padding: var(--s5) var(--s4) var(--s4);
}
.paper .input, .paper .textarea {
  background: color-mix(in oklch, var(--surface) 82%, transparent);
  background: color-mix(in oklch, var(--surface) 82%, transparent);
  border-color: color-mix(in oklch, var(--border) 80%, transparent);
}
.paper .textarea { min-height: 190px; border-color: transparent; background: transparent; }
.paper .textarea:focus { box-shadow: none; border-color: transparent; background: color-mix(in oklch, var(--accent) 5%, transparent); }
.paper-stamp {
  position: absolute; top: var(--s4); right: var(--s4);
  font-family: var(--font-serif);
  font-size: var(--fs-micro); letter-spacing: 0.16em;
  color: color-mix(in oklch, var(--rose) 72%, white);
  border: 1px solid color-mix(in oklch, var(--rose) 44%, white);
  border-radius: 5px; padding: 3px 7px;
  transform: rotate(-4deg);
}
.letter-open {
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface);
  padding: var(--s5) var(--s4);
  box-shadow: var(--shadow-soft);
}
.letter-open h3 { font-family: var(--font-serif); font-size: var(--fs-h); margin-bottom: var(--s2); }
.letter-open .from { font-size: var(--fs-meta); color: var(--muted); margin-bottom: var(--s3); }
.letter-open .body { font-family: var(--font-serif); font-size: var(--fs-body); line-height: 1.85; color: var(--fg); }
.letter-open .sign { font-family: var(--font-serif); text-align: right; margin-top: var(--s4); color: var(--muted); }

/* ══════════════════════════════════════════════════════════════════════════
   9 · MOMENTS — feed, photo grid, action bar
   ══════════════════════════════════════════════════════════════════════════ */
.moment {
  display: flex; gap: var(--s3);
  padding: var(--s4);
}
.moment + .moment { border-top: 1px solid var(--border); }
.moment .mo-body { flex: 1; min-width: 0; }
.moment .mo-name { font-size: var(--fs-body); font-weight: 600; }
.moment .mo-text { font-size: var(--fs-body); margin-top: 5px; line-height: 1.55; overflow-wrap: anywhere; }
.moment .mo-time { font-size: var(--fs-micro); color: var(--muted); margin-top: var(--s3); }
.moment .photo {
  margin-top: var(--s3);
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--accent-faint);
}
.moment .photo img { width: 100%; height: auto; }
.moment .actions {
  display: flex; gap: var(--s2);
  margin-top: var(--s3);
  padding-top: var(--s3);
  border-top: 1px solid color-mix(in oklch, var(--border) 60%, white);
}
.moment .act {
  display: inline-flex; align-items: center; gap: 5px;
  min-height: 34px; padding: 0 11px;
  border-radius: var(--radius-pill);
  font-size: var(--fs-meta); color: var(--muted);
  transition: color 160ms var(--ease), background 160ms var(--ease), transform 140ms var(--ease);
}
.moment .act:hover { color: var(--accent-strong); background: var(--accent-faint); }
.moment .act:active { transform: scale(.95); }
.moment .act svg { width: 17px; height: 17px; }
.moment .act.liked { color: var(--rose); background: color-mix(in oklch, var(--rose) 12%, white); }
.moment .act.liked:hover { color: color-mix(in oklch, var(--rose) 78%, black); background: color-mix(in oklch, var(--rose) 18%, white); }

.like-line {
  margin-top: var(--s2);
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  background: var(--accent-faint);
  font-size: var(--fs-meta); color: var(--muted);
}
.like-line .who { color: var(--accent-strong); font-weight: 600; }
.like-line .cm { color: var(--fg); }
.like-line .cm + .cm { margin-top: 5px; }
.like-line .cm .who { margin-right: 4px; }

/* ── 第4/5单 · 空间 tab / 未读描边 / 位置 / 贴纸 / 计数 / AI 解读 ───────── */
.cid-tabs { display: flex; gap: var(--s2); overflow-x: auto; scrollbar-width: none; }
.cid-tabs::-webkit-scrollbar { display: none; }
.cid-tabs .chip-pick { flex: 0 0 auto; }
.cid-tabs .num { margin-left: 4px; color: var(--rose); font-weight: 600; }

.seg-tabs {
  display: flex; gap: 4px; padding: 4px;
  border-radius: var(--radius-pill); background: var(--accent-faint);
}
.seg-tab {
  flex: 1; min-height: 32px; border-radius: var(--radius-pill);
  font-size: var(--fs-meta); color: var(--muted);
  transition: color 160ms var(--ease), background 160ms var(--ease);
}
.seg-tab.on { background: var(--surface); color: var(--accent-strong); font-weight: 600; box-shadow: var(--shadow-soft); }

.moment .mo-head { display: flex; align-items: center; gap: var(--s2); }
.moment .mo-head .mo-name { flex: 1; min-width: 0; }
.moment .mo-place {
  display: inline-flex; align-items: center; gap: 4px;
  margin-top: 7px; font-size: var(--fs-micro); color: var(--muted);
}
.moment .mo-place svg { width: 13px; height: 13px; }
.moment .mo-sticker { display: block; margin-top: var(--s3); }
.moment .mo-sticker svg { width: 34px; height: 34px; color: var(--accent-strong); }
.moment .mo-sticker.is-text {
  display: inline-block; margin-top: var(--s3); padding: 3px 9px;
  border-radius: var(--radius-sm); background: var(--accent-faint);
  color: var(--accent-strong); font-size: var(--fs-meta);
}
.moment.is-new { background: color-mix(in oklch, var(--accent) 7%, transparent); }
.moment .mo-del { flex: none; width: 28px; height: 28px; }
.moment .mo-del svg { width: 15px; height: 15px; }

.row-item.is-unread {
  background: color-mix(in oklch, var(--accent) 6%, transparent);
  box-shadow: inset 0 0 0 1.5px color-mix(in oklch, var(--accent) 50%, transparent);
}
.row-item .ri-tag {
  display: inline-block; margin-right: 6px; padding: 1px 6px;
  border-radius: 5px; font-size: 10px; font-weight: 600; letter-spacing: .04em;
  color: var(--accent-strong); background: var(--accent-faint); vertical-align: 1px;
}
.row-item .ri-tag.out {
  color: color-mix(in oklch, var(--rose) 74%, black);
  background: color-mix(in oklch, var(--rose) 14%, white);
}
.count-note { margin-top: 6px; text-align: right; font-size: var(--fs-micro); color: var(--muted); }
.count-note.over { color: var(--rose); font-weight: 600; }

.letter-open .body .in-stick svg { width: 20px; height: 20px; vertical-align: -4px; color: var(--accent-strong); }
.letter-open .body .in-textstick {
  display: inline-block; padding: 0 6px; border-radius: 5px;
  background: var(--accent-faint); color: var(--accent-strong);
  font-family: var(--font-body); font-size: var(--fs-meta);
}
.ai-box {
  margin-top: var(--s3); padding: var(--s3);
  border-radius: var(--radius-sm);
  border: 1px dashed color-mix(in oklch, var(--accent) 42%, transparent);
  background: var(--accent-faint);
  font-size: var(--fs-meta); line-height: 1.7; color: var(--fg);
}
.ai-box .ai-h { margin-bottom: 6px; font-weight: 600; color: var(--accent-strong); }
.ai-box .err { color: var(--rose); }
.seal-mark {
  display: inline-block; margin-top: var(--s2);
  padding: 2px 8px; border-radius: 5px;
  font-size: var(--fs-micro); letter-spacing: .08em; color: var(--muted);
  background: var(--fg-soft);
}

/* ══════════════════════════════════════════════════════════════════════════
   10 · TAROT — deal row and revealed cards
   ══════════════════════════════════════════════════════════════════════════ */
.tarot-stage {
  border-radius: var(--radius-lg);
  padding: var(--s6) var(--s4) var(--s5);
  background: linear-gradient(168deg, var(--deck-1) 0%, var(--deck-2) 58%, var(--deck-3) 100%);
  color: white;
}
.tarot-stage .eyebrow {
  font-size: var(--fs-micro); letter-spacing: 0.14em; text-transform: uppercase;
  color: color-mix(in oklch, var(--sky-1) 82%, white);
}
.tarot-stage h2 { font-family: var(--font-serif); font-size: var(--fs-title); margin-top: var(--s2); }
.tarot-stage .sub { font-size: var(--fs-sub); color: color-mix(in oklch, white 72%, transparent); margin-top: 6px; }
.deal-row { display: flex; gap: var(--s3); margin-top: var(--s5); }
.deal-slot { flex: 1; perspective: 900px; }
.card3d {
  position: relative; width: 100%;
  aspect-ratio: 5 / 8;
  transform-style: preserve-3d;
  transition: transform 600ms var(--ease);
}
.deal-slot.flipped .card3d { transform: rotateY(180deg); }
.card3d .face {
  position: absolute; inset: 0;
  border-radius: 10px;
  backface-visibility: hidden;
  display: grid; place-items: center;
  overflow: hidden;
}
.card3d .back {
  background:
    repeating-linear-gradient(45deg, color-mix(in oklch, var(--sky-1) 26%, transparent) 0 5px, transparent 5px 10px),
    linear-gradient(160deg, var(--deck-4) 0%, var(--deck-5) 100%),
    var(--deck-5);
  border: 1px solid color-mix(in oklch, var(--sky-1) 40%, transparent);
}
.card3d .back .sigil {
  width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid color-mix(in oklch, var(--sky-1) 62%, transparent);
  display: grid; place-items: center;
  color: color-mix(in oklch, var(--sky-1) 92%, white);
}
.card3d .back .sigil svg { width: 17px; height: 17px; }
.card3d .front {
  transform: rotateY(180deg);
  background: var(--surface);
  border: 1px solid var(--border);
  grid-template-rows: 1fr auto;
}
.card3d .front .art { width: 100%; height: 100%; display: grid; place-items: center; padding: 6px; }
.card3d .front .art img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; }
.card3d .front .art .fallback { font-family: var(--font-serif); font-size: 26px; color: var(--fg); }
.card3d .front .cap {
  padding: 6px 4px 8px;
  font-size: var(--fs-micro); font-weight: 600; text-align: center;
  color: var(--fg);
  border-top: 1px solid var(--border);
  background: var(--surface);
}
.card3d .front .cap .ori { display: block; font-weight: 500; font-size: 11px; color: var(--muted); margin-top: 2px; }
.card3d .front .cap .ori.rev { color: color-mix(in oklch, var(--rose) 74%, black); }

.meaning-list { margin-top: var(--s4); display: flex; flex-direction: column; gap: var(--s2); }
.meaning {
  display: flex; gap: var(--s3);
  padding: var(--s3) var(--s4);
  border-radius: var(--radius-sm);
  background: var(--surface);
  border: 1px solid var(--border);
}
.meaning .m-k { font-family: var(--font-serif); font-size: var(--fs-body); font-weight: 600; flex: none; }
.meaning .m-v { font-size: var(--fs-sub); color: var(--muted); }
.meaning .m-tag { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: var(--radius-pill); flex: none; align-self: flex-start; }

/* 第17单 · 占卜:解读区 + 历史列表。
   逆位只在文字上标注(「逆位」小标 + 玫红),牌面不翻转 —— 旋转过的牌看不清字。 */
.tr-text { font-size: var(--fs-body); line-height: 1.78; color: var(--fg); white-space: normal; }
.tr-src {
  margin-left: 8px; padding: 1px 7px; border-radius: var(--radius-pill);
  font-size: var(--fs-micro); font-weight: 600;
  background: var(--fg-soft); color: var(--muted);
}
.tr-src.ai { background: var(--accent-soft); color: var(--accent-strong); }
.btn.is-off { opacity: .45; }
/* 第17单 · 聊天流里的每日一牌卡:自带底色,不跟气泡一起翻色 */
.tarot-msg {
  display: flex; flex-direction: column; gap: 6px;
  width: min(76vw, 268px);
  padding: 12px 14px;
  border-radius: var(--radius-md);
  background: linear-gradient(168deg, var(--deck-1) 0%, var(--deck-2) 60%, var(--deck-3) 100%);
  color: white;
  border: 1px solid color-mix(in oklch, var(--sky-1) 34%, transparent);
}
.tarot-msg .tm-head { display: flex; align-items: center; gap: 6px; }
.tarot-msg .tm-ic { display: grid; place-items: center; }
.tarot-msg .tm-ic svg { width: 13px; height: 13px; color: color-mix(in oklch, var(--sky-1) 90%, white); }
.tarot-msg .tm-k { font-size: var(--fs-micro); letter-spacing: .1em; color: color-mix(in oklch, var(--sky-1) 86%, white); }
.tarot-msg .tm-ori {
  margin-left: auto; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: var(--radius-pill);
  background: color-mix(in oklch, white 22%, transparent);
}
.tarot-msg.rev .tm-ori { background: color-mix(in oklch, var(--rose) 62%, black); }
.tarot-msg .tm-name { font-family: var(--font-serif); font-size: var(--fs-h); font-weight: 600; }
.tarot-msg .tm-kw { font-size: var(--fs-micro); color: color-mix(in oklch, white 78%, transparent); }
.tarot-msg .tm-text { font-size: var(--fs-sub); line-height: 1.7; color: color-mix(in oklch, white 92%, transparent); }
.tr-list { display: flex; flex-direction: column; }
.tr-row {
  display: flex; align-items: center; gap: var(--s3);
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.tr-row:last-child { border-bottom: none; }
.tr-row .tr-body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.tr-row .tr-t {
  font-size: var(--fs-body);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tr-row .tr-s { font-size: var(--fs-micro); color: var(--muted); }
.tr-row .tr-time { font-size: var(--fs-micro); color: var(--muted); white-space: nowrap; flex: none; }

/* ══════════════════════════════════════════════════════════════════════════
   11 · QUESTIONNAIRE — progress, questions, choices
   ══════════════════════════════════════════════════════════════════════════ */
.progress-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); }
.progress-head .ph-k { font-size: var(--fs-sub); color: var(--muted); }
.progress-head .ph-v { font-size: var(--fs-h); font-weight: 600; font-variant-numeric: tabular-nums; }
.progress-track { height: 7px; border-radius: var(--radius-pill); background: color-mix(in oklch, var(--accent) 14%, white); overflow: hidden; margin-top: var(--s3); }
.progress-fill { height: 100%; width: 0; border-radius: var(--radius-pill); background: var(--accent); transition: width 280ms var(--ease); }

.q-item { padding: var(--s4); border-bottom: 1px solid var(--border); }
.q-item:last-child { border-bottom: 0; }
.q-item .q-no { font-size: var(--fs-micro); font-weight: 600; color: var(--accent-strong); letter-spacing: 0.06em; }
.q-item .q-t { font-size: var(--fs-body); font-weight: 600; margin-top: 5px; line-height: 1.5; }
.q-item .q-hint { font-size: var(--fs-meta); color: var(--muted); margin-top: 4px; }
.q-opts { display: flex; flex-direction: column; gap: var(--s2); margin-top: var(--s3); }
.q-opt {
  display: flex; align-items: center; gap: var(--s3);
  min-height: 48px; padding: 11px 16px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface);
  transition: border-color 160ms var(--ease), background 160ms var(--ease);
  width: 100%; text-align: left;
}
.q-opt:hover { border-color: color-mix(in oklch, var(--accent) 46%, var(--border)); background: var(--accent-faint); }
.q-opt .box {
  width: 20px; height: 20px; flex: none;
  border: 1.5px solid var(--border); border-radius: 50%;
  display: grid; place-items: center;
  transition: border-color 160ms var(--ease), background 160ms var(--ease);
}
.q-opt .box.sq { border-radius: 6px; }
.q-opt .box i { width: 10px; height: 10px; border-radius: 50%; background: transparent; transition: background 160ms var(--ease); }
.q-opt .box.sq i { width: 11px; height: 11px; border-radius: 3px; }
.q-opt .box svg { width: 12px; height: 12px; color: white; opacity: 0; transition: opacity 160ms var(--ease); }
.q-opt .q-label { font-size: var(--fs-body); }
.q-opt[aria-checked="true"] { border-color: var(--accent); background: var(--accent-faint); }
.q-opt[aria-checked="true"] .box { border-color: var(--accent); background: var(--accent); }
.q-opt[aria-checked="true"] .box i { background: white; }
.q-opt[aria-checked="true"] .box.sq i { background: transparent; }
.q-opt[aria-checked="true"] .box.sq svg { opacity: 1; }
.q-result {
  margin-top: var(--s4); padding: var(--s5) var(--s4);
  border-radius: var(--radius); border: 1px solid var(--border);
  background: var(--surface); box-shadow: var(--shadow-soft);
}
.q-result .qr-k { font-size: var(--fs-micro); color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
.q-result .qr-v { font-family: var(--font-serif); font-size: var(--fs-title); margin-top: 6px; }
.q-result .qr-d { font-size: var(--fs-sub); color: var(--muted); margin-top: var(--s2); line-height: 1.6; }
.score-row { display: flex; gap: var(--s2); margin-top: var(--s4); }
.score-chip { flex: 1; text-align: center; padding: 9px 6px; border-radius: var(--radius-sm); background: var(--accent-faint); }
.score-chip .sk-k { font-size: var(--fs-micro); color: var(--muted); }
.score-chip .sk-v { font-size: var(--fs-h); font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }

/* ── 第12单 · 问卷:列表 / 逐题作答 / 结果 / 编辑器 / 聊天卡 ────────── */
.qz-sec {
  font-size: var(--fs-micro); font-weight: 600; letter-spacing: 0.1em;
  color: var(--muted); text-transform: uppercase; margin-top: var(--s2);
}
.qz-card .qzc-top { display: flex; align-items: baseline; gap: var(--s2); }
.qz-card .qzc-name { font-size: var(--fs-body); font-weight: 600; }
.qz-card .qzc-from { font-size: var(--fs-micro); color: var(--muted); }
.qz-card .qzc-meta { font-size: var(--fs-meta); color: var(--muted); margin-top: 5px; }
.qz-card .qzc-acts { display: flex; align-items: center; gap: var(--s2); margin-top: var(--s3); }

/* 历史成绩行 */
.qz-run {
  display: flex; align-items: center; gap: var(--s3); width: 100%;
  padding: 13px var(--s4); text-align: left; border-bottom: 1px solid var(--border);
}
.qz-run:last-child { border-bottom: 0; }
.qz-run .qzr-pct { flex: none; font-family: var(--font-serif); font-size: 22px; font-weight: 700;
  color: var(--accent-strong); font-variant-numeric: tabular-nums; }
.qz-run .qzr-pct small { font-size: 12px; margin-left: 1px; }
.qz-run .qzr-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.qz-run .qzr-name { font-size: var(--fs-body); font-weight: 500; }
.qz-run .qzr-sub { font-size: var(--fs-micro); color: var(--muted); }
.qz-run .qzr-go { flex: none; color: var(--muted); display: grid; place-items: center; }
.qz-run .qzr-go svg { width: 16px; height: 16px; }

/* 逐题作答:题干与选项四周留白 ≥16px(历史 bug:文字贴边) */
.qz-qbox { padding: 18px 16px 16px; }
.qz-qbox .q-t { font-size: var(--fs-h); font-weight: 600; line-height: 1.55; }
.qz-nav { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); min-height: 44px; }
.qz-nav-hint { font-size: var(--fs-meta); color: var(--muted); }

/* TA 逐题作答的思考动画 */
.qt-box .qt-head { display: flex; align-items: center; gap: 7px;
  font-size: var(--fs-sub); font-weight: 600; color: var(--accent-strong); }
.qt-box .qt-head svg { width: 17px; height: 17px; }
.qt-lines { margin-top: var(--s3); }
.qt-line {
  display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3);
  padding: 9px 0; border-bottom: 1px dashed var(--border); opacity: .45;
  transition: opacity 260ms var(--ease);
}
.qt-line:last-child { border-bottom: 0; }
.qt-line.done { opacity: 1; }
.qt-line .qt-q { flex: 1; min-width: 0; font-size: var(--fs-meta); color: var(--muted); }
.qt-line .qt-a { flex: none; max-width: 46%; font-size: var(--fs-meta); font-weight: 600; text-align: right; }
.qt-line.done .qt-a { color: var(--accent-strong); }
.qt-line .qt-wait { display: inline-grid; place-items: center; color: var(--muted); }
.qt-line .qt-wait svg { width: 14px; height: 14px; animation: qtSpin 1.7s linear infinite; }
@keyframes qtSpin { to { transform: rotate(360deg); } }

/* 结果:默契度是「渐变文字」——底色从笔画里透出来,不是一条渐变长条 */
.qz-score { padding: var(--s5) var(--s4); text-align: center; }
.qz-score .qzs-k { font-size: var(--fs-micro); letter-spacing: 0.1em; color: var(--muted);
  text-transform: uppercase; }
.qz-score .qzs-v {
  margin-top: 6px; font-family: var(--font-serif); font-size: 72px; font-weight: 700;
  line-height: 1.05; font-variant-numeric: tabular-nums;
  color: var(--accent-strong);                       /* 不支持 text-clip 时的兜底色 */
  background: linear-gradient(135deg, var(--accent-strong) 0%, #7CA6E6 40%, var(--jade) 70%, var(--gold) 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.qz-score .qzs-v small { font-size: 30px; margin-left: 3px; }
.qz-score .qzs-same { font-size: var(--fs-sub); color: var(--muted); margin-top: var(--s3); }
.qz-score .qzs-c { font-size: var(--fs-sub); line-height: 1.65; margin-top: var(--s3); }
.qz-score .qzs-time { font-size: var(--fs-micro); color: var(--muted); margin-top: var(--s3); }

/* 逐题对照:一致项绿色 */
.qz-row { padding: 13px var(--s4); border-bottom: 1px solid var(--border); }
.qz-row:last-child { border-bottom: 0; }
.qz-row .qzr-q { font-size: var(--fs-body); line-height: 1.5; }
.qz-row .qzr-a { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 7px; }
.qz-row .qza {
  display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px;
  border-radius: var(--radius-pill); font-size: var(--fs-meta); background: var(--accent-faint);
}
.qz-row .qza em { font-style: normal; font-size: var(--fs-micro); color: var(--muted); }
.qz-row.ok .qza { background: color-mix(in oklch, var(--jade) 15%, white); }
.qz-row .qza-ok { display: inline-flex; align-items: center; gap: 3px; font-size: var(--fs-micro);
  font-weight: 600; color: color-mix(in oklch, var(--jade) 72%, black); }
.qz-row .qza-ok svg { width: 13px; height: 13px; }
/* 「标准答案=随机」那几题,结果页在 TA 的答案后面挂个小标 */
.qzr-tag {
  margin-left: 2px; padding: 1px 6px; border-radius: var(--radius-pill);
  font-size: var(--fs-micro); font-weight: 600;
  background: color-mix(in oklch, var(--accent) 22%, white);
  color: var(--accent-strong);
}

/* 编辑器 */
.qe-q .qe-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.qe-q .qe-no { font-size: var(--fs-micro); font-weight: 600; letter-spacing: 0.06em;
  color: var(--accent-strong); }
.qe-q .qe-hint { margin-top: 7px; font-size: var(--fs-micro); color: var(--muted); line-height: 1.5; }
.qe-opts { display: flex; flex-direction: column; gap: var(--s2); margin-bottom: var(--s2); }
.qe-opt { display: flex; align-items: center; gap: var(--s2); }
.qe-opt .input { flex: 1; min-width: 0; }
.qe-x { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
  color: var(--muted); background: var(--accent-faint); }
.qe-x svg { width: 14px; height: 14px; }
.qe-x[disabled] { opacity: .32; }
select.input {
  appearance: none; -webkit-appearance: none; padding-right: 32px; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
    linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%;
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
}

/* 聊天流里的问卷邀请卡 / 结果卡 */
.qz-msg {
  display: flex; align-items: center; gap: var(--s3);
  width: 236px; max-width: 100%; padding: 13px 14px; text-align: left;
  border-radius: var(--radius); background: var(--surface);
  border: 1px solid var(--border); box-shadow: var(--shadow-soft);
  transition: transform 140ms var(--ease), border-color 160ms var(--ease);
}
.qz-msg:active { transform: scale(.98); }
.qz-msg .qzm-ic {
  flex: none; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
  background: var(--accent-faint); color: var(--accent-strong);
}
.qz-msg .qzm-ic svg { width: 18px; height: 18px; }
.qz-msg .qzm-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.qz-msg .qzm-t { font-size: var(--fs-body); font-weight: 600;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qz-msg .qzm-s { font-size: var(--fs-micro); color: var(--muted); }
.qz-msg .qzm-go { flex: none; color: var(--muted); display: grid; place-items: center; }
.qz-msg .qzm-go svg { width: 16px; height: 16px; }
.qz-msg .qzm-pct { flex: none; font-family: var(--font-serif); font-size: 22px; font-weight: 700;
  color: var(--accent-strong); font-variant-numeric: tabular-nums; }
.qz-msg .qzm-pct small { font-size: 12px; margin-left: 1px; }
.qz-msg.is-done { border-color: color-mix(in oklch, var(--jade) 42%, var(--border)); }

/* ══════════════════════════════════════════════════════════════════════════
   12 · RED PACKET — envelope, flip reveal
   ══════════════════════════════════════════════════════════════════════════ */
.envelope {
  position: relative;
  width: 100%;
  border-radius: var(--radius);
  background: linear-gradient(168deg, var(--rp-1) 0%, var(--rp-2) 100%);
  color: var(--rp-ink);
  padding: var(--s5) var(--s4);
  overflow: hidden;
  text-align: center;
  box-shadow: var(--shadow);
}
.envelope::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 46%;
  background: linear-gradient(180deg, rgba(255,255,255,.14), transparent);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  pointer-events: none;
}
.envelope .seal {
  position: relative;
  width: 54px; height: 54px; margin: 0 auto var(--s3);
  border-radius: 50%;
  background: radial-gradient(circle at 36% 32%, var(--seal-1), var(--gold) 62%, var(--seal-3) 100%);
  display: grid; place-items: center;
  color: var(--seal-ink);
  font-weight: 700; font-size: 20px;
  box-shadow: inset 0 -2px 6px rgba(107,65,8,.32);
}
.envelope .amount { font-family: var(--font-serif); font-size: 34px; font-weight: 700; letter-spacing: -0.01em; }
.envelope .amount small { font-size: 17px; margin-right: 2px; }
.envelope .from { font-size: var(--fs-meta); opacity: .88; margin-top: 6px; }
.envelope .open-btn {
  margin-top: var(--s4);
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 42px; padding: 0 var(--s6);
  border-radius: var(--radius-pill);
  background: var(--rp-ink); color: var(--rp-ink-2);
  font-weight: 700; font-size: var(--fs-body);
  transition: background 160ms var(--ease), transform 140ms var(--ease);
}
.envelope .open-btn:hover { background: white; }
.envelope .open-btn:active { transform: scale(.96); }
.envelope.opened { background: linear-gradient(168deg, var(--open-1) 0%, var(--open-2) 100%); color: var(--fg); }
.envelope.opened::before { display: none; }
.envelope.opened .seal { background: color-mix(in oklch, var(--gold) 24%, white); color: color-mix(in oklch, var(--gold) 60%, black); box-shadow: none; }
.packet-status {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: var(--radius-pill);
  font-size: var(--fs-micro); font-weight: 600;
}
.amount-num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 600; }

/* 红包复用进聊天流:一条消息就是一张信封卡 */
.rp-card {
  position: relative; overflow: hidden;
  width: 212px; display: flex; flex-direction: column; align-items: center;
  padding: 16px 16px 12px; border-radius: var(--radius);
  background: linear-gradient(165deg, var(--rp-1), var(--rp-2));
  color: var(--rp-ink); text-align: center; border: none; font: inherit;
  box-shadow: 0 4px 14px -7px rgba(140, 30, 32, .55);
  transition: transform 140ms var(--ease), background 220ms var(--ease);
}
/* 信封盖:渐变倒三角,复用红包页原版信封的 lid —— 「封好口」的感觉就靠它 */
.rp-card::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 62px; z-index: 0;
  background: linear-gradient(180deg, rgba(255,255,255,.26) 0%, rgba(255,255,255,.10) 60%, rgba(255,255,255,.01) 100%);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  filter: drop-shadow(0 1.5px 0 rgba(107, 24, 22, .20));
  pointer-events: none;
}
.rp-card > * { position: relative; z-index: 1; }
.rp-card.is-done { background: linear-gradient(165deg, var(--open-1), var(--open-2)); color: var(--fg); }
.rp-card.is-done::before { display: none; }
.rp-card[data-act] { cursor: pointer; }
.rp-card[data-act]:active { transform: scale(.97); }
.rp-card .rp-seal {
  width: 40px; height: 40px; margin-bottom: 8px; border-radius: 50%;
  background: radial-gradient(circle at 36% 32%, var(--seal-1), var(--gold) 62%, var(--seal-3) 100%);
  color: var(--seal-ink); display: grid; place-items: center; font-weight: 700; font-size: 16px;
  box-shadow: inset 0 -2px 6px rgba(107,65,8,.32);
}
.rp-card.is-done .rp-seal { background: color-mix(in oklch, var(--gold) 24%, white); color: color-mix(in oklch, var(--gold) 60%, black); }
.rp-card .rp-seal svg { width: 18px; height: 18px; }
.rp-card .rp-amt { font-family: var(--font-serif); font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
.rp-card .rp-amt small { font-size: 14px; margin-right: 1px; }
.rp-card .rp-wish { font-size: var(--fs-meta); opacity: .9; margin-top: 5px; }
.rp-card .rp-state { font-size: var(--fs-micro); opacity: .85; margin-top: 8px; }

.overlay-layer { position: absolute; inset: 0; z-index: 90; display: none; }
.overlay-layer.on { display: block; }

/* 拆红包 overlay:整屏盖住,中间一张大信封,戳一下翻面 */
.rp-overlay {
  position: absolute; inset: 0; display: grid; place-items: center;
  padding: var(--s5); background: var(--scrim); animation: scrimIn 200ms var(--ease) both;
}
.rp-big {
  position: relative; overflow: hidden; width: 100%; max-width: 300px; padding: 30px 22px 24px;
  border-radius: var(--radius-xl); text-align: center;
  background: linear-gradient(168deg, var(--rp-1) 0%, var(--rp-2) 100%);
  color: var(--rp-ink); box-shadow: var(--shadow);
  transition: background 260ms var(--ease), color 260ms var(--ease), transform 200ms var(--ease);
}
/* 大信封同样带渐变倒三角盖子,和原版红包页一致 */
.rp-big::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 46%; z-index: 0;
  background: linear-gradient(180deg, rgba(255,255,255,.20) 0%, rgba(255,255,255,.055) 62%, transparent 100%);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  filter: drop-shadow(0 1.5px 0 rgba(107, 24, 22, .18));
  pointer-events: none;
}
.rp-big > * { position: relative; z-index: 1; }
.rp-big[data-act] { cursor: pointer; }
.rp-big[data-act]:active { transform: scale(.985); }
.rp-big .seal {
  width: 68px; height: 68px; margin: 0 auto var(--s4); border-radius: 50%;
  background: radial-gradient(circle at 36% 32%, var(--seal-1), var(--gold) 62%, var(--seal-3) 100%);
  color: var(--seal-ink); display: grid; place-items: center; font-weight: 700; font-size: 24px;
  box-shadow: inset 0 -2px 6px rgba(107,65,8,.32);
}
.rp-big.opened { background: linear-gradient(168deg, var(--open-1) 0%, var(--open-2) 100%); color: var(--fg); }
.rp-big.opened::before { display: none; }
.rp-big.opened .seal { background: color-mix(in oklch, var(--gold) 24%, white); color: color-mix(in oklch, var(--gold) 60%, black); box-shadow: none; }
.rp-big .seal svg { width: 28px; height: 28px; }
.rp-big .amount { font-family: var(--font-serif); font-size: 40px; font-weight: 700; letter-spacing: -0.01em; }
.rp-big .amount small { font-size: 20px; margin-right: 2px; }
.rp-big .from { font-size: var(--fs-sub); opacity: .9; margin-top: 8px; }
.rp-big .rp-wish-big { font-size: var(--fs-meta); opacity: .85; margin-top: 10px; }
.rp-big .rp-open-btn {
  margin-top: var(--s5); display: inline-flex; align-items: center; justify-content: center;
  min-height: 44px; padding: 0 var(--s7); border-radius: var(--radius-pill);
  background: var(--rp-ink); color: var(--rp-ink-2); font-weight: 700; font-size: var(--fs-body);
  transition: background 160ms var(--ease), transform 140ms var(--ease);
}
.rp-big.opened .rp-open-btn { background: var(--fg); color: var(--surface); }
.rp-big .rp-open-btn:active { transform: scale(.96); }
.rp-close {
  position: absolute; top: var(--s5); right: var(--s4);
  width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
  color: white; background: rgba(0,0,0,.28);
}
.rp-close svg { width: 18px; height: 18px; }

/* 红包页:双钱包卡 + 流水 */
.rp-wallets { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); }
.rp-wallet { padding: var(--s4); border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); }
.rp-wallet .rw-who { font-size: var(--fs-meta); color: var(--muted); }
.rp-wallet .rw-bal { font-family: var(--font-serif); font-size: 25px; font-weight: 700; margin-top: 6px; }
.rp-wallet .rw-sub { font-size: var(--fs-micro); color: var(--muted); margin-top: 6px; }
.rp-rec { display: flex; align-items: center; gap: var(--s3); padding: 12px var(--s4); border-bottom: 1px solid var(--border); }
.rp-rec:last-child { border-bottom: none; }
.rp-rec .rr-ic { width: 34px; height: 34px; flex: none; border-radius: 50%; display: grid; place-items: center; }
.rp-rec .rr-ic svg { width: 16px; height: 16px; }
.rp-rec .rr-ic.in { background: color-mix(in oklch, var(--jade) 16%, white); color: color-mix(in oklch, var(--jade) 70%, black); }
.rp-rec .rr-ic.out { background: color-mix(in oklch, var(--rose) 14%, white); color: color-mix(in oklch, var(--rose) 70%, black); }
.rp-rec .rr-body { flex: 1; min-width: 0; }
.rp-rec .rr-t { font-size: var(--fs-body); }
.rp-rec .rr-s { font-size: var(--fs-meta); color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rp-rec .rr-amt { font-family: var(--font-mono); font-weight: 700; font-variant-numeric: tabular-nums; }
.rp-rec .rr-amt.in { color: color-mix(in oklch, var(--jade) 70%, black); }
.rp-rec .rr-amt.out { color: color-mix(in oklch, var(--rose) 74%, black); }
.rp-wallet-line {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px var(--s4); border-radius: var(--radius);
  background: var(--accent-faint); color: var(--muted); font-size: var(--fs-sub);
}
.rp-wallet-line b { color: var(--fg); font-size: var(--fs-h); }

/* ══════════════════════════════════════════════════════════════════════════
   13 · MUSIC — artwork, progress, transport, queue
   ══════════════════════════════════════════════════════════════════════════ */
.album {
  display: block; width: 100%;
  max-height: 340px;
  aspect-ratio: 1 / 1;
  border-radius: var(--radius-lg);
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--accent-soft);
}
.album img { width: 100%; height: 100%; object-fit: cover; }
.track-title { font-size: var(--fs-title); font-weight: 600; margin-top: var(--s5); }
.track-artist { font-size: var(--fs-body); color: var(--muted); margin-top: 4px; }
.track-time { display: flex; justify-content: space-between; margin-top: var(--s3); font-size: var(--fs-micro); color: var(--muted); font-variant-numeric: tabular-nums; }
.seek { height: 5px; border-radius: var(--radius-pill); background: color-mix(in oklch, var(--accent) 14%, white); overflow: hidden; margin-top: 6px; }
.seek i { display: block; height: 100%; width: 0; border-radius: var(--radius-pill); background: var(--accent); }
.transport { display: flex; align-items: center; justify-content: center; gap: var(--s4); margin-top: var(--s5); }
.transport .tbtn {
  display: grid; place-items: center;
  width: 46px; height: 46px; border-radius: 50%;
  color: var(--fg);
  transition: background 160ms var(--ease), color 160ms var(--ease), transform 140ms var(--ease);
}
.transport .tbtn:hover { background: var(--accent-faint); color: var(--accent-strong); }
.transport .tbtn:active { transform: scale(.92); }
.transport .tbtn svg { width: 22px; height: 22px; }
.transport .tplay {
  width: 62px; height: 62px; border-radius: 50%;
  background: var(--accent); color: white;
  display: grid; place-items: center;
  box-shadow: var(--shadow);
  transition: background 160ms var(--ease), transform 140ms var(--ease);
}
.transport .tplay:hover { background: var(--accent-strong); }
.transport .tplay:active { transform: scale(.94); }
.transport .tplay svg { width: 26px; height: 26px; }
.now-sync {
  display: flex; align-items: center; justify-content: center; gap: var(--s2);
  margin-top: var(--s4); padding: 9px 12px;
  border-radius: var(--radius-pill);
  background: var(--accent-faint); color: var(--accent-strong);
  font-size: var(--fs-meta);
}
.now-sync .avatars { display: inline-flex; }
.now-sync .avatars .avatar { width: 22px; height: 22px; font-size: 11px; border: 2px solid var(--surface); }
.now-sync .avatars .avatar + .avatar { margin-left: -8px; }
.queue-row.on { background: var(--accent-faint); }
.queue-row.on .ri-t { color: var(--accent-strong); }
.eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 13px; }
.eq i { width: 3px; border-radius: 2px; background: var(--accent); animation: eq 900ms ease-in-out infinite; }
.eq i:nth-child(1) { height: 6px; animation-delay: 0ms; }
.eq i:nth-child(2) { height: 12px; animation-delay: 160ms; }
.eq i:nth-child(3) { height: 8px; animation-delay: 320ms; }
@keyframes eq { 0%, 100% { transform: scaleY(.5); } 50% { transform: scaleY(1); } }

/* 一起听 · 歌曲行封面:必须有自己的 48px 容器并 object-fit:cover。
   早先的 bug 是把 <img> 直接塞进歌名那一行、又没限高,img 按原图尺寸裸露,
   封面巨大和名字挤在一起。 */
.mq-cover {
  flex: none;
  width: 48px; height: 48px;
  border-radius: var(--radius-sm);
  overflow: hidden;
  display: grid; place-items: center;
  background: linear-gradient(135deg, var(--accent-soft), var(--open-2));
  border: 1px solid var(--border);
}
.mq-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mq-note { font-size: 18px; color: var(--accent-strong); }
.mq-del {
  flex: none;
  display: grid; place-items: center;
  width: 34px; height: 34px; border-radius: 50%;
  color: var(--muted);
  transition: background 160ms var(--ease), color 160ms var(--ease);
}
.mq-del:hover { background: var(--accent-faint); color: var(--accent-strong); }
.mq-del:active { transform: scale(.94); }
.mq-del svg { width: 17px; height: 17px; }
.queue-row:hover .mq-del { color: var(--fg); }

/* 聊天流里的「一起听」邀约卡 */
.song-card {
  display: flex; align-items: center; gap: var(--s3);
  width: 100%; margin-top: var(--s2);
  padding: var(--s3);
  border-radius: var(--radius);
  border: 1px dashed var(--border);
  background: var(--accent-faint);
  text-align: left;
  transition: border-color 160ms var(--ease), background 160ms var(--ease);
}
.song-card:hover { border-color: var(--accent); background: var(--accent-soft); }
.song-card-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.song-card-t { font-size: var(--fs-sub); font-weight: 600; color: var(--fg); }
.song-card-s { font-size: var(--fs-micro); color: var(--muted); }
.song-card > svg { flex: none; width: 20px; height: 20px; color: var(--accent-strong); }

/* 首页小组件:正在播的时候让图标轻轻亮一下,不用整页重绘 */
.mini-widget .mw-mark.is-playing { color: var(--accent-strong); animation: mwPulse 1.6s ease-in-out infinite; }
@keyframes mwPulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }

/* ══════════════════════════════════════════════════════════════════════════
   14 · EMOJI — category tabs, sticker grid, recents
   ══════════════════════════════════════════════════════════════════════════ */
.tabs {
  display: flex; gap: var(--s1);
  padding: var(--s1);
  border-radius: var(--radius-pill);
  background: color-mix(in oklch, var(--accent) 10%, white);
  overflow-x: auto; scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tabs button {
  flex: none; padding: 7px 15px; min-height: 34px;
  border-radius: var(--radius-pill);
  font-size: var(--fs-sub); color: var(--muted);
  transition: background 160ms var(--ease), color 160ms var(--ease);
}
.tabs button:hover { color: var(--fg); }
.tabs button.on { background: var(--surface); color: var(--accent-strong); box-shadow: var(--shadow-soft); }

.sticker-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s2); }
.sticker {
  aspect-ratio: 1 / 1;
  display: grid; place-items: center;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface);
  transition: transform 160ms var(--ease), border-color 160ms var(--ease), background 160ms var(--ease);
}
.sticker:hover { border-color: var(--accent); background: var(--accent-faint); transform: translateY(-2px); }
.sticker:active { transform: scale(.9); }
.sticker svg { width: 34px; height: 34px; color: var(--accent-strong); }
.sticker.text-chip { font-family: var(--font-serif); font-size: var(--fs-body); color: var(--fg); font-weight: 600; padding: 4px; text-align: center; line-height: 1.25; }
.sticker.pulse { animation: stickerPulse 420ms var(--ease); }
@keyframes stickerPulse {
  0% { transform: scale(1); }
  42% { transform: scale(1.22); border-color: var(--accent); background: var(--accent-soft); }
  100% { transform: scale(1); }
}

/* ── 表情包(第9单):面板网格 / 管理态 / 聊天与信件里的表情 ─────────────── */
.emj-tabs { margin-bottom: 12px; }
/* 导入进度就长在这一行里(「已处理 3/12」);空的时候不占位置 */
.emj-prog { min-height: 18px; font-size: var(--fs-sub); color: var(--accent-strong); margin: 0 0 6px; }
.emj-prog:empty { min-height: 0; margin: 0; }
.emj-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s2); }
.emj-item {
  position: relative;
  aspect-ratio: 1 / 1;
  display: grid; place-items: center;
  padding: 6px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface);
  overflow: hidden;
  transition: transform 160ms var(--ease), border-color 160ms var(--ease), background 160ms var(--ease);
}
.emj-item:hover { border-color: var(--accent); background: var(--accent-faint); transform: translateY(-2px); }
.emj-item:active { transform: scale(.92); }
/* 隐藏项在管理态里是灰的,但它还在库里(只是 TA 抽不到) */
.emj-item.off { opacity: .34; filter: grayscale(1); }
.emj-item .emj-ch { font-size: 26px; line-height: 1; }
/* 图片按自己的比例装进格子 —— 不裁切成固定尺寸(第8条) */
.emj-item img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
.emj-x {
  position: absolute; top: 0; right: 0;
  width: 22px; height: 22px; line-height: 22px; text-align: center;
  border-radius: 0 var(--radius-sm) 0 8px;
  background: color-mix(in oklch, var(--rose) 86%, black);
  color: #fff; font-size: var(--fs-micro); cursor: pointer;
}
.emj-empty {
  padding: 22px 12px; text-align: center;
  font-size: var(--fs-sub); color: var(--muted);
  border: 1px dashed var(--border); border-radius: var(--radius-sm);
}
.emj-actions { display: flex; gap: var(--s2); margin-top: 12px; flex-wrap: wrap; }
.emj-actions .chip-pick { flex: 1 1 42%; justify-content: center; }
.emj-hint { margin-top: 12px; font-size: var(--fs-sub); color: var(--muted); line-height: 1.55; }

/* 聊天里单独一条的表情:没有气泡框,只有一张大图 */
.stk-msg { display: grid; place-items: center; width: 104px; height: 104px; padding: 2px; }
.stk-msg img { max-width: 100%; max-height: 100%; object-fit: contain; }
.stk-msg .emj-ch { font-size: 72px; line-height: 1; }
.stk-meta { display: block; margin-top: 3px; font-size: var(--fs-micro); color: var(--muted); text-align: center; }
/* 与文字同条的表情:贴在气泡文字下面 */
.stk-inline { display: inline-block; vertical-align: middle; margin: 3px 0 0 4px; }
.stk-inline img { max-width: 72px; max-height: 72px; vertical-align: middle; object-fit: contain; }
.stk-inline .emj-ch { font-size: 30px; line-height: 1; }
/* 信纸正文里插入的表情 */
.emj-inline { display: inline-block; vertical-align: middle; }
.emj-inline img { max-width: 46px; max-height: 46px; vertical-align: middle; object-fit: contain; }
.emj-inline .emj-ch { font-size: 26px; }

/* ══════════════════════════════════════════════════════════════════════════
   15 · CALLS — incoming and active
   ══════════════════════════════════════════════════════════════════════════ */
.call-screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center;
  padding: calc(var(--status-h) + var(--s6)) var(--s5) calc(var(--phone-safe-bottom) + var(--s6));
  background: linear-gradient(172deg, var(--call-1) 0%, var(--call-2) 52%, var(--call-3) 100%);
  color: white;
  overflow: hidden;
}
.call-screen::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(circle at 50% 26%, var(--veil), transparent 46%);
}
.call-screen > * { position: relative; z-index: 1; }
.call-avatar-wrap { position: relative; display: grid; place-items: center; margin-top: var(--s5); }
.call-ring {
  position: absolute; width: 132px; height: 132px; border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,.34);
  animation: ripple 2600ms var(--ease) infinite;
}
.call-ring.r2 { animation-delay: 1300ms; }
@keyframes ripple {
  0% { transform: scale(.9); opacity: .7; }
  100% { transform: scale(1.7); opacity: 0; }
}
.call-name { font-size: 26px; font-weight: 600; margin-top: var(--s5); }
.call-kind { font-size: var(--fs-sub); color: rgba(255,255,255,.68); margin-top: 6px; }
.call-timer { font-family: var(--font-mono); font-size: 30px; font-weight: 600; margin-top: var(--s4); font-variant-numeric: tabular-nums; }
.call-hint { margin-top: var(--s4); font-size: var(--fs-meta); color: rgba(255,255,255,.6); }
.call-actions { display: flex; gap: 68px; margin-top: auto; margin-bottom: var(--s5); }
.call-btn { display: flex; flex-direction: column; align-items: center; gap: var(--s2); font-size: var(--fs-meta); color: rgba(255,255,255,.86); }
.call-btn .disc {
  width: 68px; height: 68px; border-radius: 50%;
  display: grid; place-items: center;
  transition: transform 160ms var(--ease), box-shadow 160ms var(--ease);
  box-shadow: 0 12px 26px -10px rgba(0,0,0,.55);
}
.call-btn .disc svg { width: 27px; height: 27px; }
.call-btn.accept .disc { background: var(--jade); color: white; }
.call-btn.accept:hover .disc { background: color-mix(in oklch, var(--jade) 84%, black); }
.call-btn.decline .disc { background: var(--rose); color: white; }
.call-btn.decline:hover .disc { background: color-mix(in oklch, var(--rose) 84%, black); }
.call-btn:active .disc { transform: scale(.92); }
.call-btn.answered .disc { background: var(--mute-1); color: var(--mute-2); box-shadow: none; }
.call-btn.answered:hover .disc { background: var(--mute-3); }
.call-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s4) var(--s3); width: 100%; margin-top: var(--s6); }
.call-grid .call-btn { gap: 7px; }
.call-grid .call-btn .disc { width: 54px; height: 54px; background: rgba(255,255,255,.14); color: white; box-shadow: none; }
.call-grid .call-btn .disc svg { width: 21px; height: 21px; }
.call-grid .call-btn:hover .disc { background: rgba(255,255,255,.24); }
.call-grid .call-btn[aria-pressed="true"] .disc { background: white; color: var(--fg); }
.call-end { margin-top: auto; }

/* 通话卡片(聊天流里的一张卡:结局 + 时长)。自带底色,不跟气泡一起翻色 */
.call-card {
  width: 208px; display: flex; align-items: center; gap: var(--s3);
  padding: 11px 13px; border-radius: var(--radius);
  background: linear-gradient(160deg, var(--call-1), var(--call-3));
  color: white; box-shadow: 0 4px 14px -8px rgba(14, 29, 49, .6);
}
.call-card .cc-ic {
  width: 34px; height: 34px; border-radius: 50%; flex: 0 0 auto;
  display: grid; place-items: center; background: rgba(255, 255, 255, .16);
}
.call-card .cc-ic svg { width: 17px; height: 17px; }
.call-card.fail .cc-ic { background: color-mix(in oklch, var(--rose) 58%, transparent); }
.call-card .cc-body { min-width: 0; }
.call-card .cc-t { font-size: var(--fs-sub); font-weight: 500; }
.call-card .cc-s { margin-top: 2px; font-size: var(--fs-micro); color: rgba(255, 255, 255, .66); }

/* 通话记录页:本月四个数 + 逐条记录 */
.cl-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s2); }
.cl-stat {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 10px 4px; border-radius: var(--radius-sm); background: var(--accent-soft);
}
.cl-stat .cs-v { font-size: 17px; font-weight: 600; color: var(--accent-strong); }
.cl-stat .cs-k { font-size: var(--fs-micro); color: var(--muted); }
.cl-list { display: flex; flex-direction: column; }
.cl-row {
  display: flex; align-items: center; gap: var(--s3);
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.cl-row:last-child { border-bottom: none; }
.cl-row .cl-body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.cl-row .cl-t { font-size: var(--fs-body); }
.cl-row .cl-s { font-size: var(--fs-micro); color: var(--muted); }
.cl-row.fail .cl-s { color: var(--rose); }
.cl-row .cl-time { font-size: var(--fs-micro); color: var(--muted); white-space: nowrap; }

/* 通话小窗(悬浮球):收起时浮在整机之上,可拖动。
   一律 absolute —— 祖先链上有 zoom/缩放时 position:fixed 会丢掉坐标系。 */
.call-mini-host { position: absolute; inset: 0; z-index: 95; pointer-events: none; }
.call-mini {
  position: absolute; right: 14px; top: 64px;
  display: flex; align-items: center; gap: 8px;
  height: 38px; padding: 0 6px 0 12px; border-radius: var(--radius-pill);
  background: linear-gradient(150deg, var(--call-1), var(--call-3));
  color: white; border: none; font: inherit;
  box-shadow: 0 10px 24px -10px rgba(9, 18, 31, .7), inset 0 0 0 1px rgba(255, 255, 255, .12);
  pointer-events: auto; cursor: grab;
