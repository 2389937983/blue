  touch-action: none; user-select: none; -webkit-user-select: none;
}
.call-mini[hidden] { display: none; }
.call-mini.is-drag { cursor: grabbing; box-shadow: 0 16px 30px -10px rgba(9, 18, 31, .8), inset 0 0 0 1px rgba(255, 255, 255, .2); }
.cm-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--jade); animation: cmPulse 1.4s ease-in-out infinite; }
@keyframes cmPulse { 0%, 100% { opacity: 1; } 50% { opacity: .28; } }
.cm-txt { font-size: var(--fs-micro); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cm-btn {
  height: 26px; min-width: 26px; padding: 0 9px; border-radius: var(--radius-pill); border: none;
  background: rgba(255, 255, 255, .18); color: white; font: inherit; font-size: var(--fs-micro);
  display: grid; place-items: center;
}
.cm-btn svg { width: 13px; height: 13px; }
.cm-btn.cm-end { background: var(--rose); padding: 0; width: 26px; }
.cm-btn:active { transform: scale(.92); }

/* ══════════════════════════════════════════════════════════════════════════
   16 · TOASTS
   ══════════════════════════════════════════════════════════════════════════ */
.toast-layer {
  position: absolute; z-index: 90;
  left: 0; right: 0; bottom: calc(var(--phone-safe-bottom) + 64px);
  display: flex; flex-direction: column; align-items: center; gap: var(--s2);
  padding: 0 var(--s5);
  pointer-events: none;
}
.toast {
  max-width: 100%;
  display: flex; align-items: center; gap: var(--s2);
  padding: 10px 15px;
  border-radius: var(--radius-pill);
  background: color-mix(in oklch, var(--fg) 88%, transparent);
  backdrop-filter: blur(12px);
  color: white;
  font-size: var(--fs-sub); font-weight: 500;
  box-shadow: var(--shadow-lift);
  animation: toastIn 220ms var(--ease) both;
}
.toast.out { animation: toastOut 200ms var(--ease) both; }
.toast svg { width: 16px; height: 16px; flex: none; }
@keyframes toastIn  { from { opacity: 0; transform: translateY(12px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-6px); } }

/* ══════════════════════════════════════════════════════════════════════════
   17 · SCENES · SHEETS · TAROT FACE
   Scenery is painted from tokens in CSS. It is decorative artwork, never a
   stand-in for a photograph — every scene carries a visible label saying so.
   ══════════════════════════════════════════════════════════════════════════ */
.scene {
  position: relative; overflow: hidden;
  background: linear-gradient(172deg, var(--sky-1) 0%, var(--sky-2) 58%, var(--sky-3) 100%);
}
.scene::after { content: ""; position: absolute; inset: 0; pointer-events: none; }
.scene[data-scene="cloud"]::after {
  background:
    radial-gradient(ellipse 46% 22% at 24% 40%, rgba(255,255,255,.9), transparent 72%),
    radial-gradient(ellipse 32% 17% at 62% 28%, rgba(255,255,255,.76), transparent 72%),
    radial-gradient(ellipse 40% 20% at 78% 58%, rgba(255,255,255,.62), transparent 72%);
}
.scene[data-scene="dusk"] { background: linear-gradient(172deg, color-mix(in oklch, var(--gold) 52%, white) 0%, var(--rose) 62%, var(--deck-1) 100%); }
.scene[data-scene="dusk"]::after { background: radial-gradient(circle at 28% 72%, color-mix(in oklch, var(--sky-sun) 78%, transparent), transparent 42%); }
.scene[data-scene="night"] { background: linear-gradient(172deg, var(--deck-1) 0%, var(--deck-2) 52%, var(--deck-3) 100%); }
.scene[data-scene="night"]::after { background: radial-gradient(circle at 74% 20%, color-mix(in oklch, white 66%, transparent), transparent 24%); }
.scene[data-scene="leaf"] { background: linear-gradient(172deg, color-mix(in oklch, var(--jade) 30%, white) 0%, color-mix(in oklch, var(--jade) 72%, black) 100%); }
.scene[data-scene="leaf"]::after {
  background:
    radial-gradient(ellipse 26% 30% at 30% 60%, color-mix(in oklch, var(--jade) 40%, transparent), transparent 70%),
    radial-gradient(ellipse 22% 26% at 68% 36%, color-mix(in oklch, var(--jade) 34%, transparent), transparent 70%);
}
.scene-tag {
  position: absolute; left: var(--s3); bottom: var(--s3); z-index: 1;
  padding: 3px 9px; border-radius: var(--radius-pill);
  background: rgba(12, 28, 48, .46);
  backdrop-filter: blur(8px);
  color: white; font-size: 11px; font-weight: 500; letter-spacing: .02em;
}
/* bottom sheets — anchored inside the handset, so no viewport maths is needed */
.sheet-layer { position: absolute; inset: 0; z-index: 80; display: none; }
.sheet-layer.on { display: block; }
.sheet-scrim { position: absolute; inset: 0; background: var(--scrim); animation: scrimIn 200ms var(--ease) both; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0;
  max-height: 86%; overflow-y: auto; overscroll-behavior: contain;
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  background: var(--surface);
  padding: var(--s3) var(--s4) calc(var(--phone-safe-bottom) + var(--s5));
  box-shadow: 0 -14px 44px -14px rgba(20, 48, 79, .46);
  animation: sheetUp 280ms var(--ease) both;
}
.sheet-grab { width: 38px; height: 4px; border-radius: var(--radius-pill); background: var(--border); margin: 0 auto var(--s4); }
.sheet-title { font-size: var(--fs-h); font-weight: 600; margin-bottom: var(--s4); }
.sheet-foot { display: flex; gap: var(--s2); margin-top: var(--s5); }
.sheet-foot .btn { flex: 1; }
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
@keyframes scrimIn { from { opacity: 0; } to { opacity: 1; } }

/* tarot card face — typographic, drawn from the card's own name */
.tarot-face { display: grid; place-items: center; gap: 4px; text-align: center; padding: 2px; width: 100%; }
.tarot-face > * { max-width: 100%; }          /* 三张牌阵每张只有 ~88px,长牌名宁可折行也不许溢出 */
.tarot-face .tf-name { overflow-wrap: anywhere; }
.tarot-face .tf-no { font-family: var(--font-mono); font-size: 9px; letter-spacing: .2em; color: var(--muted); }
.tarot-face .tf-name { font-family: var(--font-serif); font-size: 19px; font-weight: 600; line-height: 1.12; color: var(--fg); }
.tarot-face .tf-rule { width: 20px; height: 1px; background: var(--border); }
.tarot-face.rev { transform: rotate(180deg); }

/* search field with a leading mark */
.search-field { position: relative; }
.search-field > svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--muted); pointer-events: none; }
.search-field .input { padding-left: 40px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: var(--radius-pill);
  background: var(--accent-faint); color: var(--accent-strong);
  font-size: var(--fs-micro); font-weight: 600;
}
.stack-2 { display: flex; flex-direction: column; gap: var(--s3); }
.stack-2 > * { margin: 0; }
.inline-note { font-size: var(--fs-meta); color: var(--muted); line-height: 1.6; }

/* ══════════════════════════════════════════════════════════════════════════
   17b · MODULE COMPLETIONS
   Additions the module markup needs. Each rule is scoped to one component and
   every value still resolves through the six tokens above.
   ══════════════════════════════════════════════════════════════════════════ */
.screen.home { padding: 0; }
.home-inner { padding-bottom: var(--s6); }

/* scenery placed inside a module frame adopts that frame's ratio */
.moment .photo .scene { aspect-ratio: 4 / 3; }
.album .scene { position: absolute; inset: 0; }
.album { position: relative; }
.album .scene-tag { left: var(--s3); bottom: var(--s3); }

/* selectable recipient / filter chip — full state pair, contrast rises on hover */
.chip-pick {
  display: inline-flex; align-items: center; gap: 5px;
  min-height: 36px; padding: 0 13px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  font-size: var(--fs-sub); font-weight: 500;
  transition: background 160ms var(--ease), color 160ms var(--ease), border-color 160ms var(--ease);
}
.chip-pick:hover { border-color: var(--accent); color: var(--accent-strong); background: var(--accent-faint); }
.chip-pick[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: white; }
.chip-pick[aria-pressed="true"]:hover { background: var(--accent-strong); border-color: var(--accent-strong); color: white; }
.recipient-wrap { display: flex; flex-wrap: wrap; gap: var(--s2); }

/* inline form feedback — never a native dialog */
.form-msg { font-size: var(--fs-meta); margin-top: var(--s2); }
.form-msg.err { color: color-mix(in oklch, var(--rose) 78%, black); }
.form-msg.ok  { color: color-mix(in oklch, var(--jade) 76%, black); }

/* scrolling pick-lists inside sheets */
.pick-list { max-height: 248px; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
.pick-list::-webkit-scrollbar { display: none; }

.sticker.face svg { width: 38px; height: 38px; }

/* ══════════════════════════════════════════════════════════════════════════
   17c · CONTRAST CORRECTIONS
   White ink only ever sits on a fill that measures ≥4.5:1 against it. Measured
   against white, var(--accent) lands at 3.7:1, so every solid control carrying
   white text uses its deepened form instead of the base accent.
   ══════════════════════════════════════════════════════════════════════════ */
:root { --rose-deep: color-mix(in oklch, var(--rose) 82%, black); }

.btn-primary, .composer .send, .fab, .transport .tplay { background: var(--accent-strong); }
.btn-primary:hover, .composer .send:hover, .fab:hover, .transport .tplay:hover {
  background: color-mix(in oklch, var(--accent) 68%, black);
}
/* my bubble already carries its own sky gradient from section 7 — the only
   thing this block adds is the deepened stamp ink inside it */
.msg.me .bubble-meta { color: color-mix(in oklch, white 82%, transparent); }
.chip-pick[aria-pressed="true"] { background: var(--accent-strong); border-color: var(--accent-strong); }
.chip-pick[aria-pressed="true"]:hover {
  background: color-mix(in oklch, var(--accent) 68%, black);
  border-color: color-mix(in oklch, var(--accent) 68%, black);
}
.q-opt[aria-checked="true"], .q-opt[aria-checked="true"] .box { border-color: var(--accent-strong); }
.q-opt[aria-checked="true"] .box { background: var(--accent-strong); }
.unread-pill, .hero-widget .hw-count, .app-icon .badge { background: var(--rose-deep); }
.progress-fill, .seek i { background: var(--accent-strong); }

.envelope .from { opacity: 1; }
.scene-tag { background: rgba(12, 28, 48, .62); }

/* The wallpaper's upper stops are pale, so the clock, the app labels and the
   status bar keep ink there; only the call veil flips them to white. */
.status-bar.on-veil { color: white; }
.home-top, .app-icon, .app-icon .label { color: var(--fg); }
.app-icon .label { text-shadow: 0 1px 0 color-mix(in oklch, white 55%, transparent); }

/* ══════════════════════════════════════════════════════════════════════════
   18 · RESPONSIVE + REDUCED MOTION
   ══════════════════════════════════════════════════════════════════════════ */
@media (max-height: 927px) { .phone-frame { zoom: .9; } }
@media (max-height: 840px) { .phone-frame { zoom: .82; } }
@media (max-height: 771px) { .phone-frame { zoom: .74; } }
@media (max-height: 702px) { .phone-frame { zoom: .66; } }
@media (max-width: 480px) {
  body { padding: 0; display: block; }
  .phone-frame {
    width: 100%; height: 100dvh; padding: 0;
    border-radius: 0; background: none; box-shadow: none; zoom: 1;
  }
  .hardware-button { display: none; }
  .phone-screen { width: 100%; height: 100%; border-radius: 0; }
  .screen[data-layer="app"] { border-radius: 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
  .screen[data-layer="app"].is-entering,
  .screen[data-layer="app"].is-leaving { animation: none; }
  .card3d { transition: none; }
}
/* ══════════════════════════════════════════════════════════════════════════
   19 · CHASSIS — the card library, the settings desk, and the few pieces the
   messages needed once they became real. Everything here is scoped either to
   a new screen or to a new message kind, so the visual language the rest of
   the app already speaks (soft blue sheets, quiet dashed borders, 18px
   radius) carries over without a second dialect.
   ══════════════════════════════════════════════════════════════════════════ */
/* twelve tiles no longer fit a fixed column, so the wallpaper scrolls */
.home-inner { overflow-y: auto; scrollbar-width: none; }
.home-inner::-webkit-scrollbar { display: none; }

/* ── message kinds ─────────────────────────────────────────────────────── */
.sys-row { justify-content: center; }
.sys-line {
  max-width: 84%; margin: 0 auto; padding: 4px 12px;
  border-radius: var(--radius-pill);
  background: color-mix(in oklch, var(--fg) 7%, white);
  color: var(--muted); font-size: var(--fs-micro); text-align: center;
}
.bubble.typing { display: inline-flex; align-items: center; gap: 4px; padding: 13px 14px; }
.bubble.typing span {
  width: 5px; height: 5px; border-radius: 50%;
  background: color-mix(in oklch, var(--muted) 66%, white);
  animation: dotPulse 1.1s var(--ease) infinite;
}
.bubble.typing span:nth-child(2) { animation-delay: .16s; }
.bubble.typing span:nth-child(3) { animation-delay: .32s; }
@keyframes dotPulse {
  0%, 60%, 100% { opacity: .34; transform: translateY(0); }
  30%           { opacity: 1;   transform: translateY(-2px); }
}
.card-tag {
  display: inline-flex; align-items: center; gap: 4px;
  margin-bottom: 3px; font-size: 10px; letter-spacing: .06em;
  color: color-mix(in oklch, var(--muted) 88%, var(--fg));
}
.card-tag svg { width: 11px; height: 11px; color: color-mix(in oklch, var(--accent) 72%, var(--muted)); }
.bubble-read.pending { opacity: .72; }

/* the wallpaper fills the reading area, never the whole handset */
.thread { min-height: 100%; }
.thread.has-wall {
  background-position: center; background-size: cover; background-repeat: no-repeat;
}

/* the phone keyboard is an overlay — the composer steps up out of its way */
.composer { padding-bottom: calc(var(--phone-safe-bottom) + var(--s2) + var(--kb, 0px)); }
.nav-av { touch-action: manipulation; -webkit-user-select: none; user-select: none; }

/* ── shared bits the new screens reuse ─────────────────────────────────── */
/* an svg with no width of its own falls back to 300px, which is how a 16px
   chevron ends up 172px wide and eats the whole row — every icon that sits
   inside a new component is measured here rather than trusting the default */
.chip-row { display: flex; flex-wrap: wrap; gap: var(--s2); }
.chip-row > * { flex: none; }
.chip-pick svg, .btn svg, .chip svg, .setting-row svg { width: 14px; height: 14px; flex: none; }
.lib-head .chev {
  width: 16px; height: 16px; flex: none;
  color: var(--muted);
  transition: transform 160ms var(--ease);
}
.chip-pick.on { background: var(--accent); border-color: var(--accent); color: white; }
.chip-pick.danger { color: color-mix(in oklch, var(--rose) 78%, black); border-color: color-mix(in oklch, var(--rose) 30%, white); }
.btn-primary.danger { background: color-mix(in oklch, var(--rose) 86%, black); }
.icon-btn {
  width: 32px; height: 32px; flex: none;
  display: grid; place-items: center; border-radius: 50%;
  color: var(--muted);
  transition: background 160ms var(--ease), color 160ms var(--ease);
}
.icon-btn svg { width: 16px; height: 16px; }
.icon-btn:hover { background: var(--accent-faint); color: var(--accent-strong); }
.icon-btn.danger { color: color-mix(in oklch, var(--rose) 66%, var(--muted)); }
.icon-btn.danger:hover { background: color-mix(in oklch, var(--rose) 12%, white); color: color-mix(in oklch, var(--rose) 84%, black); }
.row-tools { flex: none; display: flex; align-items: center; gap: 6px; margin-left: 8px; }
.edit-av-row { display: flex; align-items: center; gap: var(--s4); margin-bottom: var(--s4); }
.row-add { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--accent-faint); color: var(--accent-strong); }
.row-add svg { width: 20px; height: 20px; }
.sheet-msg { white-space: pre-wrap; font-size: var(--fs-sub); line-height: 1.65; color: var(--fg); margin-bottom: var(--s2); }
.sheet .field { margin-bottom: var(--s1); }
.sheet .chip-row { margin-top: 2px; }

/* ── the card library ──────────────────────────────────────────────────── */
.lib-group { padding: var(--s3) var(--s3) var(--s3) var(--s4); }
.lib-group.is-hidden { opacity: .6; }
.lib-head { display: flex; align-items: center; gap: var(--s2); }
.lib-toggle {
  flex: 1; min-width: 0; min-height: 34px;
  display: flex; align-items: center; gap: var(--s2);
  text-align: left; color: var(--fg);
}
.lib-name { font-weight: 600; font-size: var(--fs-body); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lib-count { font-size: var(--fs-micro); color: var(--muted); }
.lib-tools { display: flex; align-items: center; gap: 2px; flex: none; }
.chev.down { transform: rotate(90deg); }
.lib-items { margin-top: var(--s2); border-top: 1px dashed var(--border); }
.lib-item {
  display: flex; align-items: center; gap: var(--s2);
  padding: 8px 0 8px var(--s1);
  border-bottom: 1px dashed color-mix(in oklch, var(--border) 70%, transparent);
}
.lib-item:last-child { border-bottom: none; }
.lib-text { flex: 1; min-width: 0; font-size: var(--fs-sub); line-height: 1.55; color: var(--fg); overflow-wrap: anywhere; }
.lib-group .empty-note { padding: var(--s4) 0; }
.poke-chip { background: color-mix(in oklch, var(--accent) 8%, white); }
.chip-x { display: grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; color: var(--muted); }
.chip-x svg { width: 11px; height: 11px; }
.chip-x:hover { background: color-mix(in oklch, var(--fg) 10%, white); color: var(--fg); }

/* ── the settings desk ─────────────────────────────────────────────────── */
.setting-row { display: flex; align-items: center; gap: var(--s3); min-height: 44px; }
.setting-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.setting-label { font-size: var(--fs-sub); font-weight: 600; }
.setting-hint { font-size: var(--fs-micro); color: var(--muted); }
.setting-num { width: 92px; flex: none; text-align: center; }
.setting-text { width: 168px; flex: none; }
.switch {
  width: 46px; height: 27px; flex: none; padding: 3px;
  display: flex; border-radius: var(--radius-pill);
  background: color-mix(in oklch, var(--fg) 12%, white);
  transition: background 180ms var(--ease);
}
.switch span {
  width: 21px; height: 21px; border-radius: 50%;
  background: white; box-shadow: 0 1px 3px rgba(20, 48, 79, .28);
  transition: transform 180ms var(--ease);
}
.switch.on { background: var(--accent); }
.switch.on span { transform: translateX(19px); }
.wall-strip {
  height: 96px; padding: var(--s3);
  display: grid; place-items: center; text-align: center;
  border: 1px dashed var(--border); border-radius: var(--radius-sm);
  background: color-mix(in oklch, var(--bg) 70%, white) center / cover no-repeat;
}
.wall-strip.has { border-style: solid; }
</style>
</head>

/* ── 第12单 · 问卷 ────────────────────────────────────────────────────────

function normQz(raw) {

      .filter(Boolean);

/* TA 的答案:返回**选项下标**(全流程统一用下标,别混用文案)。
   标准答案是 '' 时 = 随机,每次均匀摇一个;否则多数照标准答案、偶尔随机 ——

/* ── 第10单 · 语音通话(模拟) ────────────────────────────────────────────
   呼出四结局由「忙线 / 拒接 / 接听」三概率判定(先命中者生效),三者之外的余量
   算「无人接听」;接通后 TA 按挂断概率中途挂断,接通前 10 秒保护期内不挂。
   记录与统计都落在 CALL_LOG(每次结束一条死档);**进行中的那一通只在
   state.call(运行期)**,刷新即散 —— 免得存档里留下一个永远挂不掉的僵尸会话。
   TA 主动来电不自己 setInterval,挂在调度中心的 call 任务上(和发消息/写信同规格)。 */
var CALL_LOG = [];                  /* 通话记录,最新在最前 */
var CALL_LABEL = {
  answered: '已接通', busy: '对方忙线', rejected: '已拒接',
  noanswer: '无人接听', missed: '未接来电',
  taHangup: 'TA 已挂断', meHangup: '已挂断'
};
/* 呼出结局的落地时间(ms):忙线几乎立刻 / 拒接 2.4s / 无人接听 7s 超时 / 接通前先响 2.2s */
var CALL_RING_MS = { busy: 1400, rejected: 2400, noanswer: 7000, answered: 2200 };
var CALL_PROTECT_SEC = 10;                   /* 接通前 10 秒保护期:此间绝不中途挂断 */
var CALL_BASE_W = 390, CALL_BASE_H = 844;    /* .viewport 的基准排版尺寸,通话小窗坐标按它换算 */
var CALL_DEF = {                             /* 通话参数(设置页可改) */
  sim: true,        /* 模拟通话总开关:关掉后呼出必定接通,不再掷结局 */
  busyP: 12,        /* 忙线概率 % */
  declineP: 13,     /* 拒接概率 % */
  answerP: 65,      /* 接听概率 %;三者之外的余量 = 无人接听(默认 10%) */
  hangupOn: true,   /* 中途挂断开关 */
  hangupP: 2,       /* 每个检查点的挂断概率 %(不是整场一次) */
  hgSec: 30,        /* 挂断检查间隔(秒) */
  ringSec: 30       /* 来电未接超时(秒)→ 漏接记录 */
};

/* 概率一律夹在 0~100,坏值退回默认 —— 不让 NaN 混进判定里 */
function pctIn(raw, key, dflt) {
  var v = parseFloat(raw && raw[key]);
  if (!isFinite(v)) return dflt;
  return Math.min(100, Math.max(0, v));
}
function normCall(raw) {
  var o = (raw && typeof raw === 'object') ? raw : {};
  return {
    sim: boolOf(o.sim, CALL_DEF.sim),
    busyP: pctIn(o, 'busyP', CALL_DEF.busyP),
    declineP: pctIn(o, 'declineP', CALL_DEF.declineP),
    answerP: pctIn(o, 'answerP', CALL_DEF.answerP),
    hangupOn: boolOf(o.hangupOn, CALL_DEF.hangupOn),
    hangupP: pctIn(o, 'hangupP', CALL_DEF.hangupP),
    hgSec: numIn(o, 'hgSec', 5, 600, CALL_DEF.hgSec),
    ringSec: numIn(o, 'ringSec', 5, 300, CALL_DEF.ringSec)
  };
}
function callSet() { return S.settings.call || (S.settings.call = normCall(null)); }

var CALL_OUTCOMES = ['answered', 'busy', 'rejected', 'noanswer', 'missed', 'taHangup', 'meHangup'];
function normCallRec(raw) {
  if (!raw || typeof raw !== 'object') return null;
  var oc = CALL_OUTCOMES.indexOf(raw.outcome) >= 0 ? raw.outcome : 'meHangup';
  var ts = numIn(raw, 'ts', 0, 1e15, 0);
  return {
    id: typeof raw.id === 'string' && raw.id ? raw.id : uid('cl'),
    cid: String(raw.cid || ''),
    dir: raw.dir === 'in' ? 'in' : 'out',
    outcome: oc,
    sec: Math.max(0, Math.round(numIn(raw, 'sec', 0, 86400, 0))),
    ts: ts,
    day: String(raw.day || (ts ? dayKey(new Date(ts)) : '')),
    time: String(raw.time || '')
  };
}
function normCalls(raw) {
  if (!Array.isArray(raw)) return [];
  return raw.map(normCallRec).filter(Boolean).slice(0, 200);
}
/* 年月键:把 dayKey() 的「不补零」日期(2026-9-14)归一成可比的 2026-9。
   别拿 pad2 拼出来的前缀去 indexOf —— 1~9 月永远匹配不上(2026-9-14 里不含
   "2026-09"),「本月」会恒为 0;今天正好是 9 月,这个坑是验收时才显形的。
   两边都解析成年+月再比,补零/不补零的存档都吃得下。 */
function ymKey(v) {
  var m = /^(\d{1,4})-(\d{1,2})/.exec(String(v || ''));
  return m ? ((+m[1]) + '-' + (+m[2])) : '';
}

/* 通话统计:本月的次数/时长/接通/未接(跨月自然清零),外加累计条数 */
function callStats() {
  var pre = ymKey(dayKey(new Date()));
  var o = { n: 0, sec: 0, answered: 0, missed: 0, total: CALL_LOG.length };
  CALL_LOG.forEach(function (r) {
    if (ymKey(r.day) !== pre) return;
    o.n++;
    o.sec += r.sec || 0;
    if (r.outcome === 'answered' || r.outcome === 'taHangup' || r.outcome === 'meHangup') o.answered++;
    if (r.outcome === 'missed' || r.outcome === 'noanswer') o.missed++;
  });
  return o;
}
/* 时长短于 1 分钟也把秒说出来,别让人看到「0 分钟」这种糊弄人的读数 */
function callDurText(sec) {
  sec = Math.max(0, Math.round(sec || 0));
  if (sec < 60) return sec + ' 秒';
  return Math.floor(sec / 60) + ' 分' + (sec % 60 ? ' ' + (sec % 60) + ' 秒' : '');
}
function callClock(sec) {
  sec = Math.max(0, Math.floor(sec || 0));
  return pad2(Math.floor(sec / 60)) + ':' + pad2(sec % 60);
}
/* 通话小窗的位置记忆(局部坐标,与窗口缩放无关);缺省没记过就是 null */
function normMiniPos(raw) {
  var o = (raw && typeof raw === 'object') ? raw : {};
  var x = parseFloat(o.x), y = parseFloat(o.y);
  return { x: isFinite(x) ? Math.max(0, Math.round(x)) : null,
           y: isFinite(y) ? Math.max(0, Math.round(y)) : null };
}

/* ── 第7单 · 红包 ────────────────────────────────────────────────────────
   红包=聊天流里的一条消息(type:'packet'),所以钱包与流水都按 cid 挂在会话上,
   不另起一份会跟消息对不上的存储。WALLET[cid] = { mine, ta } 是双方红包袋余额。 */
var RP_QUICK = [5.2, 13.14, 52, 520];          /* 快捷金额 */
var RP_SPECIAL = [52, 520, 1314, 5200];        /* TA 自动发时的特殊金额 */
var RP_WISHES = ['一点心意', '给你买杯奶茶', '随便花', '祝你开心', '小小的惊喜', '今天也要顺利'];
var RP_DEFAULT_BAL = 520;                       /* 初始红包袋 */
var WALLET = {};

function walletOf(cid) {
  var w = WALLET[cid];
  if (!w || typeof w !== 'object') { w = WALLET[cid] = { mine: RP_DEFAULT_BAL, ta: RP_DEFAULT_BAL }; }
  if (typeof w.mine !== 'number' || !isFinite(w.mine)) w.mine = RP_DEFAULT_BAL;
  if (typeof w.ta !== 'number' || !isFinite(w.ta)) w.ta = RP_DEFAULT_BAL;
  return w;
}

function normWallet(raw) {
  var out = {};
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return out;
  Object.keys(raw).forEach(function (cid) {
    var w = raw[cid];
    if (!w || typeof w !== 'object') return;
    var mine = Number(w.mine), ta = Number(w.ta);
    out[String(cid)] = {
      mine: isFinite(mine) && mine >= 0 ? Math.round(mine * 100) / 100 : RP_DEFAULT_BAL,
      ta: isFinite(ta) && ta >= 0 ? Math.round(ta * 100) / 100 : RP_DEFAULT_BAL
    };
  });
  return out;
}

function normPk(pk) {
  if (!pk || typeof pk !== 'object') return null;
  var amount = Number(pk.amount);
  return {
    id: String(pk.id || uid('pk')),
    amount: isFinite(amount) && amount > 0 ? Math.round(amount * 100) / 100 : 0,
    wish: String(pk.wish || '').slice(0, 30),
    state: (pk.state === 'opened' || pk.state === 'refunded') ? pk.state : 'idle'
  };
}

/* 在某个联系人会话里按 id 找一条红包消息 */
function findPk(cid, pkid) {
  var c = chatOf(cid);
  if (!c) return null;
  for (var i = 0; i < c.msgs.length; i++) {
    var m = c.msgs[i];
    if (m.type === 'packet' && m.pk && m.pk.id === pkid) return m;
  }
  return null;
}

/* 流水:直接从红包消息派生,永远和聊天流里的状态一致(最近 20 条) */
function rpRecords(cid) {
  var c = chatOf(cid);
  if (!c) return [];
  var out = [];
  for (var i = c.msgs.length - 1; i >= 0 && out.length < 20; i--) {
    var m = c.msgs[i];
    if (m.type === 'packet' && m.pk) {
      out.push({ me: !!m.me, amount: m.pk.amount, wish: m.pk.wish, state: m.pk.state, time: m.time });
    }
  }
  return out;
}

function rpCounts(cid) {
  var c = chatOf(cid), got = 0, sent = 0, unopened = 0;
  if (c) c.msgs.forEach(function (m) {
    if (m.type !== 'packet' || !m.pk) return;
    if (m.me) { sent++; }
    else { got++; if (m.pk.state === 'idle') unopened++; }
  });
  return { got: got, sent: sent, unopened: unopened };
}

/* 发一个红包:fromMe=true 时扣我的袋,否则扣 TA 的袋;返回那条消息(失败返回 null) */
function sendPacket(cid, amount, wish, fromMe) {
  amount = Math.round(Number(amount) * 100) / 100;
  if (!isFinite(amount) || amount <= 0) return null;
  var w = walletOf(cid);
  if (fromMe) {
    if (w.mine < amount) return null;
    w.mine = Math.round((w.mine - amount) * 100) / 100;
  } else {
    if (w.ta < amount) return null;
    w.ta = Math.round((w.ta - amount) * 100) / 100;
  }
  var c = chatOf(cid);
  if (!c) return null;
  var m = {
    me: fromMe, who: fromMe ? 'me' : cid, type: 'packet', text: '',
    time: nowTime(),
    pk: { id: uid('pk'), amount: amount, wish: wish || '', state: 'idle' }
  };
  c.msgs.push(m);
  c.time = '刚刚';
  if (!fromMe) { if (inThread(cid)) c.unread = 0; else c.unread++; }
  return m;
}

function taPacketAmount() {
  if (Math.random() < 0.08) return pick(RP_SPECIAL);
  return pick([5.2, 6.66, 8.88, 13.14, 20, 52]);
}

/* ── 第12单 · 聊天里的问卷 ──────────────────────────────────────────────
   和红包同构:一张邀请卡就是一条消息(type:'quiz'),答完就地改成结果卡。
   所以「已答完不可重复提交」不用另存标记 —— 消息自己就是那份状态。 */
function findQz(cid, qzId) {
  var c = chatOf(cid);
  if (!c) return null;
  for (var i = 0; i < c.msgs.length; i++) {
    var m = c.msgs[i];
    if (m.type === 'quiz' && m.qz && m.qz.id === qzId) return m;
  }
  return null;
}

function sendQuiz(cid, qid) {
  var q = quizById(qid);
  var c = chatOf(cid);
  if (!q || !c) return null;
  var m = {
    me: true, who: 'me', type: 'quiz', text: '', time: nowTime(),
    qz: { id: uid('qm'), qid: q.id, state: 'idle', runId: '', pct: 0 }
  };
  c.msgs.push(m);
  c.time = '刚刚';
  save();
  return m;
}

/* 答完就在原地把邀请卡改成结果卡 */
function qzMarkDone(cid, qzId, run) {
  var m = findQz(cid, qzId);
  if (!m || !m.qz) return false;
  m.qz.state = 'done';
  m.qz.runId = run.id;
  m.qz.pct = run.pct;
  return true;
}

/* 邀请卡:未答可点进作答;答完显示默契度,点进逐题对照。
   注意别和列表页那张 qzCardHTML 同名 —— 同名声明后写的会覆盖前面那个。 */
function qzMsgHTML(m) {
  var qz = m.qz;
  var q = quizById(qz.qid);
  var name = q ? q.name : (qz.name || '问卷');
  var total = q ? q.qs.length : 0;
  var done = qz.state === 'done';
  return '<button class="qz-msg' + (done ? ' is-done' : '') + '" ' +
    'data-act="' + (done ? 'qz-see' : 'qz-tap') + '" ' +
    'data-id="' + esc(done ? qz.runId : qz.id) + '" data-od-id="qz-msg-' + qz.id + '">' +
    '<span class="qzm-ic">' + ic('quiz') + '</span>' +
    '<span class="qzm-body">' +
      '<span class="qzm-t">' + esc(name) + '</span>' +
      '<span class="qzm-s">' + (done
        ? '已答完 · 看逐题对照'
        : (total ? total + ' 道题 · 点开作答' : '点开作答')) + '</span>' +
    '</span>' +
    (done
      ? '<span class="qzm-pct num">' + qz.pct + '<small>%</small></span>'
      : '<span class="qzm-go">' + ic('fwd') + '</span>') +

}

function openQuizPick(cid) {
  if (!QUIZZES.length) { toast('还没有问卷，先去问卷页新建一套', 'quiz'); return; }
  state.sheet = { kind: 'quiz-pick', cid: cid || activeQuizCid() };

}
function activeQuizCid() {

}

/* ── 第11单 · 一起听(音乐)数据 ─────────────────────────────────────────
   歌单是全站共用的一份(不按联系人隔离)。真正的音频节点不在这里,在
   #global-media-root 里——那个容器挂在 #viewport 之外,路由重绘碰不到它,
   所以从一起听切到聊天/设置,歌不会断。
   song = {id, type:'song', name, artist, pic, url}
   · id   网易云歌曲 id,取源与去重都靠它
   · pic  封面地址(网易云 CDN/metimg 返回的远程图,不是本地资产)
   · url  歌单展开时镜像一并给出的可播音源,播放时作为第一候选 */
var MUSIC = { songs: [], hist: [], mode: 'list' };

/* ==== MUSIC-PURE-BEGIN ==== */
/* 纯逻辑切片:不碰 DOM、不碰 localStorage、不读全局状态,全部参数显式传入。
   .verify/10-music-logic.mjs 直接从 index.html 里抽这一段到 node 里跑单测,
   所以这里改坏了判据会立刻红——不是测副本,是测真正发布的那份代码。 */

/* A 级「公共/免费/无鉴权」接口:必须 ≥3 个互为备份的镜像 + 最终降级。
   实测只有 api.injahow.cn 稳定;其余三个随镜像生态起落,留着做轮询兜底。 */
var METING_MIRRORS = [
  'https://api.injahow.cn/meting/',
  'https://api.i-meto.com/meting/api/',
  'https://meting.qijieya.cn/',
  'https://api.lixiaocong.com/meting/'
];

function musWithQuery(base, q) {
  return base + (base.indexOf('?') >= 0 ? '&' : '?') + q;
}

/* 《》或「」里的名字优先。网易云的分享文本也常写成
   「分享单曲 晴天 https://…」——名字在链接**前面**,也要认;
   只认《》会让这种分享文本整条落进「歌曲 数字」的兜底名里。 */
function musNameOf(txt, fallback) {
  var t = String(txt === null || txt === undefined ? '' : txt);
  var a = t.match(/《([^》]{1,40})》/);
  if (a) return a[1].trim();
  var b = t.match(/「([^」]{1,40})」/);
  if (b) return b[1].trim();
  var u = t.search(/https?:\/\//);
  if (u > 0) {
    var pre = t.slice(0, u).replace(/[：:、,，\s]+$/, '').trim();
    pre = pre.replace(/^分享/, '').replace(/^(单曲|歌曲|歌单|专辑|歌手)/, '')
             .replace(/^[：:、,，\s]+/, '').trim();
    if (pre) return pre.slice(0, 40);
  }
  return fallback;
}

/* 网易云分享文本/链接 → {id, type, name, artist};认不出来返回 null。
   顺序要紧:歌单链接里也带 id=,先判单曲会把整张歌单当成一首歌;
   专辑/歌手页必须单独认出来,才能给「只支持单曲」的提示。 */
function musParse(input) {
  var txt = String(input === null || input === undefined ? '' : input).trim();
  if (!txt) return null;

  var pl = txt.match(/playlist[?&#/]*id=(\d+)/) || txt.match(/\/playlist\/(\d+)/) || txt.match(/playlist=(\d+)/);
  if (pl) {
    return { id: String(pl[1]), type: 'playlist', name: musNameOf(txt, '歌单 ' + pl[1]), artist: '歌单' };
  }
  var al = txt.match(/album(?:[?&#/]*id=|[/=])(\d+)/i);
  if (al) return { id: String(al[1]), type: 'album', name: '', artist: '' };
  var ar = txt.match(/artist(?:[?&#/]*id=|[/=])(\d+)/i);
  if (ar) return { id: String(ar[1]), type: 'artist', name: '', artist: '' };

  /* m. 短链、/#/ 形式、outchain 播放器外链都落在 id= 上,一并收下 */
  var m = txt.match(/song\?id=(\d+)/) || txt.match(/\/song\/(\d+)/) ||
          txt.match(/outchain\/player\?[^\s]*[?&]id=(\d+)/) || txt.match(/[?&]id=(\d+)/);
  if (!m) return null;
  return { id: String(m[1]), type: 'song', name: musNameOf(txt, '歌曲 ' + m[1]), artist: '' };
}

/* 候选音源按序尝试:歌曲自带 url → 各镜像 type=url → outer/url 兜底。
   只认 outer/url 是踩过的坑:它对 VIP/版权受限的歌返回 Format error,
   表现成「歌能列出来、点播放全失败」,会被误判成「拿不到歌单」。 */
function musSrcCandidates(song, mirrors) {
  var id = String((song && song.id) || '').trim();
  var list = mirrors || METING_MIRRORS;
  var out = [];
  if (song && song.url) out.push(String(song.url));
  for (var i = 0; i < list.length; i++) {
    out.push(musWithQuery(list[i], 'server=netease&type=url&id=' + encodeURIComponent(id)));
  }
  out.push('https://music.163.com/song/media/outer/url?id=' + encodeURIComponent(id) + '.mp3');
  return out.filter(function (u, i, a) { return u && a.indexOf(u) === i; });
}

/* 一首自然播完之后,按当前模式给出「依次尝试」的候选队列。
   列表循环=当前曲之后的全部并绕回队首;随机循环=其余曲打乱;单曲循环=只候选当前曲。
   队列里必然带上当前曲做最后一手,所以「全部候选都失败」才等于真的没得播。 */
function musNextCandidates(list, curId, mode, rnd) {
  list = list || [];
  if (!list.length) return [];
  rnd = rnd || Math.random;
  var cur = null, idx = -1, i;
  for (i = 0; i < list.length; i++) {
    if (String(list[i].id) === String(curId)) { cur = list[i]; idx = i; }
  }
  if (mode === 'single') return [cur || list[0]];
  if (mode === 'random') {
    var rest = list.filter(function (x) { return String(x.id) !== String(curId); });
    for (var j = rest.length - 1; j > 0; j--) {
      var k = Math.floor(rnd() * (j + 1));
      var t = rest[j]; rest[j] = rest[k]; rest[k] = t;
    }
    if (cur) rest.push(cur);
    return rest;
  }
  if (idx < 0) idx = 0;
  var out = [];
  for (var q = 1; q <= list.length; q++) out.push(list[(idx + q) % list.length]);
  return out;
}

/* 镜像返回的曲目 → 本站曲目。字段名对齐是踩过的坑:
   MetingAPI 给的是 url_id 不是 id;injahow 的 playlist 甚至没有 id 字段,
   只能从 url 里的 id= 反解。漏一种,整张歌单的 id 就全是 undefined。 */
function musTrackOf(t) {
  if (!t || typeof t !== 'object') return null;
  var id = t.url_id || t.id || '';
  if (!id && t.url) {
    var m = String(t.url).match(/[?&]id=(\d+)/);
    if (m) id = m[1];
  }
  id = String(id === null || id === undefined ? '' : id).trim();
  if (!id || id === 'undefined' || id === 'null') return null;
  var artist = t.artist || t.author || '';
  if (artist && typeof artist === 'object') artist = artist.name || (artist[0] && artist[0].name) || '';
  return {
    id: id, type: 'song',
    name: String(t.name || t.title || ('歌曲 ' + id)).slice(0, 40),
    artist: String(artist || '').slice(0, 30),
    pic: String(t.pic || t.cover || ''),
    url: String(t.url || '')
  };
}

/* 存进本地/导出/导入都走这里:坏字段一律读平成安全形状,不抛不崩 */
function musNormSong(s) {
  if (!s || typeof s !== 'object') return null;
  var id = String(s.id === null || s.id === undefined ? '' : s.id).trim();
  if (!id || id === 'undefined' || id === 'null') return null;
  return {
    id: id, type: 'song',
    name: String(s.name || s.title || ('歌曲 ' + id)).slice(0, 40),
    artist: String(s.artist || '').slice(0, 30),
    pic: String(s.pic || ''),
    url: String(s.url || '')
  };
}

function musNormMusic(d) {
  var out = { songs: [], hist: [], mode: 'list' };
  if (!d || typeof d !== 'object') return out;
  if (Array.isArray(d.songs)) {
    d.songs.forEach(function (s) { var n = musNormSong(s); if (n) out.songs.push(n); });
  }
  if (Array.isArray(d.hist)) {
    d.hist.forEach(function (h) { var n = musNormSong(h); if (n) out.hist.push(n); });
    if (out.hist.length > 50) out.hist.length = 50;
  }
  if (d.mode === 'random' || d.mode === 'single' || d.mode === 'list') out.mode = d.mode;
  return out;
}

/* 同一首只会有一行:id 以字符串比较,数字 1 和字符串 '1' 算同一首 */
function musAddUnique(list, song) {
  var s = musNormSong(song);
  if (!s) return false;
  for (var i = 0; i < list.length; i++) if (String(list[i].id) === s.id) return false;
  list.push(s);
  return true;
}
/* ── 封面直链:把镜像的 90x90 代理还原成网易云 CDN 大图 ────────────────

    s += T.charAt((n1 >> 18) & 63) + T.charAt((n1 >> 12) & 63) + '==';

    var n2 = (bs[i] << 16) | (bs[i + 1] << 8);
    s += T.charAt((n2 >> 18) & 63) + T.charAt((n2 >> 12) & 63) + T.charAt((n2 >> 6) & 63) + '=';
  }
  return s;
}

/* 网易云封面 hash:picId 逐字符异或魔数 → md5 → base64 → '/' 换 '_'
   (保留 '=' 填充,这一步错了会 404) */
function musCoverHash(picId) {
  var magic = '3go8&$8*3*3h0k(2)2';
  var bs = [];
  for (var i = 0; i < picId.length; i++) {
    bs.push((picId.charCodeAt(i) ^ magic.charCodeAt(i % magic.length)) & 0xFF);
  }
  /* 两条替换缺一不可:'/' → '_' 且 '+' → '-'。
     只做前者时,199 个真实封面只有 135 个命中(67.8%),其余 64 个会在 CDN 上
     404 并退回 90px 兜底 —— 表现成「有的封面清晰、有的模糊」。
     这条规则我在最早的探针里测出来过,写实现时却漏掉了,教训。 */
  return musB64(musMd5Bytes(bs)).replace(/\//g, '_').replace(/\+/g, '-');
}

/* 把镜像代理的 pic 换成 CDN 大图;不是代理(或已经是直链)就原样返回。
   算不出来也原样返回 —— 宁可退回 90px 小图,也不要破图。 */
function musCdnPic(pic, size) {
  var u = String(pic === null || pic === undefined ? '' : pic);
  if (!u) return '';
  if (u.indexOf('music.126.net') >= 0) return u;          /* 本来就是直链 */
  var m = u.match(/[?&]id=(\d{6,})/);
  if (!m) return u;                                        /* 认不出 picId,别动 */
  var id = m[1];
  var px = size || 500;
  return 'https://p' + ((id.length % 3) + 1) + '.music.126.net/' +
    musCoverHash(id) + '/' + id + '.jpg?param=' + px + 'y' + px;
}

      daily: Math.max(0, Math.min(50, parseInt(r.daily, 10) || 0)),
      cool: numIn(r, 'cool', 0, 1440, 0),
      last: numIn(r, 'last', 0, 1e15, 0),
      next: numIn(r, 'next', 0, 1e15, 0),
      day: typeof r.day === 'string' ? r.day : '',
      count: Math.max(0, parseInt(r.count, 10) || 0)
    };
    var e = out.sched[name];
    if (e.max < e.min) { var t = e.max; e.max = e.min; e.min = t; }
  });
  /* 间隔默认值整体压到个位数(客户要求):老存档里还躺着**旧默认对**的话原样搬到新默认;
     手动改过的(min/max 不再等于旧默认)原样保留,不覆盖人的手调。 */
  var SCHED_PACE = {
    msg: [4, 9], moments: [8, 9], letters: [8, 9], music: [8, 9],
    call: [8, 9], packet: [8, 9], dailytarot: [8, 9]
  };
  var SCHED_PACE_OLD = {
    msg: [6, 16], moments: [20, 60], letters: [30, 90], music: [25, 70],
    call: [20, 90], packet: [120, 360], dailytarot: [60, 180]
  };
  Object.keys(SCHED_PACE).forEach(function (name) {
    var e = out.sched[name];
    if (!e) return;
    var od = SCHED_PACE_OLD[name];
    if (e.min === od[0] && e.max === od[1]) { e.min = SCHED_PACE[name][0]; e.max = SCHED_PACE[name][1]; }
  });
  /* 老存档里主动消息是「proactive:true + proMin/proMax」,迁到调度中心名下,别让人白配 */
  if (o.proactive !== undefined || o.proMin !== undefined) {
    var mm = out.sched.msg || { on: true, min: 4, max: 9, p: 0.5, daily: 0, cool: 0, last: 0, next: 0, day: '', count: 0 };
    if (o.proactive !== undefined) mm.on = !!o.proactive;
    if (o.proMin !== undefined) mm.min = numIn(o, 'proMin', 0.2, 1440, 6);
    if (o.proMax !== undefined) mm.max = numIn(o, 'proMax', 0.2, 2880, 16);
    if (mm.max < mm.min) { var sw = mm.max; mm.max = mm.min; mm.min = sw; }
    out.sched.msg = mm;
  }
  /* 每个联系人记的「面板所选 tab」:只收 cid→tabId 这种字符串键值对,
     其它形状(数组/对象/数字)一律当没记过,由 emojiTabOf 落回第一个 tab */
  var rawTabs = (o.emojiTabs && typeof o.emojiTabs === 'object' && !Array.isArray(o.emojiTabs)) ? o.emojiTabs : {};
  Object.keys(rawTabs).forEach(function (cid) {
    var v = rawTabs[cid];
    if (typeof v === 'string' && v) out.emojiTabs[cid] = v;
  });
  return out;
}

function normMoment(m) {
  if (!m || typeof m !== 'object') return null;
  var who = String(m.who || 'me');
  var st = stickerById(m.sticker && m.sticker.id);
  return {
    id: String(m.id || uid('m')),
    cid: String(m.cid || 'c1'),
    who: who,
    text: String(m.text === undefined || m.text === null ? '' : m.text).slice(0, 400),
    place: String(m.place || '').slice(0, 20),
    scene: (m.scene === 'cloud' || m.scene === 'dusk' || m.scene === 'night' || m.scene === 'leaf') ? m.scene : null,
    sceneLabel: String(m.sceneLabel || ''),
    sticker: st ? { kind: st.kind, id: st.id, label: st.label } : null,
    time: String(m.time || ''),
    likes: (Array.isArray(m.likes) ? m.likes : []).map(String),
    comments: (Array.isArray(m.comments) ? m.comments : []).map(function (c) {
      if (!c || typeof c !== 'object') return null;
      return { who: String(c.who || 'me'), text: String(c.text || '').slice(0, 120) };
    }).filter(Boolean),
    liked: !!m.liked,

  };
}

function normLetter(l) {
  if (!l || typeof l !== 'object') return null;
  var dir = l.dir === 'out' ? 'out' : 'in';
  /* 老存档用 from === 'me' 表示去信,这里一次性读平,以后只认 dir */
  if (l.dir === undefined && l.from !== undefined) dir = (l.from === 'me') ? 'out' : 'in';
  var cid = String(l.cid || (dir === 'out' ? (l.to || 'c1') : (l.from || 'c1')));

function normAi(a) {
  var b = defaultS().ai, o = (a && typeof a === 'object') ? a : {};

function replaceAll(arr, next) {
  arr.length = 0;
  next.forEach(function (x) { arr.push(x); });
}

function normMsg(m) {
  if (!m || typeof m !== 'object') return null;
  var T = m.type;
  var out = {
    me: !!m.me,
    sys: !!m.sys,
    who: m.who ? String(m.who) : '',
    type: (T === 'card' || T === 'sys' || T === 'song' || T === 'packet' || T === 'quiz' || T === 'sticker' || T === 'call' || T === 'tarot') ? T : 'text',
    text: String(m.text === undefined || m.text === null ? '' : m.text),
    time: String(m.time || ''),
    rd: !!m.rd,
    seen: !!m.seen
  };
  /* 歌卡和红包消息自带 payload,以前这里只留 text,重载后卡就空了 */
  if (m.song && typeof m.song === 'object') {
    out.song = { id: String(m.song.id || ''), name: String(m.song.name || ''), artist: String(m.song.artist || ''), pic: String(m.song.pic || '') };
  }
  if (m.pk && typeof m.pk === 'object') {
    var pk = normPk(m.pk);
    if (pk) out.pk = pk; else out.type = 'text';
  }
  /* 问卷邀请卡:payload 丢了就退回普通文本,不让聊天流出现一张点不动的空卡 */
  if (m.qz && typeof m.qz === 'object' && m.qz.qid) {
    out.qz = {
      id: String(m.qz.id || uid('qm')),
      qid: String(m.qz.qid),
      state: m.qz.state === 'done' ? 'done' : 'idle',
      runId: String(m.qz.runId || ''),
      pct: isFinite(Number(m.qz.pct)) ? Math.min(100, Math.max(0, Math.round(Number(m.qz.pct)))) : 0
    };
  } else if (out.type === 'quiz') {
    out.type = 'text';
  }
  /* 表情消息:payload 只在表情还在时才留着;表情被删了就退回文本,
     纯表情那条给个占位,免得聊天流里出现一个空气泡 */
  if (m.stk) {
    var stkId = String(m.stk);
    if (emojiById(stkId)) out.stk = stkId;
  }
  if (out.type === 'sticker' && !out.stk) {
    out.type = 'text';
    if (!out.text) out.text = '（表情）';
  }
  /* 通话卡:结局和时长必须跟着一起留下,不然刷新后卡片就变成空白了 */
  if (m.call && typeof m.call === 'object' && CALL_LABEL[m.call.outcome]) {
    var cs = Number(m.call.sec);
    out.call = {
      dir: m.call.dir === 'in' ? 'in' : 'out',
      outcome: m.call.outcome,
      sec: Math.max(0, Math.round(isFinite(cs) ? cs : 0))
    };
  } else if (out.type === 'call') {
    out.type = 'text';
    if (!out.text) out.text = '（通话）';
  }
  /* 每日一牌卡:牌名/方位/解读都得跟着留下,刷新后不能变成一张空白卡 */
  if (m.tr && typeof m.tr === 'object' && m.tr.name) {
    out.tr = {
      name: String(m.tr.name || '').slice(0, 60),
      kw: String(m.tr.kw || '').slice(0, 60),
      rev: !!m.tr.rev,
      reading: String(m.tr.reading || '').slice(0, 2000)
    };
  } else if (out.type === 'tarot') {
    out.type = 'text';
    if (!out.text) out.text = '（一张牌）';
  }
  return out;
}

function normChat(c) {
  if (!c || typeof c !== 'object' || !c.id) return null;
  return {
    id: String(c.id),
    kind: c.kind === 'group' ? 'group' : 'dm',
    unread: Math.max(0, parseInt(c.unread, 10) || 0),
    time: String(c.time || ''),
    readAt: c.readAt ? String(c.readAt) : '',
    msgs: (Array.isArray(c.msgs) ? c.msgs : []).map(normMsg).filter(Boolean)
  };
}

function save() {

  saveTimer = setTimeout(function () {
    saveTimer = null;
    try {
      S.myName = ME.name;
      S.contacts = PEOPLE;
      S.groups = GROUPS;
      S.chats = CHATS;
      S.moments = MOMENTS;
      S.letters = LETTERS;
      S.wallet = WALLET;
      S.quizzes = QUIZZES;
      S.quizRuns = QUIZ_RUNS;
      S.emoji = EMOJI;
      S.music = MUSIC;
      S.calls = CALL_LOG;
      S.tarot = TAROT_LOG;
      storeSet(LS_KEY, JSON.stringify(S));
    } catch (e) {
      toast('本地空间不够了，这次的改动没能存下来', 'close');
    }
  }, 200);
}

function load() {
  var raw = null;
  raw = storeGet(LS_KEY);
  if (!raw) return;
  var d = null;
  try { d = JSON.parse(raw); } catch (e) { d = null; }
  if (!d || typeof d !== 'object' || Array.isArray(d)) {
    storeDel(LS_KEY);
    toast('本地数据读不出来，已回到默认状态', 'close');
    return;
  }
  S = defaultS();
  if (typeof d.myName === 'string' && d.myName.trim()) S.myName = d.myName.trim();
  S.cardLib = normLib(d.cardLib);
  S.pokes = (Array.isArray(d.pokes) && d.pokes.length)
    ? d.pokes.map(function (x) { return String(x).trim(); }).filter(Boolean) : POKES_SEED.slice();
  S.settings = normSettings(d.settings);
  S.avatars = { me: (d.avatars && typeof d.avatars.me === 'string') ? d.avatars.me : '' };
  S.wall = { chat: (d.wall && typeof d.wall.chat === 'string') ? d.wall.chat : '' };

  if (Array.isArray(d.contacts) && d.contacts.length) replaceAll(PEOPLE, d.contacts);
  if (Array.isArray(d.groups) && d.groups.length) replaceAll(GROUPS, d.groups);
  if (Array.isArray(d.chats) && d.chats.length) {
    replaceAll(CHATS, d.chats.map(normChat).filter(Boolean));
  }
  /* 朋友圈和信件:空数组是合法状态(用户全删过),所以只看类型不看长度 */
  if (Array.isArray(d.moments)) replaceAll(MOMENTS, d.moments.map(normMoment).filter(Boolean));
  if (Array.isArray(d.letters)) replaceAll(LETTERS, d.letters.map(normLetter).filter(Boolean));
  WALLET = normWallet(d.wallet);
  /* 问卷:老存档没这段就落到默认问卷;成绩空数组是合法状态(用户可能还没答过) */
  QUIZZES = normQuizzes(d.quizzes);
  QUIZ_RUNS = normRuns(d.quizRuns);
  /* 表情库:老存档没这段就落到内置 emoji;tab 全坏也回种子(不然面板会是空的) */
  EMOJI = emojiNormLib(d.emoji) || emojiSeed();
  /* 一起听:老存档没有这一段(或形状坏了)就回到空歌单,不让页面跟着炸 */
  MUSIC = musNormMusic(d.music);
  /* 第10单 · 通话:记录空数组是合法状态(还没打过电话);
     小窗位置没记过就是 null,渲染时落回默认角落 */
  CALL_LOG = normCalls(d.calls);
  S.callMini = normMiniPos(d.callMini);
  /* 第17单 · 占卜:没算过命就是空数组(合法状态) */
  TAROT_LOG = normTarot(d.tarot);
  S.ai = normAi(d.ai);
  ME.name = S.myName;
  /* 老存档的形状在这里被读平(proactive→sched.msg、from/to→dir/cid、无 cid 的
     动态归到第一位联系人)。立刻回写一次,免得用户什么都不改就一直留着旧结构。 */
  save();
}

  });
}

/* An uploaded picture is re-drawn through a canvas before it is stored: phone
   photos are several megabytes, and localStorage only has about five. */
function readImage(file, maxSide, cb) {
  if (!file || !/^image\//.test(file.type)) { toast('请选一张图片', 'image'); return; }
  var fr = new FileReader();
  fr.onload = function () {
    var img = new Image();
    img.onload = function () {
      var w = img.width, h = img.height;
      var k = Math.min(1, maxSide / Math.max(w, h));
      var cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(w * k));
      cv.height = Math.max(1, Math.round(h * k));
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      var out = '';
      try { out = cv.toDataURL('image/jpeg', 0.82); } catch (e) { out = ''; }
      if (!out) { toast('这张图片读不出来，换一张试试', 'image'); return; }
      cb(out);
    };
    img.onerror = function () { toast('这张图片读不出来，换一张试试', 'image'); };
    img.src = String(fr.result);
  };
  fr.onerror = function () { toast('读取文件失败', 'image'); };
  fr.readAsDataURL(file);
}

/* Export must survive the APK shell as well as a desktop browser: the
   Capacitor bridge writes a real file and opens the share sheet, the web
   path falls back to a download link, and neither one may fail silently. */
function downloadJson(filename, data, doneMsg) {
  var text = JSON.stringify(data, null, 2);
  var cap = (typeof window !== 'undefined') ? window.Capacitor : null;
  var P = cap && cap.Plugins;
  if (P && P.Filesystem && P.Share) {
    P.Filesystem.writeFile({ path: filename, data: text, directory: 'CACHE', encoding: 'utf8', recursive: true })
      .then(function (res) {
        return P.Share.share({ title: filename, files: [res.uri], dialogTitle: '导出数据' });
      })
      .then(function () { toast(doneMsg || '已导出', 'download'); })
      .catch(function (err) {
        var name = err && err.message ? String(err.message) : '';
        if (/cancel|abort/i.test(name)) return;
        webDownload(filename, text, doneMsg);
      });
    return;
  }
  webDownload(filename, text, doneMsg);
}

function webDownload(filename, text, doneMsg) {
  try {
    var blob = new Blob([text], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    toast(doneMsg || '已导出', 'download');
  } catch (e) {
    toast('这个环境不让下载，先把 JSON 复制出去也行', 'close');
  }
}

var toastSig = { msg: '', at: 0 };
function toast(msg, iconName) {
  var now = Date.now();
  if (msg === toastSig.msg && now - toastSig.at < 340) return;   /* debounce rapid taps */
  toastSig = { msg: msg, at: now };
  var layer = $('#toastLayer');
  var el = document.createElement('div');
  el.className = 'toast';
  el.setAttribute('role', 'status');
  el.innerHTML = (iconName ? ic(iconName) : '') + '<span>' + esc(msg) + '</span>';
  layer.appendChild(el);
  while (layer.children.length > 3) layer.removeChild(layer.firstChild);
  setTimeout(function () {
    el.classList.add('out');
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 220);
  }, 1700);
}

/* unread figures are always counted, never typed in */
function unreadChats() {
  var n = 0;
  for (var i = 0; i < CHATS.length; i++) n += CHATS[i].unread;
  return n;
}
function unreadLetters() {
  var n = 0;
  for (var i = 0; i < LETTERS.length; i++) {
    if (LETTERS[i].dir === 'in' && LETTERS[i].unread) n++;
  }
  return n;
}

/* ── B0b · SPACES ────────────────────────────────────────────────────────
   朋友圈和信箱都是「我 与 某一位梦角」的共享空间,不是全站大杂烩:每条动态、
   每封信都带 cid,页面只渲染当前 cid 的那一份。联系人被删掉时,页内选择器
   要自动落回一个还存在的 cid,不能让页面空转。 */
function dmList() {
  return PEOPLE.filter(function (p) { return p.id && p.id !== 'me'; });
}

function cidExists(id) {
  for (var i = 0; i < PEOPLE.length; i++) if (PEOPLE[i].id === id) return true;
  return false;
}

function firstCid() { var l = dmList(); return l.length ? l[0].id : 'c1'; }

function activeMomCid() {
  if (!cidExists(state.momCid)) state.momCid = firstCid();
  return state.momCid;
}

function activeLetterCid() {
  if (!cidExists(state.letterCid)) state.letterCid = firstCid();
  return state.letterCid;
}

function activePacketCid() {
  if (!cidExists(state.packetCid)) state.packetCid = firstCid();
  return state.packetCid;
}

function activeWalletCid() {
  if (!cidExists(state.walletCid)) state.walletCid = firstCid();
  return state.walletCid;
}

function momentsOf(cid) {
  return MOMENTS.filter(function (m) { return m.cid === cid; });
}

function lettersOf(cid) {
  return LETTERS.filter(function (l) { return l.cid === cid; });
}

function unreadMoments() {
  var n = 0;
  MOMENTS.forEach(function (m) { if (m.unread) n++; });
  return n;
}

function unreadLettersOf(cid) {
  var n = 0;
  lettersOf(cid).forEach(function (l) { if (l.dir === 'in' && l.unread) n++; });
  return n;
}

/* 进入某个功能页就算把这些内容看过了 —— 角标点进去清零 */
function markMomentsRead(cid) {
  var hit = false;
  MOMENTS.forEach(function (m) { if (m.cid === cid && m.unread) { m.unread = false; hit = true; } });
  if (hit) save();
}
function markLettersRead(cid) {
  var hit = false;
  LETTERS.forEach(function (l) { if (l.cid === cid && l.unread) { l.unread = false; hit = true; } });
  if (hit) save();
}

/* 朋友圈和信箱顶部的「这是谁的空间」切换条 —— 两个页面共用一套渲染,只有
   当前 cid 和角标口径不同。联系人被删了也不会空转,active*Cid() 已经兜底。 */
function cidTabs(kind) {
  var act = kind === 'moments' ? 'mom-cid' : (kind === 'packet' ? 'packet-cid' : 'letter-cid');
  var active = kind === 'moments' ? activeMomCid() : (kind === 'packet' ? activePacketCid() : activeLetterCid());
  var chips = dmList().map(function (p) {
    var n = kind === 'moments'
      ? momentsOf(p.id).filter(function (m) { return m.unread; }).length
      : (kind === 'packet' ? rpCounts(p.id).unopened : unreadLettersOf(p.id));
    return '<button class="chip-pick' + (active === p.id ? ' on' : '') + '" data-act="' + act + '" ' +
      'data-id="' + p.id + '" aria-pressed="' + (active === p.id) + '" ' +
      'data-od-id="' + kind + '-cid-' + p.id + '">' + esc(p.name) +
      (n ? '<span class="num">' + n + '</span>' : '') + '</button>';
  }).join('');
  return '<div class="chip-row cid-tabs" data-od-id="' + kind + '-cid-tabs">' + chips + '</div>';
}
function lastMsg(c) {
  var m = c.msgs[c.msgs.length - 1];
  if (!m) return '';
  return (c.kind === 'group' && !m.me ? person(m.who).name + '：' : '') + m.text;
}
function nowTime() {
  var d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

/* ══ B · MODULE SCREENS ═════════════════════════════════════════════════ */
/* ── B0 · SHARED CHROME ─────────────────────────────────────────────── */
function navBar(o) {
  var head = o.sub
    ? '<div class="nav-head"><div class="nav-title">' + esc(o.title) + '</div><div class="nav-sub">' + esc(o.sub) + '</div></div>'
    : '<div class="nav-head"><div class="nav-title">' + esc(o.title) + '</div></div>';
  return '<header class="app-nav' + (o.solid ? ' solid' : '') + '">' +
    (o.back ? '<button class="nav-back" data-go="' + o.back + '" aria-label="返回" data-od-id="' + o.id + '-back">' + ic('back') + '</button>' : '') +
    (o.av ? '<span class="nav-av" data-pat="1" title="双击拍一拍">' + avatar(o.av, 'a36') + '</span>' : '') +
    head + '<span class="nav-spacer"></span>' + (o.acts || '') + '</header>';
}

function navAct(act, glyph, label) {
  return '<button class="nav-act" data-act="' + act + '" aria-label="' + esc(label) + '">' + ic(glyph) + '</button>';
}

function appShell(o) {
  return '<div class="app" data-od-id="' + o.id + '">' +
    navBar(o) +
    '<div class="app-body">' + o.body + '</div>' +
    /* 悬浮主按钮:各页面传的是 fab,早先这里只读 foot,四个 FAB 全没渲染出来 */
    (o.fab || o.foot || '') + '</div>';
}

/* ── B1 · HOME ──────────────────────────────────────────────────────── */

  { id: 'cards',    label: '字卡库', icon: 'cards',    route: '#cards' },
  { id: 'letters',  label: '信箱',   icon: 'mail',     route: '#letters' },
  { id: 'moments',  label: '朋友圈', icon: 'moments',  route: '#moments' },
  { id: 'music',    label: '一起听', icon: 'music',    route: '#music' },
  { id: 'tarot',    label: '塔罗',   icon: 'tarot',    route: '#tarot' },
  { id: 'quiz',     label: '问卷',   icon: 'quiz',     route: '#questionnaire' },
  { id: 'packet',   label: '红包',   icon: 'gift',     route: '#redpacket' },
  { id: 'emoji',    label: '表情',   icon: 'smile',    route: '#emoji' },
  { id: 'contacts', label: '联系人', icon: 'contacts', route: '#contacts' },
  { id: 'call',     label: '通话',   icon: 'phone',    route: '#calls' },

var WEEK = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];

function dateLine() {
  var d = new Date();
  return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + WEEK[d.getDay()];
}

function renderHome() {
  var hero = CHATS[0];
  for (var i = 0; i < CHATS.length; i++) { if (CHATS[i].unread > 0) { hero = CHATS[i]; break; } }
  var hp = person(hero.id);
  var mtrack = musCur();
  var mPlaying = musIsPlaying();
  var cc = unreadChats(), lc = unreadLetters(), mc = unreadMoments();
  var badges = { chat: cc, letters: lc, moments: mc };

  var tiles = APPS.map(function (a) {

    return '<button class="app-icon" data-go="' + a.route + '" data-od-id="app-icon-' + a.id + '" ' +
      'style="--tile: color-mix(in oklch, var(--surface) 86%, transparent); --tile-fg: var(--accent-strong)">' +
      '<span class="glyph">' + ic(a.icon) + (n ? '<span class="badge">' + n + '</span>' : '') + '</span>' +
      '<span class="label">' + esc(a.label) + '</span></button>';
  }).join('');

  return '<div class="home-inner">' +
    '<div class="home-top">' +
        '<div><div class="home-clock num" id="homeClock">' + nowTime() + '</div>' +
        '<div class="home-date">' + dateLine() + '</div></div>' +
        '<div class="home-weather">' + ic('bell') + '<span class="num">' + (cc + lc + mc) + ' 条未读</span></div>' +
      '</div>' +
      '<button class="hero-widget" data-act="open-chat" data-id="' + hero.id + '" data-od-id="home-hero-widget">' +
        avatar(hero.id, 'hw-av') +
        '<span class="hw-body"><span class="hw-name">' + esc(hp.name) + '</span>' +
        '<span class="hw-msg">' + esc(lastMsg(hero)) + '</span></span>' +
        (hero.unread ? '<span class="hw-count">' + hero.unread + '</span>' : '') +
      '</button>' +
      '<div class="widget-row">' +
        '<button class="mini-widget" data-go="#letters" data-od-id="home-widget-letters">' +
          '<span class="mw-mark">' + ic('mail') + '</span>' +
          '<span><span class="mw-k">信箱</span><span class="mw-v num">' + lc + ' 封未读</span></span></button>' +
        '<button class="mini-widget" data-go="#music" data-od-id="home-widget-music">' +
          '<span class="mw-mark' + (mPlaying ? ' is-playing' : '') + '" id="homeMusicMark">' + ic('music') + '</span>' +
          '<span><span class="mw-k">一起听 · <span class="num" id="homeMusicTime">' + fmt(musCurSec()) + '</span></span>' +
          '<span class="mw-v" id="homeMusicTitle">' + esc(mtrack ? mtrack.name : '还没有在听的歌') + '</span></span></button>' +
      '</div>' +

}

/* ── B2 · CHAT ──────────────────────────────────────────────────────── */
function chatOf(id) {
  for (var i = 0; i < CHATS.length; i++) if (CHATS[i].id === id) return CHATS[i];
  return CHATS[0];
}

function renderChat() {
  var rows = CHATS.map(function (c) {
    return '<button class="row-item" data-act="open-chat" data-id="' + c.id + '" data-od-id="chat-row-' + c.id + '">' +
      avatar(c.id, 'a44') +
      '<span class="ri-body"><span class="ri-t">' + esc(person(c.id).name) + '</span>' +
      '<span class="ri-s">' + esc(lastMsg(c)) + '</span></span>' +
      '<span class="ri-end"><span class="ri-time">' + esc(c.time) + '</span>' +
      (c.unread ? '<span class="unread-pill">' + c.unread + '</span>' : '') + '</span></button>';
  }).join('');
  var un = unreadChats();
  return appShell({
    id: 'screen-chat', back: '#home', title: '聊天',
    sub: un ? un + ' 条未读' : '都看过了',
    acts: navAct('chat-menu', 'more', '管理联系人'),
    body: '<div class="pad"><div class="list" data-od-id="chat-list">' + rows + '</div>' +
          '<p class="inline-note" style="margin-top:16px">演示会话共 ' + CHATS.length + ' 条，消息与联系人都在页面内维护。</p></div>',
    fab: '<button class="fab" data-act="sheet-newchat" aria-label="新建会话" data-od-id="chat-fab-new">' + ic('plus') + '</button>'
  });
}

/* each speaker gets their own tint inside the app's own hue family, derived
   from their existing avatar tone — no new colours enter the system */
function voiceStyle(id) {
  var p = person(id) || {};
  var t = p.tone;
  if (t !== 1 && t !== 2 && t !== 3) t = 1;
  return '--who-bg: var(--tone-t' + t + '); --who-ink: var(--ink-t' + t + ');';
}

/* read receipt: my own last line in the thread is the only one that can carry
   it — 送达 while it is still unanswered, 已读 once they actually answer, so the
   receipt never claims something that has not happened yet */
function readReceipt(id, m) {
  var c = chatOf(id), msgs = c.msgs, lastMine = null;
  for (var i = msgs.length - 1; i >= 0; i--) { if (msgs[i].me) { lastMine = msgs[i]; break; } }
  if (lastMine !== m) return '';
  if (c.readAt && c.readAt === m.time) {
    return '<span class="bubble-read" role="img" aria-label="对方已读" title="对方已读">' +
      ic('checkDouble') + '已读</span>';
  }
  return '<span class="bubble-read pending" role="img" aria-label="已送达" title="已送达">' +
    ic('check') + '送达</span>';
}

/* ── 红包消息卡(复用红包页那套好看的信封造型)────────────────────────────
   未拆的来信红包可点;已拆/已退回不再入账,只显示结果。 */
function rpCardHTML(m, cid) {
  var pk = m.pk, mine = !!m.me;
  var opened = pk.state === 'opened', refunded = pk.state === 'refunded';
  var settled = opened || refunded;
  var label = mine
    ? (opened ? '已领取' : (refunded ? '已退回' : '待 TA 领取'))
    : (opened ? '已存入红包袋' : (refunded ? '已退回' : '点开看看'));
  var clickable = !mine && !settled;
  var tag = clickable ? 'button' : 'div';
  return '<' + tag + ' class="rp-card' + (settled ? ' is-done' : '') + '"' +
    (clickable ? ' data-act="rp-tap" data-id="' + pk.id + '"' : '') +
    ' data-od-id="rp-' + pk.id + '">' +
    '<span class="rp-seal">' + (settled ? ic('check') : '福') + '</span>' +
    '<span class="rp-amt num"><small>¥</small>' + (opened ? pk.amount.toFixed(2) : '?.??') + '</span>' +
    (pk.wish ? '<span class="rp-wish">' + esc(pk.wish) + '</span>' : '') +
    '<span class="rp-state">' + label + '</span>' +
  '</' + tag + '>';
}

/* 拆红包 overlay:未拆时是「戳一下拆开」,拆开后翻出金额并说明已入账 */
function renderRpOverlay() {
  if (!state.rp) return '';
  var m = findPk(state.rp.cid, state.rp.pkid);
  if (!m || !m.pk || m.me) return '';
  var pk = m.pk, revealed = state.rp.revealed;
  return '<div class="rp-overlay" data-od-id="rp-overlay">' +
    '<div class="rp-big' + (revealed ? ' opened' : '') + '"' +
      (revealed ? '' : ' data-act="rp-reveal"') + ' data-od-id="rp-big">' +
      '<div class="seal">' + (revealed ? ic('check') : '福') + '</div>' +
      '<div class="amount num"><small>¥</small>' + (revealed ? pk.amount.toFixed(2) : '?.??') + '</div>' +
      '<div class="from">' + (revealed ? '已存入你的红包袋' : '来自 ' + esc(person(state.rp.cid).name) + ' 的红包') + '</div>' +
      (pk.wish ? '<div class="rp-wish-big">' + esc(pk.wish) + '</div>' : '') +
      '<div class="rp-open-btn"' + (revealed ? ' data-act="rp-close"' : '') + '>' + (revealed ? '收下' : '戳一下拆开') + '</div>' +
    '</div>' +
    '<button class="rp-close" data-act="rp-close" aria-label="关闭">' + ic('close') + '</button>' +
  '</div>';
}

function paintOverlay() {
  var host = document.getElementById('overlayHost');
  if (!host) return;
  host.innerHTML = renderRpOverlay();
  host.classList.toggle('on', !!state.rp);
}

/* 我发红包后 TA 的反应三选一:秒拆 / 默默退回 / 不动 */
function taReactToPacket(cid, pkid) {
  var m = findPk(cid, pkid);
  if (!m || !m.pk || m.pk.state !== 'idle') return;
  var r = Math.random();
  if (r < 0.5) {
    m.pk.state = 'opened';
    var w = walletOf(cid);
    w.ta = Math.round((w.ta + m.pk.amount) * 100) / 100;
    toast(person(cid).name + ' 拆了你的红包 · ¥' + m.pk.amount.toFixed(2), 'gift');
  } else if (r < 0.75) {
    m.pk.state = 'refunded';
    var w2 = walletOf(cid);
    w2.mine = Math.round((w2.mine + m.pk.amount) * 100) / 100;
    toast(person(cid).name + ' 没有收，红包退回了', 'gift');
  } else {
    return;                       /* 不动:留给 TA 自己慢慢看 */
  }
  save();
  if (inThread(cid)) paint(); else paintHome();
}

function msgHTML(m, id, isGroup, prev) {
  /* a system line is the one thing that is not a speech bubble: no tail, no
     column, just a quiet grey line down the middle of the thread */
  if (m.sys) {
    return '<div class="msg-row sys-row"><span class="sys-line">' + esc(m.text) + '</span></div>';
  }
  var mine = !!m.me;
  var who = m.who || id;
  var showWho = isGroup && !mine;
  var startsGroup = !prev || (!!prev.me !== mine) || (showWho && prev.who !== m.who);
  var style = showWho ? ' style="' + voiceStyle(who) + '"' : '';
  var isCard = m.type === 'card';
  var isSong = m.type === 'song' && m.song;

  /* 红包不走普通气泡,它自带一整张信封卡 */
  if (m.type === 'packet' && m.pk) {
    return '<div class="msg-row' + (startsGroup ? '' : ' tight') + '">' +
      '<div class="msg ' + (mine ? 'me' : 'them') + (showWho ? ' voiced' : '') + '"' + style + '>' +
        (showWho ? '<span class="who">' + esc(person(m.who).name) + '</span>' : '') +
        rpCardHTML(m, id) +
      '</div></div>';
  }

  /* 问卷邀请卡同样自带整张卡,不走气泡 */
  if (m.type === 'quiz' && m.qz) {
    return '<div class="msg-row' + (startsGroup ? '' : ' tight') + '">' +
      '<div class="msg ' + (mine ? 'me' : 'them') + (showWho ? ' voiced' : '') + '"' + style + '>' +
        (showWho ? '<span class="who">' + esc(person(m.who).name) + '</span>' : '') +
        qzMsgHTML(m) +
      '</div></div>';
  }

  /* 通话卡:自带底色,不跟气泡一起翻色(和红包卡同一个套路) */
  if (m.type === 'call' && m.call) {
    return '<div class="msg-row' + (startsGroup ? '' : ' tight') + '">' +
      '<div class="msg ' + (mine ? 'me' : 'them') + (showWho ? ' voiced' : '') + '"' + style + '>' +
        (showWho ? '<span class="who">' + esc(person(m.who).name) + '</span>' : '') +
        callCardHTML(m.call) +
      '</div></div>';
  }

  /* 第17单 · 每日一牌卡:TA 主动抽的一张,点一下翻出解读 */
  if (m.type === 'tarot' && m.tr) {
    return '<div class="msg-row' + (startsGroup ? '' : ' tight') + '">' +
      '<div class="msg ' + (mine ? 'me' : 'them') + (showWho ? ' voiced' : '') + '"' + style + '>' +
        (showWho ? '<span class="who">' + esc(person(m.who).name) + '</span>' : '') +
        tarotMsgHTML(m) +
      '</div></div>';
  }

  /* 表情:单独一条时是一张大表情(不要气泡),和文字同条时贴在气泡下面 */
  var stkItem = (m.stk && emojiById(m.stk)) || null;
  if (m.type === 'sticker' && stkItem && !m.text) {
    return '<div class="msg-row' + (startsGroup ? '' : ' tight') + '">' +
      '<div class="msg ' + (mine ? 'me' : 'them') + (showWho ? ' voiced' : '') + '"' + style + '>' +
        (showWho ? '<span class="who">' + esc(person(m.who).name) + '</span>' : '') +
        '<div class="stk-msg" data-od-id="msg-sticker">' + emojiBodyHTML(stkItem) + '</div>' +
        '<span class="stk-meta">' + esc(m.time) + (mine ? readReceipt(id, m) : '') + '</span>' +
      '</div></div>';
  }

  return '<div class="msg-row' + (startsGroup ? '' : ' tight') + '">' +
    '<div class="msg ' + (mine ? 'me' : 'them') + (showWho ? ' voiced' : '') + '"' + style + '>' +
      '<div class="bubble' + (isCard ? ' card-msg' : '') + '">' +
        (showWho ? '<span class="who">' + esc(person(m.who).name) + '</span>' : '') +
        (isCard ? '<span class="card-tag">' + ic('spark') + '字卡</span>' : '') +
        '<span class="bubble-text">' + esc(m.text) + '</span>' +
        (stkItem ? '<span class="stk-inline">' + emojiBodyHTML(stkItem) + '</span>' : '') +
        (isSong ? '<button class="song-card" data-act="song-open" data-id="' + esc(m.song.id) + '" ' +
          'data-od-id="msg-song-card">' +
          (m.song.pic
            ? '<span class="mq-cover" data-pic="' + esc(musCdnPic(m.song.pic, 120)) + '"' +
              ' data-fb="' + esc(m.song.pic) + '"></span>'
            : '<span class="mq-cover"><span class="mq-note">♪</span></span>') +
          '<span class="song-card-body"><span class="song-card-t">' + esc(m.song.name || '一首歌') + '</span>' +
          '<span class="song-card-s">' + esc(m.song.artist || '未知歌手') + ' · 一起听</span></span>' +
          ic('play') + '</button>' : '') +
        '<span class="bubble-meta"><span class="bubble-time">' + esc(m.time) + '</span>' +
          (mine ? readReceipt(id, m) : '') +
        '</span>' +
      '</div>' +
    '</div></div>';
}

/* three dots in their bubble while the reply is being composed */
function typingHTML(who) {
  return '<div class="msg-row"><div class="msg them"><div class="bubble typing" aria-label="对方正在输入">' +
    '<span></span><span></span><span></span></div></div></div>';
}

/* 输入条上滑面板的内容 —— 更多(＋) 与 表情 共用这一个容器(第1单结构范式)。
   'more' 是一格一格的快捷动作,'sticker' 是表情包面板(点选即发送)。 */
function chatPanelInner(mode) {
  if (mode === 'sticker') return '<div class="panel-pad">' + emojiPanelHTML('send', state.param) + '</div>';
  var items = [
    ['packet', '红包', 'gift'],
    ['quiz', '问卷', 'quiz'],
    ['card', '字卡', 'cards'],
    ['photo', '照片', 'image']
  ];
  return '<div class="panel-pad"><div class="panel-grid">' + items.map(function (it) {
    return '<button class="panel-item" data-act="panel-act" data-v="' + it[0] + '" data-od-id="panel-' + it[0] + '">' +
      '<span class="pi-ic">' + ic(it[2]) + '</span><span class="pi-t">' + it[1] + '</span></button>';
  }).join('') + '</div></div>';
}

/* 面板开合不整页 paint() —— 否则正在输入的那行会被重建成空的。这里只动面板自身。 */
function renderChatPanel() {
  var p = document.getElementById('chatPanel');
  if (!p) return;
  p.innerHTML = state.panel ? chatPanelInner(state.panel) : '';
  if (state.panel) p.setAttribute('data-open', '1'); else p.removeAttribute('data-open');
  var more = document.getElementById('composerMore');
  var stk = document.getElementById('composerSticker');
  if (more) more.classList.toggle('on', state.panel === 'more');
  if (stk) stk.classList.toggle('on', state.panel === 'sticker');
}

function renderThread(id) {
  var c = chatOf(id), p = person(id), isGroup = c.kind === 'group';
  var msgs = c.msgs.map(function (m, i) { return msgHTML(m, id, isGroup, c.msgs[i - 1]); }).join('');
  var typing = (state.typing && state.typing.id === id) ? typingHTML(state.typing.who) : '';
  var wallCls = S.wall.chat ? ' has-wall' : '';
  var wallBg = S.wall.chat ? ' style="background-image:url(' + S.wall.chat + ')"' : '';
  /* 槽位顺序固定:更多(＋) → 输入区 → 表情 → 发送。面板夹在消息流与输入条之间。 */
  var foot = '<div class="chat-foot">' +
    '<div class="chat-panel"' + (state.panel ? ' data-open="1"' : '') + ' id="chatPanel">' +
      (state.panel ? chatPanelInner(state.panel) : '') + '</div>' +
    '<div class="composer" data-od-id="thread-composer">' +
      '<button class="cbtn' + (state.panel === 'more' ? ' on' : '') + '" id="composerMore" data-act="chat-panel" data-v="more" aria-label="更多功能" data-od-id="composer-more">' + ic('plus') + '</button>' +
      '<label class="sr" for="chatInput">输入消息</label>' +
      '<textarea class="cinput" id="chatInput" rows="1" placeholder="发条消息…" aria-label="消息内容"></textarea>' +
      '<button class="cbtn' + (state.panel === 'sticker' ? ' on' : '') + '" id="composerSticker" data-act="chat-panel" data-v="sticker" aria-label="表情包" data-od-id="composer-sticker">' + ic('smile') + '</button>' +
      '<button class="send" id="chatSend" data-act="send" disabled aria-label="发送消息">' + ic('send') + '</button>' +
    '</div></div>';
  return appShell({
    id: 'screen-thread', back: '#chat', title: p.name, av: id,
    sub: (state.typing && state.typing.id === id) ? '正在输入…'
       : (isGroup ? (GROUPS[0].note || '群聊') : p.note),
    acts: navAct('thread-call', 'phone', '拨打语音通话') + navAct('thread-video', 'video', '视频通话'),
    body: '<div class="thread reveal' + wallCls + '"' + wallBg + ' data-od-id="thread-body">' +
      '<div class="chat-date-chip">今天</div>' + msgs + typing + '</div>',
    foot: foot
  });
}

/* ── B3 · LETTERS ─────────────────────────────────────────────────────
   一位梦角一个信箱。cid 是「通信的那一位」,dir 区分来信/去信——老存档里
   用 from === 'me' 表达去信,load 时已经读平成 dir,这里只认 dir。        */
function letterWho(l) {
  return l.dir === 'out' ? '寄给 ' + person(l.cid).name : '来自 ' + person(l.cid).name;
}

function letterRow(l) {
  var isIn = l.dir === 'in';
  return '<button class="row-item' + (isIn && l.unread ? ' is-unread' : '') + '" ' +
    'data-act="open-letter" data-id="' + l.id + '" data-od-id="letter-row-' + l.id + '">' +
    avatar(isIn ? l.cid : 'me', 'a44') +
    '<span class="ri-body"><span class="ri-t">' +
      '<span class="ri-tag' + (isIn ? '' : ' out') + '">' + (isIn ? '来信' : '去信') + '</span>' +
      esc(l.subject) + '</span>' +
      '<span class="ri-s">' + esc(letterPreview(l)) + '</span></span>' +
    '<span class="ri-end"><span class="ri-time">' + esc(l.time) + '</span>' +
    (isIn && l.unread ? '<span class="unread-dot"></span>'
                      : (l.replied ? '<span class="seal-mark">已回信</span>' : '')) + '</span></button>';
}

function letterPreview(l) {
  var t = letterPlain(l.body).replace(/\s+/g, ' ').trim();
  if (!t) return '（这封信还没有正文）';
  return t.length > 30 ? t.slice(0, 30) + '…' : t;
}

function renderLetters() {
  var cid = activeLetterCid();
  var tab = (state.letterTab === 'in' || state.letterTab === 'out') ? state.letterTab : 'all';
  var q = (state.letterQuery || '').trim().toLowerCase();
  var all = lettersOf(cid);
  var shown = all.filter(function (l) {
    if (tab !== 'all' && l.dir !== tab) return false;
    if (!q) return true;
    return (l.subject + ' ' + letterPlain(l.body)).toLowerCase().indexOf(q) >= 0;
  });
  var rows = shown.length
    ? shown.map(letterRow).join('')
    : '<p class="empty-note">' + (q || tab !== 'all' ? '没有符合条件的信' : person(cid).name + ' 还没有和你的通信') + '</p>';

  var tabs = '<div class="seg-tabs" data-od-id="letter-tabs">' +
    [['all', '全部'], ['in', '来信'], ['out', '去信']].map(function (t) {
      var n = t[0] === 'all' ? all.length : all.filter(function (l) { return l.dir === t[0]; }).length;
      return '<button class="seg-tab' + (tab === t[0] ? ' on' : '') + '" data-act="letter-tab" data-v="' + t[0] +
        '" aria-pressed="' + (tab === t[0]) + '" data-od-id="letter-tab-' + t[0] + '">' + t[1] + ' · ' + n + '</button>';
    }).join('') + '</div>';

  var un = unreadLettersOf(cid);
  return appShell({
    id: 'screen-letters', back: '#home', title: '信箱',
    sub: person(cid).name + ' · ' + (un ? un + ' 封未读' : '都读过了'),
    body: '<div class="pad stack-2">' +
      cidTabs('letters') + tabs +
      '<div class="search-field">' + ic('search') +
        '<input class="input" id="letterSearch" type="search" placeholder="搜索标题或正文" ' +
        'aria-label="搜索信件" value="' + esc(state.letterQuery) + '"></div>' +
      '<div class="list" data-od-id="letter-list">' + rows + '</div>' +
      '<p class="inline-note">信件比消息慢一点，所以更像真的。</p>' +
      '<p class="inline-note">' + person(cid).name + ' 会自己寄信过来，间隔和概率在 设置 · TA 的主动行为 里调。</p>' +
    '</div>',
    fab: '<button class="fab" data-act="go-compose" aria-label="写信" data-od-id="letters-fab-compose">' + ic('edit') + '</button>'
  });
}

/* 贴纸以 [id] 记号嵌进正文,寄出/展示时由 letterBodyHTML 解析回图标 */
function letterStickerRow() {
  var out = '';
  STICKER_TABS.forEach(function (t) {
    out += '<div class="chip-row" style="margin-top:8px">' + STICKERS[t[0]].map(function (s) {

        'data-od-id="compose-stick-' + s[0] + '" aria-label="插入贴纸 ' + esc(s[1] || s[0]) + '">' +
        (t[0] === 'text' ? esc(s[0]) : ic(s[0])) + '</button>';
    }).join('') + '</div>';

}

function renderCompose() {
  var c = state.composing;
  if (!cidExists(c.to)) c.to = activeLetterCid();
  var chips = dmList().map(function (p) {
    return '<button class="chip-pick' + (c.to === p.id ? ' on' : '') + '" data-act="pick-to" data-id="' + p.id + '" ' +

    id: 'screen-compose', back: '#letters', title: '写信', sub: '寄给 ' + person(c.to).name + re,
    body: '<div class="pad stack-2">' +
      '<div><div class="section-label">收信人</div>' +
      '<div class="recipient-wrap cid-tabs" data-od-id="compose-recipients">' + chips + '</div></div>' +
      '<div class="paper" data-od-id="compose-paper">' +

        '<input class="input" id="letterSubject" maxlength="60" placeholder="写一句主题" value="' + esc(c.subject) + '"></div>' +
        '<div class="field" style="margin-top:14px"><label for="letterBody">正文</label>' +

      '<button class="btn btn-primary btn-block" data-act="send-letter" data-od-id="compose-send">' +
        ic('send') + '寄出这封信</button>' +

/* 读信页:真人信纸 + 可选 AI 解读。去信只留一个「回信」入口,绝无二次寄出。 */
function renderLetterOpen(id) {
  var l = letterById(id);
  if (!l) return renderLetters();
  if (l.dir === 'in' && l.unread) { l.unread = false; save(); }
  var ai = state.aiOut;
  var box = '';
  if (ai.forId === l.id && (ai.busy || ai.text || ai.err)) {
    box = '<div class="ai-box" data-od-id="letter-ai-box"><div class="ai-h">AI 解读这封信</div>' +
      (ai.busy ? '<span style="color:var(--muted)">正在读信…</span>'
