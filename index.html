                         : esc(ai.text).replace(/\n/g, '<br>'))) + '</div>';
  }
  var note = l.dir === 'out'
    ? (l.replied ? '已经寄出，对方也回信了。' : '已经寄出，等对方回信。')
    : '主题会自动填成 Re: ' + l.subject;
  return appShell({
    id: 'screen-letter-open', back: '#letters',
    title: l.dir === 'out' ? '我寄出的信' : '来信',
    sub: person(l.cid).name + ' · ' + l.time,
    acts: (l.dir === 'in' ? navAct('letter-ai', 'wand', 'AI 解读这封信') : '') +
          navAct('letter-del', 'trash', '删除这封信'),
    body: '<div class="pad stack-2">' +
      '<div class="letter-open" data-od-id="letter-open">' +
        '<h3>' + esc(l.subject) + '</h3>' +
        '<div class="from">' + esc(letterWho(l)) + ' · ' + esc(l.time) + '</div>' +
        '<div class="body">' + letterBodyHTML(l.body, l.dir) + '</div>' +
        '<div class="sign">' + esc(l.sign) + '</div>' +
      '</div>' + box +
      '<p class="inline-note">' + esc(note) + '</p>' +
      '<button class="btn btn-primary btn-block" data-act="letter-reply" data-id="' + l.id + '" ' +
        'data-od-id="letter-reply">' + ic('edit') + '回信</button>' +
    '</div>'
  });
}

/* ── B4 · MOMENTS ─────────────────────────────────────────────────────
   朋友圈也是「我 与 某一位梦角」的私域空间,不是全站大杂烩:每条动态带 cid,
   页面只渲染当前 cid 的那一份。TA 的自动发圈挂在调度中心,不在这里自转。 */
function stickerMark(st) {
  if (!st) return '';
  if (st.kind === 'text') return '<span class="mo-sticker is-text">' + esc(st.id) + '</span>';
  return '<span class="mo-sticker" data-sticker="' + esc(st.id) + '">' + ic(st.id) + '</span>';
}

function momentHTML(m) {
  var names = m.likes.map(function (id) { return esc(person(id).name); }).join('、');
  var likes = names
    ? '<div class="like-line" data-od-id="moment-likes-' + m.id + '"><span class="who">' + names + '</span> 觉得很赞</div>'
    : '';
  var cms = m.comments.map(function (c) {
    return '<div class="cm"><span class="who">' + esc(person(c.who).name) + '</span>' + esc(c.text) + '</div>';
  }).join('');
  var cbox = cms ? '<div class="like-line" data-od-id="moment-cm-' + m.id + '">' + cms + '</div>' : '';
  var photo = m.scene
    ? '<div class="photo"><div class="scene" data-scene="' + m.scene + '">' +
      '<span class="scene-tag">' + esc(m.sceneLabel) + '</span></div></div>'
    : '';
  var place = m.place
    ? '<span class="mo-place" data-od-id="moment-place-' + m.id + '">' + ic('pin') + esc(m.place) + '</span>'
    : '';
  return '<article class="moment' + (m.unread ? ' is-new' : '') + '" data-od-id="moment-' + m.id + '">' +
    avatar(m.who, 'a44') +
    '<div class="mo-body">' +
      '<div class="mo-head"><span class="mo-name">' + esc(person(m.who).name) + '</span>' +
        '<button class="icon-btn danger mo-del" data-act="moment-del" data-id="' + m.id + '" ' +
          'aria-label="删除这条动态" data-od-id="moment-del-' + m.id + '">' + ic('close') + '</button></div>' +
      '<div class="mo-text">' + esc(m.text) + '</div>' + photo + stickerMark(m.sticker) + place +
      '<div class="mo-time">' + esc(m.time) + '</div>' +
      '<div class="actions">' +
        '<button class="act' + (m.liked ? ' liked' : '') + '" data-act="like" data-id="' + m.id + '" ' +
          'aria-pressed="' + (!!m.liked) + '" data-od-id="moment-like-' + m.id + '">' + ic('heart') +
          '<span class="num">' + m.likes.length + '</span></button>' +
        '<button class="act" data-act="sheet-comment" data-id="' + m.id + '" data-od-id="moment-comment-' + m.id + '">' +
          ic('comment') + '<span class="num">' + m.comments.length + '</span></button>' +
        '<button class="act" data-act="moment-share" data-id="' + m.id + '">' + ic('share') + '转发</button>' +
      '</div>' + likes + cbox +
    '</div></article>';
}

function renderMoments() {
  var cid = activeMomCid();
  var list = momentsOf(cid);
  var feed = list.length
    ? list.map(momentHTML).join('')
    : '<p class="empty-note">' + esc(person(cid).name) + ' 还没发过动态，点右下角自己发一条。</p>';
  var html = appShell({
    id: 'screen-moments', back: '#home', title: '朋友圈',
    sub: person(cid).name + ' · ' + list.length + ' 条动态',
    body: '<div class="pad stack-2">' +
      cidTabs('moments') +
      '<div class="card" style="padding:0;overflow:hidden" data-od-id="moment-feed">' + feed + '</div>' +
      '<p class="inline-note">' + person(cid).name +
        ' 会自己发动态（文案从字卡库里抽 2~5 张拼），间隔和概率在 设置 · TA 的主动行为 里调。</p>' +
    '</div>',
    fab: '<button class="fab" data-act="sheet-post" aria-label="发布动态" data-od-id="moments-fab-post">' + ic('plus') + '</button>'
  });
  /* 点进来就算看过了 —— 首页那个数字角标在这里清零 */
  markMomentsRead(cid);
  return html;
}

/* ══ C · MODULE SCREENS ═════════════════════════════════════════════════ */
/* ── C1 · TAROT(第17单 · 占卜抽卡)──────────────────────────────────── */
function tarotSlots(n) { return (TAROT_SLOTS[n] || TAROT_SLOTS[1]).slice(); }

/* 【默认·离线】本地模板解读(验收2):牌名 + 方位 + 关键词串拼接。
   没有 Key 也必须能读出东西来 —— 加购项不能把默认功能变成残疾。 */
function tarotTemplate(drawn, q) {
  if (!drawn.length) return '';
  var slots = tarotSlots(drawn.length);
  var qq = String(q || '').trim();
  var lines = drawn.map(function (d, i) {
    return slots[i] + ' · ' + d.card.full + '（' + tarotOri(d) + '，' + d.card.kw + '）：' +
      tarotWords(d).slice(0, 4).join('、');
  });
  var all = [];
  drawn.forEach(function (d) { all = all.concat(tarotWords(d).slice(0, 3)); });
  return [qq ? '关于「' + qq + '」，牌面这样回应：' : '牌面这样回应：']
    .concat(lines)
    .concat(['把这几个词放在一起看：' + all.join('、') +
      '。它更像是在提醒你留意当下的节奏，而不是替你决定。'])
    .join('\n');
}
/* AI 解读是加购项:没填 Key 就置灰,不给按钮也不假装能用 */
function tarotAiReady() { return !!(S.ai && String(S.ai.key || '').trim()); }

function tarotCardFace(d) {
  /* 大字用 full(小牌 = 花色+点数,如「圣杯骑士」)—— 只写点数会把四张「骑士」混成一张。
     牌面是纯文字排版,不挂任何图片(工单验收6)。 */
  return '<div class="art"><div class="tarot-face">' +
    '<span class="tf-no">' + esc(d.card.no) + '</span>' +
    '<span class="tf-name">' + esc(d.card.full) + '</span>' +
    '<span class="tf-rule"></span></div></div>';
}

/* 每日一牌卡:一次性摊开(牌名 + 方位 + 关键词 + 模板解读),不做二次点击 ——
   聊天流里的卡片点开还要再收起,在这个气泡尺寸里是负体验。 */
function tarotMsgHTML(m) {
  var tr = m.tr;
  return '<div class="tarot-msg' + (tr.rev ? ' rev' : '') + '" data-od-id="msg-tarot-card">' +
    '<span class="tm-head"><span class="tm-ic">' + ic('tarot') + '</span>' +
      '<span class="tm-k">今日一牌</span>' +
      '<span class="tm-ori">' + (tr.rev ? '逆位' : '正位') + '</span></span>' +
    '<span class="tm-name">' + esc(tr.name) + '</span>' +
    (tr.kw ? '<span class="tm-kw">' + esc(tr.kw) + '</span>' : '') +
    (tr.reading ? '<span class="tm-text">' + esc(tr.reading) + '</span>' : '') +
    '</div>';
}

function tarotRowHTML(r) {
  var cs = r.cards.map(function (c) { return c.name + (c.rev ? '（逆位）' : '（正位）'); }).join(' · ');
  return '<div class="tr-row" data-od-id="tarot-row-' + r.id + '">' +
    '<span class="tr-body"><span class="tr-t">' + esc(r.q ? r.q : '（没写问题）') + '</span>' +
    '<span class="tr-s">' + esc(cs) + (r.src === 'ai' ? ' · TA 解读' : ' · 本地解读') + '</span></span>' +
    '<span class="tr-time">' + esc(r.time || r.day || '') + '</span></div>';
}

function renderTarot() {
  var t = state.tarot;
  var n = t.mode;
  var slots = tarotSlots(n);
  var done = t.drawn.length === n && t.dealt >= n;

  var ask = '<div class="field"><label>想问点什么（可不填）</label>' +
    '<input class="input" id="tarotQ" maxlength="60" data-od-id="tarot-q" value="' + esc(t.q) +
    '" placeholder="静下来，想一件具体的事"></div>';

  var modes = [1, 3].map(function (m) {
    return '<button class="chip-pick' + (n === m ? ' on' : '') + '" data-act="tarot-mode" data-v="' + m +
      '" aria-pressed="' + (n === m) + '" data-od-id="tarot-mode-' + m + '">' +
      (m === 1 ? '单张' : '三张牌阵') + '</button>';
  }).join('');

  var deal = '';
  for (var i = 0; i < n; i++) {
    var d = t.drawn[i];
    var on = !!d && t.dealt > i;
    deal += '<div class="deal-slot' + (on ? ' flipped' : '') + '" data-od-id="tarot-slot-' + i + '">' +
      '<div class="card3d">' +
        '<div class="face back"><span class="sigil">' + ic('star') + '</span></div>' +
        '<div class="face front">' +
          (d ? tarotCardFace(d) : '<div class="art"><span class="fallback">✦</span></div>') +
          /* 牌名已经在牌面大字上写过了,底下这行只留方位,别重复一遍 */
          '<div class="cap">' + (d ? '<span class="ori' + (d.rev ? ' rev' : '') + '">' +
            tarotOri(d) + '</span>' : '待揭') + '</div>' +
        '</div>' +
      '</div></div>';
  }

  var meanings = done
    ? '<div class="meaning-list" data-od-id="tarot-meanings">' + t.drawn.map(function (d, k) {
        return '<div class="meaning"><span class="m-k">' + esc(slots[k]) + '</span>' +
          '<span class="m-v" style="flex:1">' + esc(tarotWords(d).slice(0, 4).join('、')) + '</span>' +
          '<span class="m-tag ' + (d.rev ? 'tint-red' : 'tint-jade') + '">' + tarotOri(d) + '</span></div>';
      }).join('') + '</div>'
    : '';

  /* 解读区:本地模板先垫底;配了 Key 翻完牌自动请 TA 解读,拿到后顶掉这块并标出来源 */
  var reading = '';
  if (done) {
    var aiOk = tarotAiReady();
    reading = '<div class="card stack-2" data-od-id="tarot-reading">' +
      '<div class="section-label">解读' +
        (t.aiBusy ? '<span class="tr-src ai">TA 正在解读…</span>' :
          t.src === 'ai' ? '<span class="tr-src ai">TA 说的</span>' : '<span class="tr-src">本地牌义</span>') +
      '</div>' +
      '<div class="tr-text">' + esc(t.reading || '').replace(/\n/g, '<br>') + '</div>' +
      (t.src === 'ai' ? '' :
        '<button class="btn btn-secondary btn-block' + (aiOk && !t.aiBusy ? '' : ' is-off') + '" ' +
          'data-act="tarot-ai" data-od-id="tarot-ai"' + (aiOk && !t.aiBusy ? '' : ' disabled') + '>' +
          ic('spark') + (t.aiBusy ? 'TA 正在看牌…' : (aiOk ? '再请 TA 说一次' : '请 TA 解读')) + '</button>') +
      (aiOk ? '' : '<p class="inline-note">还没填 API Key：设置 → AI 解读，填上 TA 就会自动来解读。' +
        '不配也能用，上面这份本地解读已经是根据牌义拼好的。</p>') +
      '</div>';
  }

  /* 翻牌动画进行时这块按钮就是块砖:再点一次会重抽一把,手指比眼睛快的人一定踩 */
  var dealing = t.drawn.length > 0 && !done;
  var cta = done
    ? '<button class="btn btn-secondary btn-block" data-act="reset-tarot" data-od-id="tarot-reset">' +
        ic('spark') + '重新抽牌</button>'
    : '<button class="btn btn-primary btn-block" data-act="draw-tarot" data-od-id="tarot-draw"' +
        (dealing ? ' disabled' : '') + '>' +
        ic('spark') + (dealing ? '正在揭牌…' : '开始抽牌') + '</button>';

  var hist = TAROT_LOG.length
    ? '<div class="card stack-2">' +
        '<div class="section-label">占卜记录（' + TAROT_LOG.length + ' / ' + TAROT_CAP + '）</div>' +
        '<div class="tr-list">' + TAROT_LOG.slice().reverse().map(tarotRowHTML).join('') + '</div>' +
        '<button class="chip-pick" data-act="tarot-clear" data-od-id="tarot-clear">' + ic('trash') + '清空记录</button>' +
      '</div>'
    : '';

  return appShell({
    id: 'screen-tarot', back: '#home', title: '塔罗',
    sub: TAROT.length + ' 张 · ' + (n === 1 ? '单张' : '三张牌阵'),
    body: '<div class="pad stack-2">' + ask +
      '<div class="chip-row" data-od-id="tarot-modes">' + modes + '</div>' +
      '<div class="tarot-stage" data-od-id="tarot-stage">' +
        '<div class="eyebrow">Daily Draw</div>' +
        '<h2>' + (n === 1 ? '此刻这一张' : '过去 · 现在 · 未来') + '</h2>' +
        '<p class="sub">静下来，想一件具体的事，再翻牌。</p>' +
        '<div class="deal-row">' + deal + '</div>' +
      '</div>' + cta + meanings + reading + hist +
      '<p class="inline-note">牌库 ' + TAROT.length + ' 张（22 大阿卡纳 + 56 小阿卡纳），' +
        '释义为通行版本，仅作参考。</p>' +
    '</div>'
  });
}

/* ── C2 · QUESTIONNAIRE (第12单)───────────────────────────────────────
   三道内容各走一条路由:列表(题库+历史) / 逐题作答 / 结果对照。编辑器独立成页。
   答题是「一屏一题」:点选项高亮 → 240ms 后自动进下一题,上一步可回改。 */
var qzTimer = null;
function qzClearTimer() { if (qzTimer) { clearTimeout(qzTimer); qzTimer = null; } }

/* 一次作答的进行态复位。从聊天卡片进来时带上 cid + 消息 id,答完就地改成结果卡。 */
function qzStart(qid, cid, msgId) {
  var q = quizById(qid);
  if (!q) { toast('这套问卷已经不在了', 'close'); return false; }
  qzClearTimer();
  state.quiz = {
    qid: qid, cid: cid || '', msgId: msgId || '', idx: 0, ans: {},
    phase: 'answer', run: null, think: 0, taAll: null
  };
  return true;
}

/* ── 列表:每套问卷一张卡(名称/出处/题数/答题次数) ───────────────────── */

    '<div class="qzc-acts">' +

        'data-od-id="qz-start-' + q.id + '">' + ic('play') + '开始作答</button>' +
      '<button class="btn btn-secondary btn-sm" data-act="quiz-edit" data-id="' + q.id + '" ' +
        'data-od-id="qz-edit-' + q.id + '">' + ic('edit') + '编辑</button>' +
      '<button class="btn btn-secondary btn-sm" data-act="quiz-del" data-id="' + q.id + '" ' +
        'aria-label="删除这套问卷" data-od-id="qz-del-' + q.id + '">' + ic('trash') + '</button>' +
    '</div></div>';
}

/* 一条历史成绩:默契度 + 问卷名 + 时间,点进结果页回看 */
function qzRunRowHTML(r) {
  return '<button class="qz-run" data-act="quiz-see" data-id="' + r.id + '" data-od-id="qz-run-' + r.id + '">' +
    '<span class="qzr-pct num">' + r.pct + '<small>%</small></span>' +

function renderQuiz() {
  var cards = QUIZZES.map(qzCardHTML).join('');
  var runs = QUIZ_RUNS.slice().sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });

    body: '<div class="pad stack-2">' +

    '</div>'
  });
}

/* ── 逐题作答 ────────────────────────────────────────────────────────── */
function renderQuizRun(qid) {
  var q = quizById(qid);
  if (!q) {
    return appShell({
      id: 'screen-quiz-run', back: '#questionnaire', title: '问卷',
      body: '<div class="pad"><div class="card"><p class="empty-note">这套问卷不在了，可能已经被删掉。</p>' +
        '<button class="btn btn-secondary btn-block" data-go="#questionnaire">回到问卷列表</button></div></div>'
    });
  }
  /* 直接刷到这条路由(或从聊天进来)时进度是空的,补开一次;已进 thinking 就继续动画 */
  if (state.quiz.qid !== qid || !state.quiz.phase) qzStart(qid, state.quiz.cid, state.quiz.msgId);
  if (state.quiz.phase === 'thinking') return qzThinkingHTML(q);

  var total = q.qs.length;
  var i = Math.min(Math.max(0, state.quiz.idx), total - 1);
  var cur = q.qs[i];
  var picked = state.quiz.ans[cur.id];
  var isLast = (i === total - 1);
  var allDone = q.qs.every(function (x) { return state.quiz.ans[x.id] !== undefined; });
  var doneN = q.qs.filter(function (x) { return state.quiz.ans[x.id] !== undefined; }).length;
  var pct = Math.round(doneN / total * 100);

  var opts = cur.opts.map(function (o, oi) {
    var on = picked === oi;
    return '<button class="q-opt" role="radio" aria-checked="' + on + '" ' +
      'data-act="qopt" data-v="' + oi + '" data-od-id="qopt-' + oi + '">' +
      '<span class="box"><i></i></span><span class="q-label">' + esc(o) + '</span></button>';
  }).join('');

  return appShell({
    id: 'screen-quiz-run', back: '#questionnaire',
    title: q.name, sub: 'Q' + (i + 1) + ' / ' + total,
    body: '<div class="pad stack-2">' +
      '<div><div class="progress-head"><span class="ph-k">第 ' + (i + 1) + ' / ' + total + ' 题</span>' +
        '<span class="ph-v num">' + pct + '%</span></div>' +
        '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div></div>' +
      '<div class="card qz-qbox" data-od-id="qz-qbox">' +
        '<div class="q-t">' + esc(cur.t) + '</div>' +
        '<div class="q-opts" role="radiogroup" aria-label="' + esc(cur.t) + '">' + opts + '</div>' +
      '</div>' +
      '<div class="qz-nav">' +
        (i > 0 ? '<button class="btn btn-secondary btn-sm" data-act="quiz-back" data-od-id="qz-back">' +
          ic('back') + '上一步</button>' : '<span class="qz-nav-hint">第 ' + (i + 1) + ' 题</span>') +
        (isLast && allDone
          ? '<button class="btn btn-primary btn-sm" data-act="quiz-submit" data-od-id="qz-submit">' +
            ic('check') + '交卷看默契度</button>'
          : '<span class="qz-nav-hint">' + (picked !== undefined ? '继续下一题…' : '选一个答案') + '</span>') +
      '</div>' +
      '<p class="inline-note">选完会自动跳到下一题；点错了用「上一步」回去改。</p>' +
    '</div>'
  });
}

/* ── TA 逐题作答:答案先定下来,动画只是把它一条条露出来 ─────────────── */
function qzThinkingHTML(q) {
  var lines = q.qs.map(function (x, i) {
    var shown = i < state.quiz.think;
    var ai = state.quiz.taAll ? state.quiz.taAll[x.id] : undefined;
    return '<div class="qt-line' + (shown ? ' done' : '') + '" data-od-id="qt-line-' + i + '">' +
      '<span class="qt-q">' + (i + 1) + '. ' + esc(x.t) + '</span>' +
      '<span class="qt-a">' + (shown && ai !== undefined && x.opts[ai] !== undefined
        ? esc(x.opts[ai]) : '<span class="qt-wait">' + ic('hourglass') + '</span>') + '</span></div>';
  }).join('');

  return appShell({
    id: 'screen-quiz-think', back: '#questionnaire',
    title: q.name, sub: 'TA 正在作答',
    body: '<div class="pad stack-2">' +
      '<div class="card qt-box" data-od-id="qt-box">' +
        '<div class="qt-head">' + ic('hourglass') + '<span>TA 正在一道一道答</span></div>' +
        '<div class="qt-lines">' + lines + '</div>' +
      '</div>' +
      '<p class="inline-note">已答 ' + Math.min(state.quiz.think, q.qs.length) + ' / ' + q.qs.length + ' 题</p>' +
    '</div>'
  });
}

function qzThinkStep() {
  qzTimer = null;
  var q = quizById(state.quiz.qid);
  if (!q || state.quiz.phase !== 'thinking') return;
  state.quiz.think++;
  paint();
  if (state.quiz.think >= q.qs.length) { qzTimer = setTimeout(qzFinalize, 520); return; }
  qzTimer = setTimeout(qzThinkStep, 300);
}

/* 收卷:算默契度、存档、把聊天里那张卡改成结果卡 */
function qzFinalize() {
  qzTimer = null;
  var q = quizById(state.quiz.qid);
  if (!q) return;
  var taAll = state.quiz.taAll || {};
  var same = 0;
  var rows = q.qs.map(function (x) {
    var mi = state.quiz.ans[x.id];
    var ti = taAll[x.id];
    if (ti === undefined) ti = taPick(x);
    if (mi !== undefined && mi === ti) same++;
    return {
      t: x.t, opts: x.opts.slice(),
      mine: (mi === undefined || x.opts[mi] === undefined) ? '' : x.opts[mi],
      ta: x.opts[ti] === undefined ? '' : x.opts[ti],
      rand: x.ans === ''        /* 标准答案=随机 → 结果页给这道题打标 */
    };
  });
  var pct = Math.round(same / q.qs.length * 100);
  var run = {
    id: uid('run'), qid: q.id, name: q.name, from: q.from, cid: state.quiz.cid || '',
    time: nowTime(), ts: Date.now(), total: q.qs.length, same: same, pct: pct,
    comment: qzComment(pct), qs: rows
  };
  QUIZ_RUNS.unshift(run);
  /* 就地更新聊天里那张邀请卡 —— 消息自己就是「答没答过」的状态,不用另存标记 */
  if (state.quiz.cid && state.quiz.msgId) qzMarkDone(state.quiz.cid, state.quiz.msgId, run);
  save();
  state.quiz.phase = 'result';
  state.quiz.run = run;
  go('#quiz-result/' + run.id);
  toast('默契度 ' + pct + '%', 'heart');
}

/* ── 结果:默契度大数字(渐变文字) + 评语 + 逐题对照(一致项绿色) ────── */
function renderQuizResult(runId) {
  var r = runById(runId);
  if (!r) {
    return appShell({

        '<button class="btn btn-secondary btn-block" data-go="#questionnaire">回到问卷列表</button></div></div>'
    });
  }
  var rows = r.qs.map(function (x, i) {
    var ok = !!x.mine && x.mine === x.ta;
    return '<div class="qz-row' + (ok ? ' ok' : '') + '" data-od-id="qz-row-' + i + '">' +
      '<div class="qzr-q">' + (i + 1) + '. ' + esc(x.t) + '</div>' +
      '<div class="qzr-a">' +
        '<span class="qza mine"><em>我</em>' + esc(x.mine || '—') + '</span>' +
        '<span class="qza ta"><em>TA</em>' + esc(x.ta || '—') +
          (x.rand ? '<span class="qzr-tag">随机</span>' : '') + '</span>' +
        (ok ? '<span class="qza-ok">' + ic('check') + '一致</span>' : '') +
      '</div></div>';
  }).join('');

  return appShell({
    id: 'screen-quiz-result', back: '#questionnaire',
    title: '默契度', sub: r.name,
    body: '<div class="pad stack-2">' +
      '<div class="card qz-score" data-od-id="qz-score">' +
        '<div class="qzs-k">你们的默契度</div>' +
        '<div class="qzs-v num" data-od-id="qz-pct">' + r.pct + '<small>%</small></div>' +
        '<div class="qzs-same">' + r.same + ' / ' + r.total + ' 题答得一样</div>' +
        '<p class="qzs-c">' + esc(r.comment) + '</p>' +
        '<div class="qzs-time">' + esc(r.time) + ' · ' + esc(r.name) + '</div>' +
      '</div>' +
      '<div class="qz-sec">逐题对照</div>' +
      '<div class="card" style="padding:0;overflow:hidden" data-od-id="qz-compare">' + rows + '</div>' +
      '<button class="btn btn-primary btn-block" data-act="quiz-again" data-id="' + esc(r.qid) + '" ' +
        'data-od-id="qz-again">' + ic('refresh') + '再答一次（生成新记录）</button>' +
      '<button class="btn btn-secondary btn-block" data-go="#questionnaire" data-od-id="qz-back-list">' +
        '回到问卷列表</button>' +
    '</div>'
  });
}

/* ── 编辑器(核心需求):整套增删改,选项可增删,TA 答案用下拉指定 ────────
   一律改 state.qedit 草稿:文字框不走重绘(否则正在打字的那格会失焦),
   只有「加/删选项、加/删题」这种点了按钮的结构改动才整页重绘。 */
function qzEditDraft(qid) {
  if (!qid || qid === 'new') {
    return {
      id: '', isNew: true, name: '', from: '', err: '',
      qs: [{ id: uid('q'), t: '', opts: ['', ''], ans: 0 }]
    };
  }
  var q = quizById(qid);
  if (!q) return null;
  return {
    id: q.id, isNew: false, name: q.name, from: q.from, err: '',
    qs: q.qs.map(function (x) {
      /* 草稿里 ans 是**下标**;题库里 ans 是**选项文案**,空串 = 随机。
         这里把「随机」翻译成 -1,下拉框里就是一个真的选项。 */
      var i = x.ans === '' ? -1 : x.opts.indexOf(x.ans);
      return { id: x.id, t: x.t, opts: x.opts.slice(), ans: (i < 0 && x.ans !== '') ? 0 : i };
    })
  };
}
function qeQ(d, qid) {
  if (!d) return null;
  for (var i = 0; i < d.qs.length; i++) if (d.qs[i].id === qid) return d.qs[i];
  return null;
}

function renderQuizEdit(qid) {
  var key = qid || 'new';
  if (!state.qedit || (state.qedit.id || 'new') !== key) {
    var d = qzEditDraft(key);
    if (!d) {
      return appShell({
        id: 'screen-quiz-edit', back: '#questionnaire', title: '编辑问卷',
        body: '<div class="pad"><div class="card"><p class="empty-note">这套问卷不在了。</p>' +
          '<button class="btn btn-secondary btn-block" data-go="#questionnaire">回到问卷列表</button></div></div>'
      });
    }
    state.qedit = d;
  }
  var d = state.qedit;

  var blocks = d.qs.map(function (qq, qi) {
    var opts = qq.opts.map(function (o, oi) {
      return '<div class="qe-opt">' +
        '<input class="input" data-qe="opt" data-q="' + qq.id + '" data-i="' + oi + '" maxlength="40" ' +
          'placeholder="选项 ' + (oi + 1) + '" value="' + esc(o) + '" data-od-id="qe-opt-' + qi + '-' + oi + '">' +
        '<button class="qe-x" data-act="qe-del-opt" data-q="' + qq.id + '" data-i="' + oi + '" ' +
          (qq.opts.length <= QZ_MIN_OPTS ? 'disabled ' : '') +
          'aria-label="删掉这个选项">' + ic('close') + '</button></div>';
    }).join('');
    var sel = qq.opts.map(function (o, oi) {
      return '<option value="' + oi + '"' + (String(qq.ans) === String(oi) ? ' selected' : '') + '>' +
        esc(o || ('选项 ' + (oi + 1))) + '</option>';
    }).join('') +
      /* 「随机」放在最后:这样 options[i] 依旧一一对应第 i 个选项,
         选项输入框的实时同步(qeInput 里 sel.options[i].text)不用跟着挪下标 */
      '<option value="-1"' + (String(qq.ans) === '-1' ? ' selected' : '') + '>随机（每次摇一个）</option>';
    return '<div class="card qe-q" data-od-id="qe-q-' + qi + '">' +
      '<div class="qe-head"><span class="qe-no">第 ' + (qi + 1) + ' 题</span>' +
        '<button class="qe-x" data-act="qe-del-q" data-q="' + qq.id + '" ' +
          (d.qs.length <= 1 ? 'disabled ' : '') + 'aria-label="删掉这道题">' + ic('trash') + '</button></div>' +
      '<div class="field"><label>题干</label>' +
        '<input class="input" data-qe="qt" data-q="' + qq.id + '" maxlength="60" placeholder="问点什么" ' +
          'value="' + esc(qq.t) + '" data-od-id="qe-qt-' + qi + '"></div>' +
      '<div class="field" style="margin-top:12px"><label>选项</label>' +
        '<div class="qe-opts">' + opts + '</div>' +
        '<button class="btn btn-secondary btn-sm" data-act="qe-add-opt" data-q="' + qq.id + '" ' +
          'data-od-id="qe-add-opt-' + qi + '">' + ic('plus') + '加一个选项</button></div>' +
      '<div class="field" style="margin-top:12px"><label for="qe-ans-' + qi + '">TA 的标准答案</label>' +
        '<select class="input" id="qe-ans-' + qi + '" data-qe="ans" data-q="' + qq.id + '" ' +
          'data-od-id="qe-ans-' + qi + '">' + sel + '</select>' +
        '<p class="qe-hint">选「随机」= TA 每次都自己摇一个，不偏向任何选项。</p></div>' +
    '</div>';
  }).join('');

  return appShell({
    id: 'screen-quiz-edit', back: '#questionnaire',
    title: d.isNew ? '新建问卷' : '编辑问卷', sub: d.qs.length + ' 道题',
    acts: navAct('qe-save', 'check', '保存'),
    body: '<div class="pad stack-2">' +
      '<div class="card">' +
        '<div class="field"><label>问卷名称</label>' +
          '<input class="input" data-qe="name" maxlength="20" placeholder="比如：心动默契度" ' +
            'value="' + esc(d.name) + '" data-od-id="qe-name"></div>' +
        '<div class="field" style="margin-top:12px"><label>出处（可选）</label>' +
          '<input class="input" data-qe="from" maxlength="20" placeholder="默认问卷 / 摘抄自某本书" ' +
            'value="' + esc(d.from) + '" data-od-id="qe-from"></div>' +
      '</div>' +
      blocks +
      '<button class="btn btn-secondary btn-block" data-act="qe-add-q" data-od-id="qe-add-q">' +
        ic('plus') + '加一道题</button>' +
      (d.err ? '<p class="form-msg"><span class="err">' + esc(d.err) + '</span></p>' : '') +
      '<p class="inline-note">TA 多数时候照「标准答案」答，偶尔随机 —— 所以同一套问卷两次成绩不会完全一样。' +
        '一道题至少留两个选项。</p>' +
      '<button class="btn btn-primary btn-block" data-act="qe-save" data-od-id="qe-save-2">' +
        ic('check') + '保存</button>' +
      (d.isNew ? '' : '<button class="btn btn-secondary btn-block" data-act="quiz-del" data-id="' + d.id + '" ' +
        'data-od-id="qe-del">' + ic('trash') + '删掉这套问卷</button>') +
    '</div>'
  });
}


/* ── C3 · RED PACKET (第7单)──────────────────────────────────────────
   红包按 cid 分开。上面两张钱包卡是「我的袋 / TA 的袋」的当前余额与计数,
   下面是从聊天流里的红包消息派生出来的流水(最近 20 条,收绿支红)。 */
function renderPacket() {
  var cid = activePacketCid();
  var w = walletOf(cid);
  var cnt = rpCounts(cid);
  var recs = rpRecords(cid);

  var wallets = '<div class="rp-wallets" data-od-id="rp-wallets">' +
    '<div class="rp-wallet"><div class="rw-who">我的红包袋</div>' +
      '<div class="rw-bal num">¥' + w.mine.toFixed(2) + '</div>' +
      '<div class="rw-sub">收到 ' + cnt.got + ' 个</div></div>' +
    '<div class="rp-wallet"><div class="rw-who">' + esc(person(cid).name) + ' 的红包袋</div>' +
      '<div class="rw-bal num">¥' + w.ta.toFixed(2) + '</div>' +
      '<div class="rw-sub">TA 发出 ' + cnt.sent + ' 个</div></div>' +
  '</div>';

  var list = recs.length
    ? '<div class="card" data-od-id="rp-records" style="padding:0">' + recs.map(function (r) {
        var inb = !r.me;
        var st = inb
          ? (r.state === 'opened' ? '已拆' : '待拆')
          : (r.state === 'opened' ? '已领取' : (r.state === 'refunded' ? '已退回' : '待领取'));
        return '<div class="rp-rec" data-od-id="rp-rec">' +
          '<span class="rr-ic ' + (inb ? 'in' : 'out') + '">' + ic(inb ? 'gift' : 'share') + '</span>' +
          '<span class="rr-body"><span class="rr-t">' + (inb ? '收到红包' : '发出红包') + '</span>' +
            '<span class="rr-s">' + (r.wish ? esc(r.wish) + ' · ' : '') + st + ' · ' + esc(r.time) + '</span></span>' +
          '<span class="rr-amt ' + (inb ? 'in' : 'out') + '">' + (inb ? '+' : '-') + '¥' + r.amount.toFixed(2) + '</span>' +
        '</div>';
      }).join('') + '</div>'
    : '<p class="empty-note">还没有红包记录，点右上角发一个试试</p>';

  var note = cnt.unopened ? '有 ' + cnt.unopened + ' 个红包等你拆' : '红包袋 ¥' + w.mine.toFixed(2);

  return appShell({
    id: 'screen-packet', back: '#home', title: '红包', sub: note,
    acts: navAct('packet-send', 'plus', '发红包'),
    body: '<div class="pad stack-2">' + cidTabs('packet') + wallets + list +
      '<p class="inline-note">红包按联系人分开记；流水取最近 20 条，收绿支红。</p></div>'
  });
}

/* ── C4 · MUSIC (一起听) ────────────────────────────────────────────── */
/* ==== MUSIC-MODULE-BEGIN ==== */
function fmt(s) {
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

/* ── C4a · 播放引擎 ───────────────────────────────────────────────────
   全站只有一个 <audio>,id 固定为 music-audio,挂在一个**永远不会被重绘**的
   容器里(#global-media-root 在 document.body 下,#viewport 之外)。路由切换只
   重写 #appRoot 的内容,碰不到这个节点——这就是「一听不要中断」的全部秘诀:
   不销毁、不重建、不重设 src、不自动暂停,回到一起听时接着原来的进度放。 */
var MUS_ROOT_ID = 'global-media-root';
var musAudioEl = null;      /* 当前那个 <audio>(ended 捕获里会认成真正在播的节点) */
var musPlayingId = '';      /* 正在播/停在的那一首 */
var musApplying = false;    /* 正在跟随别的标签,期间的 play/pause 事件不许再广播 */
var musTesting = false;     /* 正在试候选音源,此时的 error 是「这个源不行」不是「这首歌坏了」 */
/* 镜像额度用尽时它返回的是 HTTP 200 + {"message":"请求次数已达上限，请明天再试"}。
   把原话留下来,好如实转达给用户,而不是笼统说「拉不到」。 */
var musMirrorMsg = '';
var musLtChan = null;       /* 同设备多标签同步 */

function musRoot() {
  var root = document.getElementById(MUS_ROOT_ID);
  if (!root) {
    root = document.createElement('div');
    root.id = MUS_ROOT_ID;
    root.setAttribute('aria-hidden', 'true');
    root.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden';
    document.body.appendChild(root);
  }
  return root;
}

function musAudio() {
  if (musAudioEl && musAudioEl.isConnected) return musAudioEl;
  var a = document.getElementById('music-audio');
  if (a && a.isConnected) {
    musAudioEl = a;
  } else {
    a = document.createElement('audio');
    a.id = 'music-audio';
    a.preload = 'auto';
    musRoot().appendChild(a);
    musAudioEl = a;
  }
  if (!musAudioEl._musWired) {
    musAudioEl._musWired = true;
    /* 程序化 play() 触发的 play 事件是异步的。没有这两道门控,别的标签会
       「听」到自己刚刚被执行的那次播放并再广播回去,A↔B 无限对播。 */
    musAudioEl.addEventListener('play', function () {
      if (!musApplying && !musAudioEl._musSuppress) {
        musLtSend({ type: 'play', id: musPlayingId, time: musAudioEl.currentTime });
      }
      /* 试候选音源时换 src 也会引发 play/pause —— 那不是用户意图。
         当成状态变化会引发一串无谓重绘,封面取不到时就是肉眼可见的闪。 */
      if (musTesting) return;
      musStateChanged();
    });
    musAudioEl.addEventListener('pause', function () {
      if (!musApplying && !musAudioEl._musSuppress) musLtSend({ type: 'pause' });
      if (musTesting) return;
      musStateChanged();
    });
    musAudioEl.addEventListener('seeked', function () {
      if (!musApplying && !musAudioEl._musSuppress) {
        musLtSend({ type: 'seek', time: musAudioEl.currentTime });
      }
    });
    musAudioEl.addEventListener('timeupdate', musProgressUi);
    musAudioEl.addEventListener('error', function () {
      /* 试候选音源时的 error 属于「这个源不行」,不许在这里判「整首歌废了」——
         否则受限歌会把整张歌单连着跳过去,表现成连续报「无法播放」。 */
      if (musTesting) return;
      if (musAudioEl._musQuiet) return;
      musAudioEl._musQuiet = true;
      setTimeout(function () { if (musAudioEl) musAudioEl._musQuiet = false; }, 1500);
      toast('这首歌暂时放不出来，正在试下一首', 'music');
      musAdvance();
    });
  }
  return musAudioEl;
}

/* 全站唯一一个 ended 捕获监听。一起听页会被反复重绘,播放器节点也可能被
   移入/移出,所以不能把 ended 绑在「某次初始化时保存的节点」上:捕获阶段
   筛出真正结束的那一个,进 handler 第一件事就是把它认成当前节点。 */
document.addEventListener('ended', function (ev) {
  var node = ev.target;
  if (!node || node.id !== 'music-audio') return;
  musAudioEl = node;
  musAdvance();
}, true);

/* ── C4b · 同设备多标签同步 ──────────────────────────────────────────── */
try {
  musLtChan = (typeof BroadcastChannel === 'function') ? new BroadcastChannel('listen-together') : null;
} catch (e) { musLtChan = null; }

if (musLtChan) {
  musLtChan.onmessage = function (e) {
    var m = e && e.data;
    if (!m || m._mine !== 1) return;
    /* 被中转过的消息一律不再执行 —— 这是乒乓的硬性终点 */
    if (m.hop && m.hop > 0) return;
    /* 兜底闸:2 秒内超过 10 条,说明已经在打乒乓,直接不接 */
    var now = Date.now();
    musLtRecent = musLtRecent.filter(function (t) { return now - t < 2000; });
    musLtRecent.push(now);
    if (musLtRecent.length > 10) return;
    /* 用户刚在本标签操作过:以本地意图为准,这段时间不理远端 ——
       否则你的暂停/切歌会被远端广播立刻覆盖掉(实测「点暂停也停不了」)。 */
    if (Date.now() - musLtMute < 2000) return;
    musApplying = true;
    try { musLtFollow(m); } catch (err) { /* 别的标签发来的动作坏了,不该带走本标签 */ }
    finally { musApplying = false; }
  };
}

var musLtRecent = [];       /* 回声洪水的兜底闸:短时间内收太多条就直接断 */
var musLtMute = 0;          /* 本标签刚被用户操作过的时间戳(本地意图优先) */
function musLtLocal() { musLtMute = Date.now(); }

function musLtSend(msg) {
  if (!musLtChan) return;
  msg._mine = 1;
  msg.hop = 0;
  try { musLtChan.postMessage(msg); } catch (e) { /* 频道没了就算了,不打断播放 */ }
}

/* 程序化改播放状态后短暂闭麦,避免回声 */
function musHush() {
  var ad = musAudio();
  ad._musSuppress = true;
  setTimeout(function () { if (ad) ad._musSuppress = false; }, 800);
}

/* 跟随别的标签。**必须先把闭麦标志打在 audio 元素上**,再去做异步起播。
   踩过的坑:只靠 onmessage 里的 musApplying 挡不住 —— musPlay 是异步的,
   等 play() 事件真正回来时 finally 早把它复位了,于是本标签又把这次「播放」
   广播出去,对方再放、再广播,无界乒乓。多标签同开时实测 12 秒重绘 656 次。 */
function musLtFollow(m) {
  var ad = musAudio();
  ad._musSuppress = true;
  function reopen() { setTimeout(function () { if (ad) ad._musSuppress = false; }, 800); }
  if (m.type === 'play') {
    /* 关键:**同一首就绝不要重设 src** —— 那会把歌从头起播。实测:8 条远端
       play 广播让同一首歌重播 7 次,表现就是「不受控制地反反复复播开头」。
       而且这里连 currentTime 也不能动:远端 play 带的往往是 time:0,一对齐
       又把歌拖回开头(残留 1 次的教训)。语义本来就该分开 ——
       play 只表示「该放着」,进度对齐交给 seek 消息。 */
    if (String(musPlayingId) === String(m.id) && ad.getAttribute('src')) {
      if (ad.paused) {
        var rp = ad.play();
        if (rp && rp.catch) rp.catch(function () { /* 交给自动播放策略提示 */ });
      }
      reopen();
      return;
    }
    musPlay(String(m.id), true).then(function () {
      if (typeof m.time === 'number') { try { ad.currentTime = m.time; } catch (e) { /* 元数据还没到 */ } }
      reopen();
    }, reopen);
  } else if (m.type === 'pause') {
    ad.pause();
    reopen();
  } else if (m.type === 'stop') {
    musStop(true);
    reopen();
  } else if (m.type === 'seek') {
    if (typeof m.time === 'number') { try { ad.currentTime = m.time; } catch (e) { /* 同上 */ } }
    reopen();
  } else {
    reopen();
  }
}

/* ── C4c · 取源与播放 ─────────────────────────────────────────────────
   A 级接口纪律:多镜像轮询 + outer/url 降级 + 单次 ≤8s 超时主动中断,
   失败给中文提示,绝不静默。 */
function musFetchJson(url, ms) {
  return new Promise(function (resolve, reject) {
    if (typeof fetch !== 'function') { reject(new Error('这个环境没有 fetch')); return; }
    var ctl = null, timer = null;
    try { ctl = new AbortController(); } catch (e) { ctl = null; }
    var opt = { cache: 'no-store' };
    if (ctl) {
      opt.signal = ctl.signal;
      timer = setTimeout(function () { try { ctl.abort(); } catch (e) { /* 已经结束了 */ } }, ms);
    }
    fetch(url, opt).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function (data) {
      if (timer) clearTimeout(timer);
      resolve(data);
    }, function (err) {
      if (timer) clearTimeout(timer);
      reject(err);
    });
  });
}

/* 依次试候选音源,任一能开始播就算成功。
   用属性赋值(oncanplay/onerror)而不是 addEventListener:候选会换好几个,
   监听器累积起来会让旧候选的回调在新候选上误触发。 */
function musTrySource(src, budgetMs) {
  return new Promise(function (resolve) {
    var ad = musAudio();
    musTesting = true;
    var done = false;
    function fin(ok) {
      if (done) return;
      done = true;
      if (ad.__musT) { clearTimeout(ad.__musT); ad.__musT = null; }
      ad.oncanplay = null;
      ad.onloadeddata = null;
      ad.onerror = null;
      musTesting = false;
      resolve(ok);
    }
    ad.oncanplay = function () { fin(true); };
    ad.onloadeddata = function () { fin(true); };
    ad.onerror = function () { fin(false); };
    ad.__musT = setTimeout(function () { fin(false); }, budgetMs || 8000);
    try { ad.src = src; ad.load(); } catch (e) { fin(false); return; }
    var p = ad.play();
    if (p && p.catch) p.catch(function () { /* 被拦时交给 oncanplay / 超时兜底 */ });
  });
}

/* 返回值就是「到底放起来了没有」——调用方要靠它决定是否继续试下一首,
   吞掉异常只把状态置成 stopped 是踩过的坑(自然结束后就再也续不上)。 */
function musPlaySong(song, silent) {
  var ad = musAudio();
  musPlayingId = String(song.id);
  musPushHist(song);
  musSyncUi();
  if (state.route === 'music') paint();
  var srcs = musSrcCandidates(song, METING_MIRRORS);
  var i = 0;
  /* 整首歌的总预算。6 个候选 × 8 秒 = 沉默 48 秒,用户只会觉得「点开动不了」。
     给个上限:到点就明确说放不出来,别耗着;首个候选仍给足 8 秒(镜像偶尔慢),
     后面的兜底候选缩短到 4 秒 —— 它们本来成功率就低,不值得再等那么久。 */
  var deadline = Date.now() + 12000;
  function step() {
    if (i >= srcs.length || (i > 0 && Date.now() > deadline)) {
      if (!silent) {
        toast(musMirrorMsg
          ? ('放不出来：镜像回了「' + musMirrorMsg + '」')
          : '这首歌暂时放不出来（可能无版权或地区限制）', 'close');
      }
      musPlayingId = '';
      musSyncUi();
      if (state.route === 'music') paint();
      return false;
    }
    return musTrySource(srcs[i++], i === 1 ? 8000 : 4000).then(function (ok) {
      if (ok) {
        /* 音源本身没问题,但浏览器可能因为「没有用户手势」拦下自动播放。
           这里必须如实说清楚:不能装作在播——否则进度条停在 0、播放键还是
           「播放」,用户只会以为功能坏了。点一下播放键(带真实手势)就能放。 */
        if (ad.paused && !silent) toast('浏览器拦下了自动播放，点一下播放键就行', 'music');
        musStateChanged();
        return true;
      }
      return step();
    });
  }
  return Promise.resolve().then(step);
}

function musPlay(id, silent) {
  var s = null;
  for (var i = 0; i < MUSIC.songs.length; i++) {
    if (String(MUSIC.songs[i].id) === String(id)) s = MUSIC.songs[i];
  }
  if (!s) { if (!silent) toast('歌单里没有这首歌', 'close'); return Promise.resolve(false); }
  return musPlaySong(s, silent);
}

/* 自然播完(或当前曲放不出来)时接管:按当前模式依次试,全试完才停 */
function musAdvance() {
  var list = MUSIC.songs || [];
  if (!list.length) { musHalt(); return; }
  var cands = musNextCandidates(list, musPlayingId, MUSIC.mode);
  var i = 0;
  function step() {
    if (i >= cands.length) {
      musHalt();
      toast('歌单里没有能播的歌了', 'close');
      return;
    }
    musPlaySong(cands[i++], true).then(function (ok) { if (!ok) step(); });
  }
  step();
}

function musSkip(dir) {
  musLtLocal();
  var list = MUSIC.songs || [];
  if (!list.length) { toast('歌单里还没有歌', 'close'); return; }
  var idx = -1;
  for (var i = 0; i < list.length; i++) {
    if (String(list[i].id) === String(musPlayingId)) idx = i;
  }
  if (idx < 0) idx = 0;
  musPlay(String(list[(idx + dir + list.length) % list.length].id), false);
}

/* 主动清源会触发一次 error 事件,先闭麦再清,免得被误判成「这首歌坏了」 */
function musClearAudio() {
  var ad = musAudio();
  ad._musQuiet = true;
  try { ad.pause(); ad.removeAttribute('src'); ad.load(); } catch (e) { /* 已经空了 */ }
  setTimeout(function () { if (musAudioEl) musAudioEl._musQuiet = false; }, 1500);
}

function musHalt() {
  musClearAudio();
  musPlayingId = '';
  musSyncUi();
  if (state.route === 'music') paint();
}

function musStop(fromRemote) {
  if (!fromRemote) musLtLocal();
  musHalt();
  if (!fromRemote) musLtSend({ type: 'stop' });
}

function musToggleRow(id) {
  musLtLocal();
  if (String(musPlayingId) === String(id) && musIsPlaying()) {
    musAudio().pause();
    musSyncUi();
    if (state.route === 'music') paint();
    return;
  }
  musPlay(id, false);
}

/* ── C4d · 歌单维护 ─────────────────────────────────────────────────── */
function musPushHist(song) {
  var h = [song].concat(MUSIC.hist.filter(function (x) { return String(x.id) !== String(song.id); }));
  MUSIC.hist = h.slice(0, 50);
  save();
}

function musExpandPlaylist(pl) {
  if (state.musicAdd.busy) { toast('正在解析歌单…', 'music'); return; }
  state.musicAdd.busy = true;
  state.musicAdd.err = '';
  toast('正在解析歌单…', 'music');
  paint();
  var tried = 0;
  function next() {
    if (tried >= METING_MIRRORS.length) {
      state.musicAdd.busy = false;
      state.musicAdd.err = musMirrorMsg
        ? ('镜像回了：' + musMirrorMsg + '（这不是本站的问题，换个时间再试；也可以逐首粘贴单曲链接）')
        : '几个镜像都没拉到这张歌单，过一会儿再试，或者逐首粘贴单曲链接';
      paint();
      return;
    }
    var base = METING_MIRRORS[tried++];
    var url = musWithQuery(base, 'server=netease&type=playlist&id=' + encodeURIComponent(pl.id));
    musFetchJson(url, 8000).then(function (data) {
      /* 镜像用 200 回了一句错误话(最常见就是额度用尽) —— 原样记下来 */
      if (data && !Array.isArray(data) && data.message) {
        musMirrorMsg = String(data.message);
        next();
        return;
      }
      var tracks = Array.isArray(data) ? data
        : ((data && data.tracks) || (data && data.playlist && data.playlist.tracks) || []);
      if (!tracks.length) { next(); return; }
      var added = 0;
      tracks.forEach(function (t) {
        var n = musTrackOf(t);
        if (n && musAddUnique(MUSIC.songs, n)) added++;
      });
      if (/^歌单 /.test(pl.name)) {
        var pname = (data && data.playlist && data.playlist.name) || (data && data.name) || '';
        if (pname) pl.name = String(pname).slice(0, 30);
      }
      state.musicAdd.busy = false;
      state.musicAdd.text = '';
      state.musicAdd.err = '';
      state.sheet = null;
      save();
      paint();
      toast(added > 0 ? ('从歌单拉取 ' + added + ' 首') : '这张歌单里的歌都已经在列表里了', 'music');
    }).catch(function () { next(); });
  }
  next();
}

function musAddFromText(text) {
  var p = musParse(text);
  if (!p) { state.musicAdd.err = '认不出这条链接，粘贴网易云单曲或歌单的分享文本试试'; paint(); return false; }
  if (p.type === 'album' || p.type === 'artist') {
    state.musicAdd.err = '只支持单曲或歌单，专辑页和歌手页这边打不开'; paint(); return false;
  }
  if (p.type === 'playlist') { musExpandPlaylist(p); return true; }
  if (!musAddUnique(MUSIC.songs, p)) {
    state.musicAdd.err = ''; state.musicAdd.text = ''; state.sheet = null;
    paint(); toast('这首歌已经在歌单里了', 'check'); return true;
  }
  state.musicAdd.err = '';
  state.musicAdd.text = '';
  state.sheet = null;
  save();
  paint();
  toast('已添加《' + p.name + '》', 'music');
  return true;
}

/* ── C4e · 界面读数 ─────────────────────────────────────────────────── */
function musCur() {
  for (var i = 0; i < MUSIC.songs.length; i++) {
    if (String(MUSIC.songs[i].id) === String(musPlayingId)) return MUSIC.songs[i];
  }
  return null;
}
function musIsPlaying() {
  var ad = musAudioEl;
  return !!(ad && ad.getAttribute('src') && !ad.paused);
}
function musCurSec() {
  var ad = musAudioEl;
  return (ad && isFinite(ad.currentTime)) ? Math.floor(ad.currentTime) : 0;
}
function musPct() {
  var ad = musAudioEl;
  if (!ad || !isFinite(ad.duration) || ad.duration <= 0) return 0;
  return Math.min(100, ad.currentTime / ad.duration * 100);
}
function musDurText() {
  var ad = musAudioEl;
  return (ad && isFinite(ad.duration) && ad.duration > 0) ? fmt(Math.floor(ad.duration)) : '--:--';
}
function musModeLabel() {
  return MUSIC.mode === 'random' ? '随机循环' : (MUSIC.mode === 'single' ? '单曲循环' : '列表循环');
}
function musSyncLine() {
  var l = dmList();
  var n1 = l.length ? person(l[0].id).name : 'TA';
  return n1 + ' 正在和你一起听';
}
function musAvatarPair() {
  var l = dmList().slice(0, 2);
  if (!l.length) return '<span class="avatar" data-tone="1">云</span>';
  return l.map(function (p) { return avatar(p.id, 'a22'); }).join('');
}

/* 进度只动数字和宽度,不重绘页面 —— timeupdate 一秒来好几次,整页重绘会卡 */
function musProgressUi() {
  var ad = musAudioEl;
  var cur = (ad && isFinite(ad.currentTime)) ? ad.currentTime : 0;
  var dur = (ad && isFinite(ad.duration)) ? ad.duration : 0;
  var pct = dur > 0 ? Math.min(100, cur / dur * 100) : 0;
  var fill = document.getElementById('seekFill');
  if (fill) fill.style.width = pct + '%';
  var now = document.getElementById('seekNow');
  if (now) now.textContent = fmt(Math.floor(cur));
  var total = document.getElementById('seekTotal');
  if (total) total.textContent = dur > 0 ? fmt(Math.floor(dur)) : '--:--';
  var hwFill = document.getElementById('homeMusicFill');
  if (hwFill) hwFill.style.width = pct + '%';
  var hwTime = document.getElementById('homeMusicTime');
  if (hwTime) hwTime.textContent = fmt(Math.floor(cur));
}

function musSubText() {
  var s = musCur();
  if (!s) return '还没有在听的歌';
  return (musIsPlaying() ? '正在播放' : '已暂停') + ' · 《' + s.name + '》';
}

/* 播放状态变了之后,把已经画好的 DOM 对齐真实状态(不重绘整页) */
/* ── 封面节点缓存 ─────────────────────────────────────────────────────
   为什么必须缓存:镜像的封面图不带缓存头,而整页重绘会重建 <img>。实测
   每次从首页/聊天切回一起听,21 张封面会**全部重新请求**(5 趟 = 105 次);
   用户「只拉了一次歌单」却把额度烧光,就是这么来的。
   同一个 <img> 节点反复搬动不会触发网络请求,所以这里按 URL 复用节点。 */
/* 按 URL 的**节点池**:同一张封面需要几个槽,就给几个不同的 <img>。
   为什么不只留一个节点:一个 <img> 只能待在一个地方。大图和小封面常常
   指向同一张图(当前播放那首:大图 + 它自己那一行),只缓存一个节点的话,
   第二轮会把它从大图搬进小封面 —— 大图就被掏空了(实测踩过)。 */
var musCoverPool = {};

function musMountCovers() {
  var slots = document.querySelectorAll('[data-pic]');
  var used = {};                       /* 本轮里每个 url 已经认领到第几个节点 */
  for (var i = 0; i < slots.length; i++) {
    var slot = slots[i];
    var url = slot.getAttribute('data-pic');
    if (!url) continue;
    var n = used[url] || 0;
    used[url] = n + 1;
    var pool = musCoverPool[url] || (musCoverPool[url] = []);
    var img = pool[n];
    if (!img) {
      img = document.createElement('img');
      img.alt = '';
      img.setAttribute('referrerpolicy', 'no-referrer');
      /* 直链取不到(算法哪天失效/图被删)就退回镜像那张原图 —— 糊,但不破图 */
      img.onerror = function () {
        var fbu = this.getAttribute('data-fb');
        if (fbu && this.getAttribute('src') !== fbu) {
          this.onerror = null;
          this.setAttribute('src', fbu);
        }
      };
      img.setAttribute('data-fb', slot.getAttribute('data-fb') || '');
      img.setAttribute('src', url);    /* 同一 url 的第 n 个节点,浏览器走缓存 */
      pool[n] = img;
    }
    if (img.parentNode !== slot) {
      slot.innerHTML = '';
      slot.appendChild(img);
    }
  }
}

function musSyncUi() {
  var s = musCur();
  var playing = musIsPlaying();
  var btn = document.querySelector('[data-act="music-play"]');
  if (btn) {
    btn.innerHTML = ic(playing ? 'pause' : 'play');
    btn.setAttribute('aria-label', playing ? '暂停' : '播放');
  }
  /* 副标题**只在「一起听」那一页**改写:每一屏的 sub 都渲染在同一个 .nav-sub
     上,无条件改写会把设置 / 塔罗 / 联系人 / 通话……的副标题统统一首歌名
     (第11单留下的坑:全站 18 个带副标题的页面全被波及,看到的都是
     「还没有在听的歌」)。这里只为「在本页听歌时那行字跟手」,其它页面
     重绘时自己会把自己的 sub 写回来,不需要这份实时更新。 */
  if (state.route === 'music') {
    var sub = document.querySelector('#appRoot [data-od-id="screen-music"] .nav-sub');
    if (sub) sub.textContent = musSubText();
  }
  var hwTitle = document.getElementById('homeMusicTitle');
  if (hwTitle) hwTitle.textContent = s ? s.name : '还没有在听的歌';
  var hwMark = document.getElementById('homeMusicMark');
  if (hwMark) hwMark.className = playing ? 'mw-mark is-playing' : 'mw-mark';
  musMountCovers();
  musProgressUi();
}

/* 起播/暂停之后必须走这里,但**不要**在这里整页重绘:
   换音源会引发 play/pause,点一次播放能触发几十次;每次整页重绘都会新建
   所有 <img>,浏览器就得把每张封面重新请求+解码一遍。封面一旦取不到
   (镜像挂了/图被删),看到的就是界面一直闪 —— 实测 30 秒 43 次重绘。
   所以只改该改的几个节点:播放键、导航副标题、当前行标记。 */
function musStateChanged() {
  musSyncUi();
  musMarkCurrentRow();
}

/* 只动「当前行」的播放标记,不碰别的节点 */
function musMarkCurrentRow() {
  var rows = document.querySelectorAll('#appRoot .queue-row');
  if (!rows.length) return;
  var playing = musIsPlaying();
  for (var i = 0; i < rows.length; i++) {
    var el = rows[i];
    var isCur = String(el.getAttribute('data-id')) === String(musPlayingId);
    if (isCur) el.classList.add('on'); else el.classList.remove('on');
    var end = el.querySelector('.ri-end');
    if (!end) continue;
    if (isCur && playing) {
      if (!end.querySelector('.eq')) {
        end.innerHTML = '<span class="eq" aria-label="正在播放"><i></i><i></i><i></i></span>';
      }
    } else if (isCur) {
      if (!end.querySelector('.ri-time')) end.innerHTML = '<span class="ri-time">已暂停</span>';
    }
  }
}

/* ── C4f · 一起听屏幕 ─────────────────────────────────────────────────
   布局沿用原来那一列:专辑大图 → 歌名 → 歌手 → 时间 → 进度条 → 播放键 →
   同步条 → 列表。只是把它从「定时器假装的进度」换成了真的在响的音频。 */
function renderMusic() {
  var s = musCur();
  var playing = musIsPlaying();
  var tab = (state.musicTab === 'hist') ? 'hist' : 'list';

  /* 有真封面就不出内容(封面由外层 .album 的 data-pic 挂载);
     没有才退回站内那张氛围示意图,并如实标注。
     注意:**这里绝不能再套一层 .album** —— 外层模板已经有一个了,
     套两层会渲染出嵌套的双层容器(还带重复的 data-od-id),
     封面会被夹在两层边框里(我踩过这个坑)。 */
  var hero = (s && s.pic) ? '' : '<div class="scene" data-scene="dusk">' +
    '<span class="scene-tag">还没有封面 · 贴上歌曲链接后显示</span></div>';

  function coverOf(q) {
    if (!q.pic) return '<span class="mq-cover"><span class="mq-note">♪</span></span>';
    return '<span class="mq-cover" data-pic="' + esc(musCdnPic(q.pic, 120)) + '"' +
      ' data-fb="' + esc(q.pic) + '"></span>';
  }

  var queue = MUSIC.songs.map(function (q, n) {
    var cur = s && String(q.id) === String(s.id);
    return '<div class="row-item queue-row' + (cur ? ' on' : '') + '" data-act="track" data-id="' + esc(q.id) + '" ' +
      'data-od-id="music-track-' + n + '">' +
      coverOf(q) +
      '<span class="ri-body"><span class="ri-t">' + esc(q.name) + '</span>' +
      '<span class="ri-s">' + esc(q.artist || '未知歌手') + '</span></span>' +
      '<span class="ri-end">' + (cur && playing
        ? '<span class="eq" aria-label="正在播放"><i></i><i></i><i></i></span>'
        : '<span class="ri-time">' + (cur ? '已暂停' : '待播') + '</span>') + '</span>' +
      '<button class="mq-del" data-act="music-del" data-id="' + esc(q.id) + '" ' +
        'aria-label="从歌单删除《' + esc(q.name) + '》">' + ic('trash') + '</button>' +
      '</div>';
  }).join('');

  var hist = MUSIC.hist.map(function (q, n) {
    return '<div class="row-item queue-row" data-act="track" data-id="' + esc(q.id) + '" ' +
      'data-od-id="music-hist-' + n + '">' + coverOf(q) +
      '<span class="ri-body"><span class="ri-t">' + esc(q.name) + '</span>' +
      '<span class="ri-s">' + esc(q.artist || '未知歌手') + '</span></span></div>';
  }).join('');

  var segTabs = '<div class="seg-tabs" data-od-id="music-tabs">' +
    [['list', '歌单', MUSIC.songs.length], ['hist', '历史', MUSIC.hist.length]].map(function (t) {
      var on = tab === t[0];
      return '<button class="seg-tab' + (on ? ' on' : '') + '" data-act="music-tab" data-v="' + t[0] + '" ' +
        'aria-pressed="' + on + '" data-od-id="music-tab-' + t[0] + '">' + t[1] + ' · ' + t[2] + '</button>';
    }).join('') + '</div>';

  var rows = (tab === 'hist')
    ? (MUSIC.hist.length ? hist : '<p class="empty-note">还没有播放记录。随便放一首歌就会记在这里。</p>')
    : (MUSIC.songs.length ? queue
       : '<p class="empty-note">歌单还是空的。点下面的「添加歌曲」粘贴一条网易云分享链接，就能和 TA 一起听了。</p>');

  return appShell({
    id: 'screen-music', back: '#home', title: '一起听',
    sub: musSubText(),
    acts: navAct('music-add', 'plus', '添加歌曲'),
    body: '<div class="pad pad-b">' +
      '<div class="album" data-od-id="music-album"' +
        (s && s.pic ? ' data-pic="' + esc(musCdnPic(s.pic, 500)) + '" data-fb="' + esc(s.pic) + '"' : '') +
        '>' + hero + '</div>' +
      '<div class="track-title">' + esc(s ? s.name : '还没有在播放') + '</div>' +
      '<div class="track-artist">' + esc(s ? (s.artist || '未知歌手') : '贴一首网易云链接，和 TA 一起听') + '</div>' +
      '<div class="track-time"><span class="num" id="seekNow">' + fmt(musCurSec()) + '</span>' +
        '<span class="num" id="seekTotal">' + musDurText() + '</span></div>' +
      '<div class="seek" id="seekBar" data-act="music-seek" role="slider" aria-label="播放进度" ' +
        'aria-valuenow="' + Math.round(musPct()) + '"><i id="seekFill" style="width:' + musPct() + '%"></i></div>' +
      '<div class="transport">' +
        '<button class="tbtn" data-act="music-prev" aria-label="上一首">' + ic('prev') + '</button>' +
        '<button class="tplay" data-act="music-play" aria-label="' + (playing ? '暂停' : '播放') + '" data-od-id="music-play">' +
          ic(playing ? 'pause' : 'play') + '</button>' +
        '<button class="tbtn" data-act="music-next" aria-label="下一首">' + ic('next') + '</button>' +
        '<button class="tbtn" data-act="music-stop" aria-label="停止播放">' + ic('close') + '</button>' +
      '</div>' +
      '<div class="now-sync" data-od-id="music-sync"><span class="avatars">' + musAvatarPair() + '</span>' +
        '<span>' + esc(musSyncLine()) + '</span></div>' +
      '<div class="chip-row" style="margin-top:12px">' +
        '<button class="chip-pick" data-act="music-add" data-od-id="music-add-chip">' + ic('plus') + '添加歌曲</button>' +
        '<button class="chip-pick" data-act="music-mode" data-od-id="music-mode-chip">' + ic('refresh') + musModeLabel() + '</button>' +
      '</div>' +
      segTabs +
      '<div class="section-label" style="margin-top:20px">' +
        (tab === 'hist' ? '播放历史 · ' + MUSIC.hist.length + ' 首' : '歌单 · ' + MUSIC.songs.length + ' 首') + '</div>' +
      '<div class="list" data-od-id="music-list">' + rows + '</div>' +
    '</div>'
  });
}
/* ==== MUSIC-MODULE-END ==== */

/* ── C5 · EMOJI(表情包:内置 emoji 字符 + 相册导入的图片) ─────────────── */
/* 面板在看谁的表情库:聊天页就是当前会话,否则退回第一个联系人 */
function emojiActiveCid() {
  if (state.route === 'chat-thread' && state.param && cidExists(state.param)) return state.param;
  if (state.emojiSheet && state.emojiSheet.cid && cidExists(state.emojiSheet.cid)) return state.emojiSheet.cid;
  return firstCid();
}

function emojiTabsHTML(cur) {
  return EMOJI.tabs.map(function (t) {
    var on = (t.id === cur);
    return '<button data-act="emoji-tab" data-v="' + esc(t.id) + '" class="' + (on ? 'on' : '') +
      '" aria-pressed="' + on + '" data-od-id="emj-tab-' + esc(t.id) + '">' + esc(t.name) + '</button>';
  }).join('');
}

/* mode: 'send' 点选即发送 | 'insert' 插进信里 | 'manage' 管理
   manage 里把隐藏项也画出来(灰掉)并且带 ✕;send/insert 只看可见项 */
function emojiGridHTML(tabId, mode) {
  var list = EMOJI.items.filter(function (it) { return it.tab === tabId; });
  if (mode !== 'manage') list = list.filter(function (it) { return it.on !== false; });
  if (!list.length) {
    return '<p class="emj-empty" data-od-id="emj-empty">' +
      (mode === 'manage' ? '这个分组还没有表情，点下面「从相册导入」加几张' : '这个分组还没有表情') + '</p>';
  }
  return '<div class="emj-grid" data-od-id="emj-grid">' + list.map(function (it) {
    var off = (mode === 'manage' && it.on === false) ? ' off' : '';
    var act = mode === 'manage' ? 'emoji-hide' : (mode === 'insert' ? 'emoji-insert' : 'emoji-send');
    /* ✕ 用 span(不是 button):button 不能嵌 button,而且 closest('[data-act]')
       会先命中这个更靠里的 ✕,不会连带触发外层的隐藏/发送 */
    var x = mode === 'manage'
      ? '<span class="emj-x" data-act="emoji-del" data-id="' + esc(it.id) + '" role="button" ' +
        'aria-label="删除这个表情" data-od-id="emj-del-' + esc(it.id) + '">✕</span>'
      : '';
    return '<button class="emj-item' + off + '" data-act="' + act + '" data-id="' + esc(it.id) + '" ' +
      'aria-label="' + (it.img ? '图片表情' : esc(it.ch)) + '" data-od-id="emj-item-' + esc(it.id) + '">' +
      emojiBodyHTML(it) + x + '</button>';
  }).join('') + '</div>';
}

function emojiPanelHTML(mode, cid) {
  var useCid = cid || emojiActiveCid();
  var cur = emojiTabOf(useCid);
  var head = '<div class="tabs emj-tabs" data-od-id="emj-tabs">' + emojiTabsHTML(cur) + '</div>';
  /* 导入进度就写在这条线上(「已处理 3/12」),不整块重绘,免得把文件选择器打断 */
  var prog = '<div class="emj-prog" id="emjProg" role="status" aria-live="polite"></div>';
  var grid = emojiGridHTML(cur, mode);
  var foot;
  if (mode === 'manage') {
    foot = '<div class="emj-actions">' +
        '<button class="chip-pick" data-act="emoji-import" data-v="' + esc(cur) + '" data-od-id="emj-import">' + ic('upload') + '从相册导入</button>' +
        '<button class="chip-pick" data-act="emoji-new-tab" data-od-id="emj-new-tab">' + ic('plus') + '新建分组</button>' +
      '</div>' +
      '<div class="emj-actions">' +
        '<button class="chip-pick" data-act="emoji-ren-tab" data-v="' + esc(cur) + '" data-od-id="emj-ren-tab">' + ic('edit') + '重命名分组</button>' +
        '<button class="chip-pick danger" data-act="emoji-del-tab" data-v="' + esc(cur) + '" data-od-id="emj-del-tab">' + ic('trash') + '删除分组</button>' +
      '</div>' +
      '<p class="emj-hint">导入支持一次选多张（按原比例压缩，不裁剪）；点右上角 ✕ 删单个，点表情本体可隐藏/显示 —— 隐藏的表情 TA 抽不到。</p>';
  } else {
    foot = '<p class="emj-hint">点一下就发出去。想加自己的图？进「管理」从相册导入。</p>';
  }
  return head + prog + grid + foot;
}

/* 表情包管理页(#emoji) */

  var cid = emojiActiveCid();
  return appShell({

}

/* ── C6 · CONTACTS ──────────────────────────────────────────────────── */
function renderContacts() {
  var q = state.query.trim();
  var hit = function (p) { return !q || p.name.indexOf(q) >= 0; };
  var friends = PEOPLE.filter(hit), groups = GROUPS.filter(hit);

  var row = function (p) {
    return '<button class="row-item" data-act="open-chat" data-id="' + p.id + '" data-od-id="contact-row-' + p.id + '">' +
      avatar(p.id, 'a44') +
      '<span class="ri-body"><span class="ri-t">' + esc(p.name) + '</span>' +
      '<span class="ri-s">' + esc(p.note || (p.members ? p.members.length + ' 人' : '')) + '</span></span>' +
      ic('fwd', 'chev') + '</button>';
  };

  var body = '';
  if (friends.length) body += '<div class="section-label">我的好友 · ' + friends.length + '</div>' +
    '<div class="list" data-od-id="contact-list-friends">' + friends.map(row).join('') + '</div>';
  if (groups.length) body += '<div class="section-label" style="margin-top:24px">群聊 · ' + groups.length + '</div>' +
    '<div class="list" data-od-id="contact-list-groups">' + groups.map(row).join('') + '</div>';
  if (!friends.length && !groups.length) body = '<p class="empty-note">没有找到「' + esc(q) + '」</p>';

  return appShell({
    id: 'screen-contacts', back: '#home', title: '联系人', sub: PEOPLE.length + ' 位好友 · ' + GROUPS.length + ' 个群聊',
    body: '<div class="pad">' +
      '<div class="search-field">' + ic('search') +
      '<input class="input" id="contactSearch" type="search" placeholder="搜索联系人" aria-label="搜索联系人" ' +
      'value="' + esc(state.query) + '"></div>' +
      '<div style="margin-top:16px">' + body + '</div></div>',
    fab: '<button class="fab" data-act="sheet-newcontact" aria-label="新建联系人" data-od-id="contacts-fab-new">' + ic('personAdd') + '</button>'
  });
}

/* 时长读数用「分」为主,不足 1 分钟显示秒(别写成 0 分) */
function callMinsText(sec) {
  sec = Math.max(0, Math.round(sec || 0));
  if (sec < 60) return sec + '秒';
  return Math.floor(sec / 60) + '分';
}

/* ── C8 · CARD LIBRARY ────────────────────────────────────────────────────

function libHit(text) {
  var q = state.libQuery.trim().toLowerCase();
  return !q || String(text).toLowerCase().indexOf(q) >= 0;
}

/* ── D1 · LOOKUPS ───────────────────────────────────────────────────── */
function findLetter(id) {
  for (var i = 0; i < LETTERS.length; i++) if (LETTERS[i].id === id) return LETTERS[i];
  return LETTERS[0];
}
function findMoment(id) {
  for (var i = 0; i < MOMENTS.length; i++) if (MOMENTS[i].id === id) return MOMENTS[i];
  return MOMENTS[0];
}
/* 严格版:找不到就是找不到。删除/回信这类会改数据的入口一律用它,
   免得 id 失效时误伤列表里的第一条。 */
function momentById(id) {
  if (!id) return null;
  for (var i = 0; i < MOMENTS.length; i++) if (MOMENTS[i].id === id) return MOMENTS[i];
  return null;
}
function letterById(id) {
  if (!id) return null;
  for (var i = 0; i < LETTERS.length; i++) if (LETTERS[i].id === id) return LETTERS[i];
  return null;
}

function sheetHTML() {
  var s = state.sheet;
  if (!s) return '';
